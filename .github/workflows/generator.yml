              if (item.metaStatus === 'failed') throw new Error(`${item.folder}: metadata failed (${item.metaError || 'Gemini error'}). Press Redo or Edit it manually before distributing.`);
              throw new Error(`${item.folder}: no metadata yet — ${state.metaWorker.available ? 'press 🧠 Generate metadata or Edit it manually' : 'GEMINI_SESSION is missing, so type title / tags / category with Edit'}. Records without metadata are skipped by the Zedge bot.`);
