                let skipped = 0;
                if (body.ids === 'all' && state.settings.requireMetadata && !body.force) { const ok = items.filter(i => i.meta && i.meta.title); skipped = items.length - ok.length; items = ok; }
                if (!items.length) throw new Error(skipped ? `${skipped} item(s) have no metadata yet — wait for Gemini or use Edit (Zedge bot skips records without title/tags/category).` : 'Nothing to distribute (only fully generated, not-yet-distributed items are sent).');
                // single item without metadata → let distributeItem throw its precise reason back to the panel
                if (items.length === 1 && state.settings.requireMetadata && !body.force && !(items[0].meta && items[0].meta.title)) await distributeItem(items[0], target);
                log(`🚀 Distributing ${items.length} item(s) → ${target}${skipped ? ` (${skipped} skipped: no metadata yet)` : ''}`);
                (async () => { for (const it of items) { try { await distributeItem(it, target, { force: !!body.force }); } catch (e) { if (!/^\S+: (Gemini|metadata|no metadata)/.test(e.message)) log(`🚫 ${e.message}`); } } })();
                return json(res, 200, { ok: true, count: items.length, skipped });
              }
              if (p === '/api/meta/run') {
                if (!state.metaWorker.available) throw new Error(GEMINI_AVAILABLE ? 'image_metadata.mjs not found on the runner' : 'GEMINI_SESSION secret / gemini_session input is missing — type metadata manually with Edit');
                let n = 0; for (const it of state.items) if (it.status === 'done' && !(it.meta && it.meta.title) && it.metaStatus !== 'queued' && it.metaStatus !== 'running') { if (queueMetadata(it, 'panel')) n++; }
                if (!n) { state.metaWorker.restarts = 0; ensureMetaWorker('panel'); }
                return json(res, 200, { ok: true, queued: n });
              }
              if (p === '/api/meta/refresh') { await refreshFirebaseMeta(true); return json(res, 200, { ok: true }); }
              if (p === '/api/meta/redo') { const item = state.items.find(i => i.id === body.id); if (!item) throw new Error('item not found'); if (item.status !== 'done') throw new Error('item is not fully generated yet'); state.metaWorker.restarts = 0; const n = await redoMetadata(item); return json(res, 200, { ok: true, queued: n }); }
              if (p === '/api/meta/set') {
                const item = state.items.find(i => i.id === body.id); if (!item) throw new Error('item not found');
                setManualMeta(item, body);
                let patched = 0;
                if (item.distributed.length) patched = await patchDistributed(item, 'set manually');
                else maybeAutoDistribute(item);
                return json(res, 200, { ok: true, patched, meta: item.meta });
              }
              if (p === '/api/finish') { json(res, 200, { ok: true }); return finish('finished from panel'); }
              return json(res, 404, { error: 'not found' });
            } catch (e) {
              return json(res, 400, { error: e.message });
            }
          });

          // ─── PANEL (single HTML page; polls /api/state) ────────────────────────────
          // Brand logo (served at /logo.svg — favicon + panel icon; also used on the 401 page)
          const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><path fill="#f5f4e8" d="M0 0h1024v1024H0z"/><path fill="#fe4102" d="M749.547 234.206c7.203-.797 16.731-.127 23.688 1.651a62.8 62.8 0 0 1 37.828 28.361c10.46 17.783 8.385 36.29 8.386 56.031l.017 50.469-.03 158.615-.02 140.609-.011 37.604c-.006 11.604.954 25.94-2.065 37.032-17.484 64.482-118.221 59.355-127.653-7.451-1.673-11.845-.747-28-.723-40.267l.153-58.906c.001-16.78 1.265-30.843-7.498-45.961a54.96 54.96 0 0 0-33.846-25.535c-13.786-3.524-50.501-2.578-64.707.272-28.207 5.659-49.278 29.949-56.365 57.391-2.349 12.084-2.007 25.808-2.248 38.156l-.907 48.032c-.124 10.159.253 22.803-1.987 32.51a58.8 58.8 0 0 1-11.613 23.95 63.56 63.56 0 0 1-42.665 22.964c-17.589 1.852-34.751-2.532-48.486-13.875a61.93 61.93 0 0 1-22.567-42.653c-.665-7.276-.111-17.591.03-25.159q.221-17.03.245-34.06c.349-67.503-.817-118.909 45.282-174.417 33.086-39.84 80.38-62.643 131.946-63.422 20.906-.315 42.737.833 63.553-.267 11.355-.601 24.366-5.902 32.846-13.634 21.158-19.293 19.975-37.268 19.983-62.748l-.011-42.638c.001-10.755-.598-26.029 1.746-36.179a58.5 58.5 0 0 1 12.004-24.36c12.135-14.356 27.325-20.568 45.695-22.115"/><path d="M304.965 233.706c17.092.193 32.223 4.016 45.067 15.744 21.139 19.302 19.942 35.578 21.111 61.08 1.175 25.661 5.881 66.171 25.801 83.712 7.713 6.791 16.95 9.605 27.305 8.861 40.524-2.911 44.31-62.445 48.011-93 1.22-10.075 1.054-21.55 3.647-31.478a55.9 55.9 0 0 1 11.463-21.941c23.442-27.466 66.903-30.825 94.19-7.331 19.416 16.715 20.192 34.448 21.976 57.972l2.446 31.628c2.14 26.223 4.968 53.9 6.607 79.998-31.962.462-56.299-1.685-87.843 6.778-53.461 14.345-88.497 45.502-115.955 92.064-3.629 6.644-6.916 12.637-9.702 19.711-26.756-.251-49.923 11.027-58.658 37.872-3.971 12.207-2.863 28.992-2.92 42.037l-.842 84.927c-.139 10.606.673 29.904-1.274 39.558a55.9 55.9 0 0 1-12.238 25.513 65.14 65.14 0 0 1-44.89 22.791c-17.866 1.44-37.473-3.375-51.287-15.162a61.62 61.62 0 0 1-21.546-42.126c-.561-7.683.65-19.383 1.294-27.404l3.588-42.827 13.355-158.036 11.678-141.16a4507 4507 0 0 1 4.233-50.199c1.775-21.384.924-40.949 16.51-58.015 13.512-14.795 29.226-20.345 48.873-21.567M602.396 581.24c17.51-.242 35.024-.174 52.532.204 2.704 35.764 7.372 71.431 10.1 107.272 2.178 28.609 8.843 57.157-12.849 80.78-13.508 14.711-28.634 19.882-48.201 20.937-16.97.331-34.989-5.692-47.605-17.059-4.895-4.409-18.166-19.346-18.073-25.94.109-7.683 1.033-16.768 1.167-24.692l1.182-59.846c.25-9.987.238-27.379 2.24-36.358a54.23 54.23 0 0 1 13.134-25.261c12.513-13.542 28.321-19.415 46.373-20.037"/></svg>`;

          const PANEL_HTML = `<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Image Studio · Runner Panel</title>
          <link rel="icon" type="image/svg+xml" href="/logo.svg"><link rel="apple-touch-icon" href="/logo.svg">
          <style>
          :root{--bg:#0a0d13;--bg2:#0e1219;--surface:#131822;--raised:#1a2130;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--txt:#f3f5f9;--muted:rgba(255,255,255,.62);--faint:rgba(255,255,255,.4);
          --acc:#6d8cff;--acc2:#38d6ff;--grad:linear-gradient(135deg,#6d8cff 0%,#38d6ff 100%);--ok:#3ecf8e;--warn:#f5b63d;--err:#ff6b6b;--violet:#a78bfa;--r:12px;--r2:8px}
          *{box-sizing:border-box}html{scroll-behavior:smooth}
          body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;
          background-image:radial-gradient(1200px 600px at 10% -10%,rgba(109,140,255,.14),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(56,214,255,.10),transparent 60%);background-attachment:fixed}
          a{color:var(--acc2)}button{font:inherit}code,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:rgba(255,255,255,.07);padding:1px 6px;border-radius:5px;color:#cfd6e4}
          ::selection{background:rgba(109,140,255,.35)}
          /* ─── header ─── */
          .top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(10,13,19,.72);border-bottom:1px solid var(--line)}
          .top .in{max-width:1560px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
          .brand{display:flex;align-items:center;gap:12px;margin-right:auto}
          .logo{width:38px;height:38px;border-radius:11px;background:#f2f1e6;display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,69,0,.28),0 0 0 1px rgba(255,255,255,.08);position:relative;overflow:hidden}
          .logo img{width:38px;height:38px;display:block;border-radius:11px}
          .brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
          .brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}
          .cloud{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
          .cloud i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.18)}
          .cloud.off i{background:var(--err);box-shadow:0 0 0 3px rgba(255,107,107,.18)}
          .kpis{display:flex;gap:8px;flex-wrap:wrap}
          .kpi{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 8px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;min-width:118px}
          .kpi .ring{width:34px;height:34px;flex:none}
          .kpi .ring circle{fill:none;stroke-width:3.5}
          .kpi .ring .bg{stroke:rgba(255,255,255,.08)}
          .kpi .ring .fg{stroke:url(#g1);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
          .kpi .ring.t .fg{stroke:var(--warn)}
          .kpi b{display:block;font-size:15px;line-height:1.1;letter-spacing:-.01em}
          .kpi span{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
          .actions{display:flex;gap:8px}
          .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:13px;transition:transform .12s ease,box-shadow .2s ease,background .2s;white-space:nowrap}
          .btn:active{transform:translateY(1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
          .btn.pri{background:var(--grad);color:#0a0d13;box-shadow:0 6px 18px rgba(109,140,255,.35)}.btn.pri:hover{box-shadow:0 8px 26px rgba(109,140,255,.5)}
          .btn.sec{background:rgba(255,255,255,.06);color:var(--txt);border-color:var(--line2)}.btn.sec:hover{background:rgba(255,255,255,.1)}
          .btn.warn{background:rgba(245,182,61,.12);color:#ffd27a;border-color:rgba(245,182,61,.35)}.btn.warn:hover{background:rgba(245,182,61,.2)}
          .btn.danger{background:rgba(255,107,107,.12);color:#ff9b9b;border-color:rgba(255,107,107,.3)}.btn.danger:hover{background:rgba(255,107,107,.2)}
          .btn.sm{min-height:32px;padding:0 11px;font-size:12px;border-radius:8px}
          .btn.icon{width:32px;padding:0}
          .btn svg{width:15px;height:15px}
          /* ─── layout ─── */
          .wrap{max-width:1560px;margin:0 auto;padding:20px 24px 80px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;align-items:start}
          @media(max-width:1040px){.wrap{grid-template-columns:1fr}.side{position:static!important}}
          .side{position:sticky;top:78px;display:flex;flex-direction:column;gap:16px}
          .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.2),0 12px 40px rgba(0,0,0,.25)}
          /* ─── tabs ─── */
          .tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:var(--r) var(--r) 0 0}
          .tab{flex:1;min-height:38px;border:0;background:transparent;color:var(--muted);border-radius:8px;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
          .tab:hover{color:var(--txt);background:rgba(255,255,255,.04)}.tab.on{color:var(--txt);background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2)}
          .tab .n{width:18px;height:18px;border-radius:6px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:11px;color:var(--faint)}
          .tab.on .n{background:var(--grad);color:#0a0d13}
          .pane{display:none;padding:18px}.pane.on{display:block;animation:fade .25s ease}
          @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
          .pane h3{margin:0 0 4px;font-size:15px;letter-spacing:-.01em}.pane p.lead{margin:0 0 14px;color:var(--muted);font-size:13px}
          label.l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:500}label.l:first-child{margin-top:0}
          input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);border-radius:var(--r2);padding:10px 12px;font:inherit;font-size:13.5px;min-height:42px;outline:none;transition:border-color .15s,box-shadow .15s}
          input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(109,140,255,.22)}
          select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
          textarea{min-height:190px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55}
          .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
          .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
          .seg input{display:none}.seg label{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px;border:1px solid var(--line2);border-radius:var(--r2);cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg2);transition:.15s;text-align:center;min-height:52px;justify-content:center}
          .seg label em{font-style:normal;font-size:10.5px;color:var(--faint);font-weight:500}
          .seg input:checked+label{border-color:var(--acc);color:var(--txt);background:rgba(109,140,255,.12);box-shadow:0 0 0 1px var(--acc) inset}
          .sw{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
          .sw:first-of-type{border-top:0}.sw span.t{flex:1}.sw span.t small{display:block;color:var(--faint);font-size:11.5px}
          .sw input{display:none}.sw .k{width:38px;height:22px;border-radius:11px;background:rgba(255,255,255,.12);position:relative;transition:.2s;flex:none}
          .sw .k::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
          .sw input:checked+.k{background:var(--acc)}.sw input:checked+.k::after{left:19px}
          .hint{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.5}
          .msg{font-size:12.5px;margin-top:10px;padding:9px 11px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);display:none}
          .msg.on{display:block}.msg.ok{border-color:rgba(62,207,142,.35);color:#9ef0c6;background:rgba(62,207,142,.08)}.msg.bad{border-color:rgba(255,107,107,.35);color:#ffb3b3;background:rgba(255,107,107,.08)}
          .foot{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
          .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11.5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);cursor:pointer}.chip:hover{color:var(--txt);border-color:var(--line2)}
          /* ─── collection ─── */
          .col-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
          .col-h h2{margin:0;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
          .status{font-size:12px;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:6px}
          .status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}.status.run i{background:var(--warn);animation:pulse 1.2s infinite}.status.done i{background:var(--ok)}.status.paused i{background:var(--acc2)}
          @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,182,61,.5)}70%{box-shadow:0 0 0 6px rgba(245,182,61,0)}}
          .filters{display:flex;gap:4px;margin-left:auto;background:rgba(255,255,255,.04);padding:4px;border-radius:9px;border:1px solid var(--line)}
          .filters button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;cursor:pointer}
          .filters button.on{background:var(--raised);color:var(--txt)}.filters button b{color:var(--faint);font-weight:600;margin-left:4px}
          .progress{height:4px;background:rgba(255,255,255,.06)}.progress i{display:block;height:100%;background:var(--grad);width:0;transition:width .5s ease;box-shadow:0 0 12px rgba(56,214,255,.6)}
          .banner{margin:16px 18px 0;padding:14px 16px;border-radius:10px;border:1px solid rgba(245,182,61,.35);background:rgba(245,182,61,.08);color:#ffe0a3;font-size:13px;display:none}.banner.on{display:block}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:18px}
          @media(max-width:560px){.grid{grid-template-columns:1fr;padding:12px}}
          .item{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;transition:border-color .2s,transform .2s;display:flex;flex-direction:column}
          .item:hover{border-color:var(--line2)}
          .item.running{border-color:rgba(245,182,61,.4)}.item.running::before{content:"";position:absolute;inset:-1px;border-radius:var(--r);padding:1px;background:linear-gradient(120deg,transparent 30%,rgba(245,182,61,.8),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 2.2s linear infinite;pointer-events:none;background-size:300% 300%}
          @keyframes spin{0%{background-position:0% 50%}100%{background-position:300% 50%}}
          .item.failed,.item.partial{border-color:rgba(255,107,107,.35)}
          .ih{display:flex;align-items:center;gap:10px;padding:12px 14px 10px}
          .idx{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.06);color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
          .ttl{flex:1;min-width:0}.ttl b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
          .ttl small{display:flex;gap:6px;align-items:center;color:var(--faint);font-size:11.5px;margin-top:2px;flex-wrap:wrap}
          .type{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;text-transform:uppercase}
          .type.SINGLE{background:rgba(109,140,255,.16);color:#b4c4ff}.type.T24{background:rgba(245,182,61,.16);color:#ffd27a}.type.DUAL{background:rgba(167,139,250,.18);color:#d5c8ff}.type.BATTERY{background:rgba(62,207,142,.16);color:#9ef0c6}
          .st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
          .st.queued{background:rgba(255,255,255,.07);color:var(--muted)}.st.running{background:rgba(245,182,61,.15);color:#ffd27a}.st.done{background:rgba(62,207,142,.15);color:#9ef0c6}.st.failed,.st.partial{background:rgba(255,107,107,.15);color:#ffb3b3}
          .st.dist{background:rgba(56,214,255,.14);color:#9de9ff}
          .sent{margin:10px 14px 0;padding:10px 12px;border-radius:9px;background:rgba(255,255,255,.03);border:1px dashed var(--line2);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
          .sent .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-top:5px;min-width:56px}
          .sent .none{font-size:12.5px;color:var(--faint);padding-top:3px}
          .acct{display:inline-flex;flex-direction:column;gap:1px;padding:5px 9px;border-radius:7px;font-size:12px;font-weight:700;border:1px solid transparent;line-height:1.25}
          .acct small{font-weight:500;font-size:10.5px;opacity:.75;font-family:ui-monospace,Menlo,Consolas,monospace}
          .acct.z1{background:rgba(109,140,255,.16);color:#c3d0ff;border-color:rgba(109,140,255,.35)}
          .acct.z2{background:rgba(62,207,142,.15);color:#a9f2d0;border-color:rgba(62,207,142,.35)}
          .acct.z3{background:rgba(245,182,61,.15);color:#ffd98f;border-color:rgba(245,182,61,.35)}
          .acct.z4{background:rgba(167,139,250,.18);color:#dccfff;border-color:rgba(167,139,250,.4)}
          .acct.pending{background:transparent;color:var(--faint);border-style:dashed;border-color:var(--line2)}
          .acct.err{background:rgba(255,107,107,.12);color:#ffb3b3;border-color:rgba(255,107,107,.35)}
