            if (!item) return;
            if (r.ok) {
              item.meta = { title: String(r.title || '').trim(), tags: String(r.tags || '').trim(), category: VALID_IMG_CATS.includes(String(r.category || '').toUpperCase()) ? String(r.category).toUpperCase() : 'OTHER', description: String(r.description || '').trim(), policyCheck: r.policyCheck === 'held' ? 'held' : 'passed', policyFlag: r.policyFlag || '', generatedAt: r.finishedAt || Date.now(), source: 'gemini-web' };
              if (!item.meta.title) { item.meta = null; item.metaStatus = 'failed'; item.metaError = 'Gemini returned an empty title'; mw.failed++; log(`❌ ${item.folder}: Gemini returned no title — Redo or edit manually`); }
              else {
                item.metaStatus = item.meta.policyCheck === 'held' ? 'held' : 'done'; item.metaError = '';
                if (item.metaStatus === 'held') mw.held++; else mw.done++;
                log(item.metaStatus === 'held' ? `🛑 ${item.folder}: policy hold — ${item.meta.policyFlag}` : `✅ ${item.folder}: metadata ready — "${item.meta.title}" · ${item.meta.category} · ${item.meta.tags.split(',').length} tags`);
              }
            } else { item.meta = null; item.metaStatus = 'failed'; item.metaError = r.error || 'unknown error'; mw.failed++; }
            mw.queued = metaJobCount();
            lastActivity = Date.now(); saveState();
            if (item.distributed.length && item.meta) patchDistributed(item, 'updated').catch(e => log(`❌ ${item.folder}: ${e.message}`));
            else maybeAutoDistribute(item);
          }
          setInterval(() => {
            let files; try { files = fs.readdirSync(META_RESULTS).filter(f => f.endsWith('.json')); } catch { return; }
            for (const f of files) {
              const fp = path.join(META_RESULTS, f);
              try { const r = JSON.parse(fs.readFileSync(fp, 'utf8')); fs.unlinkSync(fp); applyMetaResult(r); } catch (e) { try { fs.unlinkSync(fp); } catch {} log(`❌ bad metadata result ${f}: ${e.message}`); }
            }
            if (state.metaWorker.running && state.metaWorker.ready && !state.items.some(i => i.metaStatus === 'running')) state.metaWorker.current = metaJobCount() ? `${metaJobCount()} job(s) waiting` : 'idle — Gemini session verified';
          }, 2000);

          // Manual metadata from the panel (Edit). Same limits as the Gemini prompt / zedgeEnforce: title ≤25, 2–10 tags, category from the Zedge list.
          function setManualMeta(item, b) {
            const title = String(b.title || '').replace(/\s+/g, ' ').trim();
            if (title.length < 3 || title.length > 25) throw new Error('Title must be 3–25 characters (Zedge limit).');
            const tags = [...new Set(String(b.tags || '').toLowerCase().split(/[,\s]+/).map(t => t.trim()).filter(t => /^[a-z0-9-]{2,20}$/.test(t)))].slice(0, 10);
            if (tags.length < 2) throw new Error('Give at least 2 tags (letters/numbers, comma separated).');
            const category = String(b.category || '').toUpperCase().trim();
            if (!VALID_IMG_CATS.includes(category)) throw new Error('Pick a category from the list.');
            const description = String(b.description || '').replace(/\s+/g, ' ').trim().slice(0, 120);
            if (/[#@]|https?:|www\./i.test(title + ' ' + description + ' ' + tags.join(' '))) throw new Error('No links, hashtags or @handles (Zedge policy).');
            item.meta = { title, tags: tags.join(', '), category, description, policyCheck: 'passed', policyFlag: '', generatedAt: Date.now(), source: 'manual' };
            item.metaStatus = 'manual'; item.metaError = ''; item.autoHeldNoted = false;
            try { fs.unlinkSync(path.join(META_JOBS, `${item.id}.json`)); } catch {}
            log(`📝 ${item.folder}: manual metadata saved — "${title}" · ${category}`);
            saveState();
          }
          async function redoMetadata(item) {
            if (!state.metaWorker.available) throw new Error('Gemini metadata is unavailable (GEMINI_SESSION missing) — edit it manually instead.');
            item.meta = null; item.metaStatus = ''; item.metaError = ''; item.autoHeldNoted = false;
            queueMetadata(item, 'redo');
            return 1;
          }
          // Re-read status/metadata of distributed records so the panel shows what the bot did (uploaded / failed / requeued).
          const META_FIELDS = ['title', 'tags', 'category', 'description', 'policyCheck', 'policyFlag', 'status', 'metadataGeneratedAt', 'error'];
          let refreshing = false;
          async function refreshFirebaseMeta(force = false) {
            if (refreshing) return; refreshing = true;
            try {
              const queuePath = state.settings.queuePath || 'wallpaperQueue';
              const jobs = [];
              for (const item of state.items) for (const d of item.distributed) {
                if (!force && d.meta && d.meta.fetchedAt && Date.now() - d.meta.fetchedAt < 55000) continue;
                const dbUrl = FIREBASE_DB_MAP[d.dbName]; if (!dbUrl) continue;
                jobs.push((async () => {
                  try {
                    const res = await fetch(`${dbUrl}/${queuePath}/${d.key}.json`);
                    if (!res.ok) return;
                    const rec = await res.json();
                    if (!rec) { d.meta = { ...(d.meta || {}), missing: true, fetchedAt: Date.now() }; return; }
                    const meta = {}; for (const f of META_FIELDS) if (rec[f] !== undefined && rec[f] !== null && rec[f] !== '') meta[f] = rec[f];
                    meta.fetchedAt = Date.now();
                    const before = d.meta && d.meta.status;
                    d.meta = meta;
                    if (before && meta.status && before !== meta.status) log(`📡 [${d.dbName}] ${d.key} status ${before} → ${meta.status}`);
                  } catch {}
                })());
              }
              if (jobs.length) { await Promise.all(jobs); saveState(); }
            } finally { refreshing = false; }
          }
          setInterval(() => { if (!state.finished) refreshFirebaseMeta().catch(() => {}); }, 60000);

          // ─── ZIP / METADATA EXPORT ─────────────────────────────────────────────────
          function writeExports() {
            const metadata = state.items.filter(i => i.frames.some(f => f.status === 'done')).map(i => ({
              folder: i.folder, file: i.metadata.file,
              title: i.meta ? i.meta.title : i.metadata.title, tags: i.meta ? i.meta.tags.split(/,\s*/) : i.metadata.tags, category: i.meta ? i.meta.category : i.metadata.category, description: i.meta ? i.meta.description : i.metadata.description,
              metadataSource: i.meta ? i.meta.source : 'fallback-from-prompt', policyCheck: i.meta ? i.meta.policyCheck : '', policyFlag: i.meta ? i.meta.policyFlag : '',
              type: i.type, contentType: SET_FRAMES[i.type].contentType, prompt: i.prompt, model: i.settings.model,
              distributed: i.distributed.map(d => ({ dbName: d.dbName, key: d.key, at: d.at, firebase: d.meta && d.meta.title ? { title: d.meta.title, tags: d.meta.tags, category: d.meta.category, description: d.meta.description, policyCheck: d.meta.policyCheck, status: d.meta.status } : null }))
            }));
            fs.writeFileSync(path.join(OUT_DIR, 'metadata.json'), JSON.stringify(metadata, null, 2));
            const pdir = path.join(OUT_DIR, 'prompts'); fs.mkdirSync(pdir, { recursive: true });
            for (const i of state.items) fs.writeFileSync(path.join(pdir, `${i.folder}.txt`), [i.prompt, grading(i.settings), BASE_RULES].filter(Boolean).join('\n\n'));
          }
          function buildZip() {
            writeExports();
            const zipPath = '/tmp/zedge_upload.zip';
            try { fs.unlinkSync(zipPath); } catch {}
            execSync(`cd "${OUT_DIR}" && zip -q -r "${zipPath}" . -x "studio_state.json"`, { stdio: 'pipe' });
            return zipPath;
          }

          // ─── FINISH ────────────────────────────────────────────────────────────────
