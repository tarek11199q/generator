          .prompt.open{display:block}
          .err{margin:8px 14px 0;font-size:12px;color:#ffb3b3;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.25);border-radius:7px;padding:7px 10px;word-break:break-word}
          .if{display:flex;align-items:center;gap:8px;padding:12px 14px;margin-top:auto}
          .if .meta{flex:1;display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--faint)}
          .if .meta code{font-size:11px}
          .empty{padding:70px 24px;text-align:center;color:var(--muted)}
          .empty .phones{display:flex;justify-content:center;gap:10px;margin-bottom:22px}
          .empty .phones i{width:46px;height:82px;border-radius:10px;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(109,140,255,.25),rgba(56,214,255,.05));position:relative;animation:float 4s ease-in-out infinite}
          .empty .phones i:nth-child(2){animation-delay:.6s;background:linear-gradient(160deg,rgba(245,182,61,.3),rgba(255,107,107,.05))}.empty .phones i:nth-child(3){animation-delay:1.2s;background:linear-gradient(160deg,rgba(167,139,250,.3),rgba(56,214,255,.05))}.empty .phones i:nth-child(4){animation-delay:1.8s;background:linear-gradient(160deg,rgba(62,207,142,.3),rgba(109,140,255,.05))}
          .empty .phones i::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:14px;height:3px;border-radius:2px;background:rgba(255,255,255,.25)}
          @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
          .empty h4{margin:0 0 6px;font-size:16px;color:var(--txt)}.empty p{margin:0;font-size:13px;max-width:420px;margin-inline:auto}
          /* ─── console ─── */
          .console{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(10,13,19,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line2);transform:translateY(calc(100% - 40px));transition:transform .3s ease}
          .console.open{transform:none}
