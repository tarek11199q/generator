              if (state.finished) return;
              if (code !== 0) {
                mw.restarts++;
                log(`🧠 Metadata worker exited with code ${code} — ${tail.slice(-2).join(' | ').slice(0, 220)}`);
                if (pending && mw.restarts < 4) { log(`🧠 ${pending} job(s) still pending — restarting the worker in 20 s (${mw.restarts}/3)`); clearTimeout(metaRestartTimer); metaRestartTimer = setTimeout(() => ensureMetaWorker('restart'), 20000); }
                else if (pending) { mw.error = mw.error || `worker crashed ${mw.restarts}× — fix GEMINI_SESSION (see console) or edit metadata manually`; for (const it of state.items) if (it.metaStatus === 'queued' || it.metaStatus === 'running') { it.metaStatus = 'failed'; it.metaError = mw.error; } }
              } else { log('🧠 Metadata worker stopped'); if (pending) { clearTimeout(metaRestartTimer); metaRestartTimer = setTimeout(() => ensureMetaWorker('jobs pending'), 3000); } }
