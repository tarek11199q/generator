                if (state.settings.autoMetadata) for (const it of state.items) if (it.status === 'done' && !it.metaStatus) queueMetadata(it, 'generated');
                return json(res, 200, { ok: true, settings: state.settings, creds: { ok: hasCreds() } });
              }
              if (p === '/api/prompts') {
                const { out, problems } = parsePrompts(body);
                if (!out.length) throw new Error(problems[0] || 'Nothing to add');
                const startIndex = state.items.length;
                out.forEach((o, i) => state.items.push(buildItem(o, startIndex + i + 1)));
                const frames = out.reduce((n, o) => n + SET_FRAMES[o.type].frames.length, 0);
                log(`📥 Added ${out.length} item(s) / ${frames} frame(s)${problems.length ? ` · ${problems.length} skipped` : ''}`);
                saveState(); pump();
