            'qwen-image-3'
          ];
          const EDIT_MODELS = [
            'nano-banana-1-edit', 'nano-banana-2-lite-edit', 'nano-banana-2-edit',
            'flux-2-klein-9b-edit', 'flux-2-flash-edit', 'flux-2-pro-edit',
            'recraft-v3-edit',
            'gpt-image-1-mini-edit', 'gpt-image-2-edit', 'gpt-image-2.5-flare-edit', 'gpt-image-2.5-sunburst-edit',
            'muse-image-edit', 'mai-image-2.5-edit',
            'seedream-5-lite-edit', 'seedream-5-pro-edit',
            'grok-imagine-image-edit', 'grok-imagine-image-2.0-low-edit',
            'qwen-image-3-edit'
          ];
          const RATIOS = { '9:16': [1620, 2880], '3:4': [2160, 2880], '1:1': [2160, 2160], '4:3': [2880, 2160], '16:9': [2880, 1620] };
          const toEdit = m => (m.endsWith('-edit') ? m : m + '-edit');

          // ─── PROMPT BUILDING (same rules as the Cloudinary Studio index.php) ───────
          const BOOST = {
            off: 'Natural, restrained color grading.',
            soft: 'Gently enriched color: softly lifted saturation and a light luminous glow.',
            vivid: 'Vivid eye-catching color: punchy saturation and strong but clean contrast.',
            neon: 'Neon luxe grading: saturated neon accents against deep shadow, maximum screen impact while staying clean.',
            ultra: 'Ultra impact grading: thumb-stopping saturation, bold contrast and dramatic light separation, without clipping detail.'
          };
          const DISPLAY = {
            any: '',
            amoled: 'Optimised for AMOLED: true black background areas and bright isolated highlights.',
            lcd: 'Optimised for LCD: keep shadows slightly lifted so detail survives on bright panels.'
          };
          const BASE_RULES = 'Portrait 9:16 mobile wallpaper, vertical composition, keep the upper third clean for the clock and keep safe margins. No text, numbers, labels, signatures or watermarks. No phone frame, device mockup, border, collage or contact sheet. No humans, no copyrighted characters, franchises, brands or logos. Still image only.';
          const BASE_RULES_FREE = 'Clean composition with safe margins. No text, numbers, labels, signatures or watermarks. No phone frame, device mockup, border, collage or contact sheet. No humans, no copyrighted characters, franchises, brands or logos. Still image only.';
          const STRENGTH = {
            subtle: { lock: 'Keep the same subject, composition, geometry, materials and style as the reference image [1]. Preserve the subject identity.', push: 'Apply the state described below so it is clearly noticeable when compared side by side with the reference.' },
            clear:  { lock: 'Keep the same subject, identity, geometry, materials and art style as the reference image [1], and keep the camera framing similar.', push: 'This is an EDIT, not a copy: the lighting, glow, colours and sky MUST visibly change to match the state described below. Anyone comparing the two images must immediately see the difference.' },
            strong: { lock: 'Keep only the subject identity, its shape and the art style from the reference image [1].', push: 'Transform the image boldly to match the state described below: relight the whole scene, change the sky/background tone, shadows, glow and colour palette dramatically. The result must look like a distinctly different moment of the same subject, never a near-duplicate of the reference.' }
          };
          const NO_DUPE = 'Do not return the reference unchanged. Do not add unplanned structures, duplicate the subject, or redesign it.';

          // Frame "slot" names match the Firebase wallpaper-set records the metadata job + Zedge bot already read.
          const SET_FRAMES = {
            '24-HOUR': {
              contentType: 'WALLPAPER_24H',
              design: 'Design the scene so that time of day is unmistakable: include sky or ambient light, a dominant light source and visible shadows. This frame is the MORNING state.',
              frames: [
                { file: '01_morning.jpg',   slot: 'morning',   name: 'Morning',   instr: 'MORNING: pale cool-blue to soft peach sky, low sun from the side, long soft shadows, gentle mist, fresh muted palette, low contrast.' },
                { file: '02_afternoon.jpg', slot: 'afternoon', name: 'Afternoon', instr: 'AFTERNOON: bright clear daylight, sun high overhead, short hard shadows, the brightest and most saturated frame, crisp clean contrast, no mist.' },
                { file: '03_evening.jpg',   slot: 'evening',   name: 'Evening',   instr: 'EVENING / GOLDEN HOUR: deep orange-magenta sunset sky, very low warm sun, strong amber rim light on the subject, long dramatic shadows, warm dominant palette.' },
                { file: '04_night.jpg',     slot: 'night',     name: 'Night',     instr: 'NIGHT: dark navy-black sky with stars or city glow, no sun, the subject lit only by its own glowing parts and cool moonlight, deep shadows, high-contrast neon highlights.' }
              ]
            },
            'DUAL': {
              contentType: 'WALLPAPER_DUAL',
              design: 'This is the LOCK SCREEN frame: hero subject at 50–65% of frame width, placed lower-middle, upper third clean for the clock.',
              frames: [
                { file: '01_lock_screen.jpg', slot: 'lock', name: 'Lock screen', instr: 'LOCK SCREEN: hero subject roughly 50–65% of frame width, lower-middle, upper third clean for the clock. Strongest tasteful expression of the concept.' },
                { file: '02_home_screen.jpg', slot: 'home', name: 'Home screen', instr: 'HOME SCREEN: pull the camera back to a clearly WIDER shot of the same scene: the subject is at most 30% of frame width and moved off-centre, more environment visible, calmer and darker overall so app icons stay readable. The framing must be obviously different from the reference.' }
              ]
            },
            'BATTERY': {
              contentType: 'WALLPAPER_BATTERY',
              design: 'Design ONE clear energy pathway built into the subject: a glowing vertical channel (light strip, veins, circuit line, liquid level or crystal core) running from the very bottom to the very top of the subject, able to fill up like a gauge. In this frame the pathway is completely DORMANT: dark, unlit, grey/charcoal, zero glow. The subject is visible only through dim ambient light.',
              frames: [
                { file: '01_critical.jpg', slot: 'critical', name: 'Critical', instr: 'BATTERY CRITICAL (0–5%): the energy pathway is completely dormant: dark, unlit, grey/charcoal, zero glow anywhere except a faint dying red ember at the very bottom. Dim, low-key ambient lighting only.' },
                { file: '02_low.jpg',      slot: 'low',      name: 'Low',      instr: 'BATTERY LOW (20%): the energy pathway glows brightly ONLY in its bottom 20% (the lowest fifth); the upper 80% stays dark and unlit. Faint coloured light spills onto nearby surfaces. Scene slightly brighter than the reference.' },
                { file: '03_mid.jpg',      slot: 'mid',      name: 'Mid',      instr: 'BATTERY MID (50%): the energy pathway glows brightly from the bottom up to exactly half of its height; the upper half stays dark and unlit. Noticeable coloured glow spilling onto the subject. Scene clearly brighter than the reference.' },
                { file: '04_high.jpg',     slot: 'high',     name: 'High',     instr: 'BATTERY HIGH (80%): the energy pathway glows from the bottom up to 80% of its height; only the top fifth remains dark. Intense saturated glow, bright rim light, energetic sparks or particles.' },
                { file: '05_full.jpg',     slot: 'full',     name: 'Full',     instr: 'BATTERY FULL (100%): the ENTIRE energy pathway is lit end to end at maximum brightness, blazing saturated glow, light bloom, floating particles, the brightest and most vivid frame of the set.' },
                { file: '06_charging.jpg', slot: 'charging', name: 'Charging', instr: 'BATTERY CHARGING: energy is visibly FLOWING UPWARD through the pathway: bright streaks, rising sparks, motion trails and a pulsing brighter core, with electric particles rising from the bottom. The pathway is lit about 60% with the top part showing incoming energy. Electric, dynamic mood.' }
              ]
            },
            'SINGLE': {
              contentType: 'WALLPAPER',
              design: '',
              frames: [{ file: '01_wallpaper.jpg', slot: 'single', name: 'Wallpaper', instr: 'One standalone wallpaper. No variants, no time states, no energy states, no companion image.' }]
            }
          };
          const TYPE_ALIAS = { '24-HOUR': '24-HOUR', '24HOUR': '24-HOUR', '24': '24-HOUR', '24H': '24-HOUR', 'DAY': '24-HOUR', 'WALLPAPER24H': '24-HOUR', 'DUAL': 'DUAL', 'LOCKHOME': 'DUAL', 'WALLPAPERDUAL': 'DUAL', 'BATTERY': 'BATTERY', 'BAT': 'BATTERY', 'WALLPAPERBATTERY': 'BATTERY', 'SINGLE': 'SINGLE', 'ONE': 'SINGLE', 'WALLPAPER': 'SINGLE' };

          const STOP = new Set('the a an and or of in on at to for with by from no not into over under this that these those is are be as it its very more most dark light color colour wallpaper mobile phone screen background image picture style concept creative eye catching'.split(' '));
          const slug = t => (t || 'concept').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'concept';
          const pad2 = n => String(n).padStart(2, '0');
          const conceptFrom = p => (p.split(/[,.\n]/)[0].trim().split(/\s+/).slice(0, 5).join(' ') || 'Concept');
          const tagsFrom = p => { const out = []; for (const w of p.toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').split(/\s+/)) { if (w.length > 2 && !STOP.has(w) && !out.includes(w)) out.push(w); if (out.length === 10) break; } return out; };
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const grading = s => [BOOST[s.boost] || '', DISPLAY[s.display] || ''].filter(Boolean).join(' ');

          // ─── STATE ─────────────────────────────────────────────────────────────────
          fs.mkdirSync(OUT_DIR, { recursive: true });
          const STATE_FILE = path.join(OUT_DIR, 'studio_state.json');
          const startedAt = Date.now();
          const deadline  = startedAt + TIMEOUT_MIN * 60 * 1000;

          const state = {
            settings: {
              model: 'gpt-image-2.5-sunburst', res: '2K', ratio: '9:16', boost: 'vivid', display: 'any', strength: 'clear', upscale: true,
              concurrency: 2,
              targetAccount: (FIREBASE_DB_MAP[(process.env.TARGET_ACCOUNT || '').trim().toLowerCase()] ? (process.env.TARGET_ACCOUNT || '').trim().toLowerCase() : 'zedge_2'),   // never "all_accounts" here
              queuePath: (process.env.IMAGE_QUEUE_PATH || 'wallpaperQueue').trim(),
              autoDistribute: false,
              requireMetadata: true,
              spreadPool: Object.keys(FIREBASE_DB_MAP),                 // accounts used by target "spread" (each item → one account, round-robin balanced)                                 // never push a record without title/tags/category (the Zedge bot skips those)
              runMetadata: (process.env.STUDIO_AUTO_METADATA || 'true') !== 'false',
              autoMetadata: (process.env.STUDIO_AUTO_METADATA || 'true') !== 'false',
              autoFinishMinutes: 0
            },
            // Gemini-Web metadata worker = image_metadata.mjs in local-jobs mode (one browser, stays open for the whole session)
            metaWorker: { available: GEMINI_AVAILABLE && fs.existsSync(METADATA_SCRIPT), running: false, ready: false, startedAt: 0, current: '', queued: 0, done: 0, held: 0, failed: 0, restarts: 0, error: '', lastExit: null },
            items: [],
            log: [],
            paused: false,
            finished: false,
            finishReason: ''
          };
          const creds = {
            cloud_name: (process.env.CLOUDINARY_CLOUD_NAME || '').trim(),
            api_key: (process.env.CLOUDINARY_API_KEY || '').trim(),
            api_secret: (process.env.CLOUDINARY_API_SECRET || '').trim()
          };
          // CLOUDINARY_URL=cloudinary://key:secret@cloud is also accepted
          if ((!creds.cloud_name || !creds.api_key || !creds.api_secret) && process.env.CLOUDINARY_URL) {
            const m = String(process.env.CLOUDINARY_URL).match(/^cloudinary:\/\/([^:]+):([^@]+)@([^/?]+)/);
            if (m) { creds.api_key = m[1]; creds.api_secret = m[2]; creds.cloud_name = m[3]; }
          }
          const hasCreds = () => !!(creds.cloud_name && creds.api_key && creds.api_secret);

          let nextId = 1;
          let lastActivity = Date.now();
          function log(msg) {
            const line = `[${new Date().toISOString().slice(11, 19)}] ${msg}`;
            console.log(line);
            state.log.push(line);
            if (state.log.length > 400) state.log.splice(0, state.log.length - 400);
          }
          let saveTimer = null;
          function saveState() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
              try { fs.writeFileSync(STATE_FILE, JSON.stringify({ ...state, log: undefined }, null, 2)); } catch (e) { console.error('state save failed', e.message); }
            }, 300);
          }

          // ─── CLOUDINARY ────────────────────────────────────────────────────────────
          async function cloudinaryGenerate(mode, payload) {
            if (!hasCreds()) throw new Error('Cloudinary credentials missing — add them in Settings.');
            const auth = 'Basic ' + Buffer.from(`${creds.api_key}:${creds.api_secret}`).toString('base64');
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 300000);
            let res, data;
            try {
              res = await fetch(`${API_BASE}/generate/${encodeURIComponent(creds.cloud_name)}/${mode}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json', Authorization: auth },
                body: JSON.stringify(payload),
                signal: ctrl.signal
              });
              const raw = await res.text();
              try { data = JSON.parse(raw); } catch { data = { error: { message: raw.slice(0, 300) } }; }
            } finally { clearTimeout(t); }
            if (!res.ok) {
              const e = data && data.error || {};
              throw new Error(`${e.code ? e.code + ' ' : ''}${e.message || `HTTP ${res.status}`}`);
            }
            const asset = data.data && data.data.assets && data.data.assets[0];
            if (!asset || !asset.storage || !asset.storage.asset_id) throw new Error('Cloudinary returned no managed asset.');
            return asset;
          }
          function derivedUrl(storage, upscale, ratio) {
            const [w, h] = RATIOS[ratio] || RATIOS['9:16'];
            const v = storage.version ? `v${storage.version}/` : '';
            return `${DELIVERY_BASE}/${creds.cloud_name}/image/upload/${upscale ? 'e_upscale/' : 'e_sharpen:60/'}c_fill,g_auto,w_${w},h_${h}/q_100/${v}${storage.public_id}.jpg`;
          }
          // Derived (e_upscale) assets answer 423 while Cloudinary renders them — retry.
          async function downloadDerived(url) {
            let lastStatus = 0;
            for (let i = 0; i < 10; i++) {
              const res = await fetch(url).catch(() => null);
              if (res && res.ok) {
                const buf = Buffer.from(await res.arrayBuffer());
                if (buf.length > 1000) return buf;
              }
              lastStatus = res ? res.status : 0;
              if (res && res.status !== 423 && res.status !== 429 && res.status < 500 && res.status !== 0) break;
              await sleep(3000 + i * 1500);
            }
            throw new Error(`derived image download failed (HTTP ${lastStatus})`);
          }

          // ─── GENERATION WORKER ─────────────────────────────────────────────────────
          function buildItem(o, index) {
            const type = o.type, def = SET_FRAMES[type];
            const concept = (o.concept || '').trim() || conceptFrom(o.prompt);
            const st = { ...state.settings, ...(o.settings || {}) };
            if (type !== 'SINGLE') st.ratio = '9:16';
            const folder = `${pad2(index)}_${slug(concept)}_${type}`;
            return {
              id: nextId++, index, type, concept, prompt: o.prompt, folder,
              settings: { model: st.model, res: st.res, ratio: st.ratio, boost: st.boost, display: st.display, strength: st.strength, upscale: !!st.upscale },
              status: 'queued', anchorId: null, error: '',
              frames: def.frames.map(f => ({ file: f.file, slot: f.slot, name: f.name, status: 'queued', url: '', localPath: '', size: 0, error: '', attempts: 0 })),
              distributed: [], distributeStatus: '', distributeError: '',
              // meta = Gemini-Web (or manual) Zedge metadata generated BEFORE distribution; metaStatus: '' | queued | running | done | held | failed | manual
              meta: null, metaStatus: '', metaError: '',
              metadata: { file: def.frames[0].file, title: concept.slice(0, 25), tags: tagsFrom(o.prompt || concept), category: 'DESIGNS', description: (o.prompt || concept).replace(/\s+/g, ' ').slice(0, 200) },
              createdAt: Date.now()
            };
          }

          async function generateFrame(item, f) {
            const def = SET_FRAMES[item.type], frame = item.frames[f], fdef = def.frames[f], isAnchor = f === 0, st = item.settings;
            if (!isAnchor && !item.anchorId) { frame.status = 'failed'; frame.error = 'anchor frame not ready'; return false; }
            const base = st.model, editModel = EDIT_MODELS.includes(toEdit(base)) ? toEdit(base) : 'nano-banana-2-edit';
            const grade = grading(st);
            const rules = (item.type === 'SINGLE' && st.ratio !== '9:16') ? BASE_RULES_FREE : BASE_RULES;
            const S = STRENGTH[st.strength] || STRENGTH.clear;
            const prompt = isAnchor
              ? [item.prompt, def.design, fdef.instr, grade, rules].filter(Boolean).join('\n\n')
              : [item.prompt ? 'Concept: ' + item.prompt : '', S.lock, S.push, 'STATE TO RENDER — ' + fdef.instr, NO_DUPE, grade, rules].filter(Boolean).join('\n\n');
            frame.status = 'running'; frame.error = ''; saveState();
            let lastErr = null;
            for (let attempt = 1; attempt <= 3; attempt++) {
              frame.attempts++;
              try {
                const payload = {
                  prompt,
                  model: { id: isAnchor ? base : editModel },
                  image_size: { aspect_ratio: st.ratio || '9:16', resolution: st.res || '2K' },
                  format: 'png',
                  target: { target_type: 'managed_asset', public_id: `zedge/${item.folder}/${fdef.file.replace(/\.jpg$/, '')}_${Date.now().toString(36)}` }
                };
                if (!isAnchor) payload.reference_images = [{ source_type: 'managed_asset', asset_id: item.anchorId }];
                const asset = await cloudinaryGenerate(isAnchor ? 'text_to_image' : 'image_to_image', payload);
                if (isAnchor) item.anchorId = asset.storage.asset_id;
                const url = derivedUrl(asset.storage, st.upscale, st.ratio);
                const buf = await downloadDerived(url);
                const dir = path.join(OUT_DIR, item.folder); fs.mkdirSync(dir, { recursive: true });
                const localPath = path.join(dir, fdef.file);
                fs.writeFileSync(localPath, buf);
                frame.url = url; frame.localPath = localPath; frame.size = buf.length; frame.status = 'done'; frame.error = '';
                log(`✅ ${item.folder}/${fdef.file} (${(buf.length / 1024).toFixed(0)} KB)`);
                saveState();
                return true;
              } catch (err) {
                lastErr = err;
                log(`⚠️ ${item.folder}/${fdef.file} attempt ${attempt}/3: ${err.message}`);
                if (attempt < 3) await sleep(2000 * attempt);
              }
            }
            frame.status = 'failed'; frame.error = lastErr ? lastErr.message : 'failed';
            saveState();
            return false;
          }

          function itemStatusFromFrames(item) {
            const done = item.frames.filter(f => f.status === 'done').length;
            if (done === item.frames.length) return 'done';
            if (item.frames.some(f => f.status === 'running')) return 'running';
            return done > 0 ? 'partial' : 'failed';
          }

          async function processItem(item) {
            item.status = 'running'; item.error = ''; lastActivity = Date.now(); saveState();
            log(`🎨 Generating ${item.folder} (${item.frames.length} frame${item.frames.length === 1 ? '' : 's'}) · ${item.settings.model}`);
            // Anchor first (text_to_image); variants reference the anchor and run in parallel.
            const anchorOk = item.frames[0].status === 'done' || await generateFrame(item, 0);
            if (anchorOk && item.frames.length > 1) {
              await Promise.all(item.frames.map((fr, i) => (i > 0 && fr.status !== 'done') ? generateFrame(item, i) : Promise.resolve(true)));
            }
            item.status = itemStatusFromFrames(item);
            if (item.status !== 'done') item.error = item.frames.filter(f => f.status === 'failed').map(f => `${f.file}: ${f.error}`).join(' · ');
            lastActivity = Date.now(); saveState();
            if (item.status === 'done') {
              // Same order as the ringtone job: metadata FIRST (Gemini Web), then the Firebase record.
              if (!(item.meta && item.meta.title)) queueMetadata(item, 'generated');
              maybeAutoDistribute(item);
            }
          }

          let inFlight = 0;
          let pumping = false;
          async function pump() {
            if (pumping) return; pumping = true;
            try {
              while (!state.finished && !state.paused && hasCreds()) {
                const limit = Math.max(1, Math.min(4, parseInt(state.settings.concurrency, 10) || 1));
                if (inFlight >= limit) break;
                const next = state.items.find(i => i.status === 'queued');
                if (!next) break;
                inFlight++;
                processItem(next).catch(e => { next.status = 'failed'; next.error = e.message; saveState(); }).finally(() => { inFlight--; pump(); });
              }
            } finally { pumping = false; }
          }

          // ─── DISTRIBUTION: Cloudinary JPG → R2 → Firebase (same schema as the panel / ringtone job) ──
          // ⚠️ ONE ITEM → ONE ZEDGE ACCOUNT, ALWAYS. The same image/set in two Zedge accounts = duplicate content = suspension.
          // There is deliberately NO "all accounts" target here, and the ledger below makes a second send impossible.
          // target "spread" = DISTRIBUTE THE COLLECTION ACROSS THE ACCOUNTS: every item still goes to exactly ONE
          // account, but consecutive items are spread round-robin over settings.spreadPool (least-loaded first),
          // so zedge_1..4 each receive different sets / images and never the same file.
          const SPREAD = 'spread';
          function spreadCounts() {
            const pool = (state.settings.spreadPool || []).filter(a => FIREBASE_DB_MAP[a]);
            const counts = Object.fromEntries(pool.map(a => [a, 0]));
            for (const it of state.items) { const a = it.lockedAccount || (it.distributed[0] && it.distributed[0].dbName); if (a && a in counts) counts[a]++; }
            return { pool, counts };
          }
          let spreadCursor = 0;
          function pickSpreadAccount() {
            const { pool, counts } = spreadCounts();
            if (!pool.length) throw new Error('Spread: no accounts selected in "Spread across" — tick at least one account.');
            const min = Math.min(...pool.map(a => counts[a]));
            const candidates = pool.filter(a => counts[a] === min);
            const pick = candidates[spreadCursor % candidates.length]; spreadCursor++;
            return pick;
          }
          function resolveTarget(target) {
            const t = String(target || state.settings.targetAccount || 'zedge_2').toLowerCase();
            return t === SPREAD ? pickSpreadAccount() : t;
          }
          function targetDbs(target) {
            const t = String(target || state.settings.targetAccount || 'zedge_2').toLowerCase();
            if (t === 'all_accounts' || t === 'all_four' || t === 'all_three') throw new Error('Sending one image/set to several Zedge accounts is blocked (duplicate content → account suspension). Pick one account, or "spread" to give each item to a different account.');
            if (t === SPREAD) throw new Error('internal: resolve "spread" to one account first');
            if (FIREBASE_DB_MAP[t]) return [{ name: t, url: FIREBASE_DB_MAP[t] }];
            throw new Error(`Unknown target account "${target}"`);
          }
          async function uploadToR2(buffer, fileName, dbName) {
            const cleaned = fileName.replace(/[^a-zA-Z0-9._-]/g, '_');
            const key = `${String(dbName).replace(/^zedge_?/i, 'zedge')}/wallpaper/${Date.now()}_${cleaned}`;
            const res = await fetch(R2_WORKER_URL, { method: 'POST', headers: { 'X-File-Name': key, 'X-File-Type': 'image/jpeg' }, body: buffer }).catch(e => { throw netErr('R2 worker unreachable', e); });
