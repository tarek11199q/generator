          .console .bar b{color:var(--txt);font-weight:600}.console .bar .last{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--faint)}
          .console .bar .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
          .console pre{margin:0;height:240px;overflow:auto;padding:6px 24px 16px;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#b9c2d3;white-space:pre-wrap}
          .console pre .ok{color:#9ef0c6}.console pre .er{color:#ffb3b3}.console pre .wn{color:#ffd27a}.console pre .in{color:#9de9ff}.console pre .ts{color:var(--faint)}
          /* ─── lightbox / toast ─── */
          .lb{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.92);display:none;place-items:center;padding:24px;cursor:zoom-out}
