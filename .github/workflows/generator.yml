            <div class="pane on" id="pPrompts">
             <h3>Bulk prompts</h3><p class="lead">One prompt per line. Every line becomes a set or a single wallpaper and starts generating immediately.</p>
             <label class="l">Set type for plain lines</label>
             <div class="seg">
              <input type="radio" name="ptype" id="ty1" value="SINGLE" checked><label for="ty1">Single<em>1 frame</em></label>
              <input type="radio" name="ptype" id="ty2" value="24-HOUR"><label for="ty2">24‑Hour<em>4 frames</em></label>
              <input type="radio" name="ptype" id="ty3" value="DUAL"><label for="ty3">Dual<em>lock + home</em></label>
              <input type="radio" name="ptype" id="ty4" value="BATTERY"><label for="ty4">Battery<em>6 frames</em></label>
             </div>
             <label class="l"><span>Prompts</span><span id="lineCount">0 lines</span></label>
             <textarea id="ptext" spellcheck="false" placeholder="Neon koi fish gliding through a glowing cyber pond, bioluminescent lilies
          BATTERY | Crystal Heart | A floating crystal heart with veins of light
          24H | Misty Peak | A lone mountain peak rising above a sea of clouds"></textarea>
             <div class="chips"><span class="chip" data-ins="TYPE | concept | prompt">TYPE | concept | prompt</span><span class="chip" data-ins='[{"type":"24-HOUR","concept":"Misty Peak","prompt":"…","model":"flux-2-pro"}]'>JSON import</span><span class="chip" id="clearPrompts">Clear</span></div>
             <div class="g2" style="margin-top:12px;align-items:end">
              <div><label class="l">Copies per prompt</label><input id="copies" type="number" min="1" max="10" value="1"></div>
              <button class="btn pri" id="addBtn" style="min-height:42px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add &amp; generate</button>
             </div>
             <div class="msg" id="addMsg"></div>
             <p class="hint">Shortcut: <kbd>Ctrl</kbd>+<kbd>Enter</kbd> adds the queue. Power cut? The runner keeps generating — just reopen this link.</p>
            </div>
            <div class="pane" id="pGen">
             <h3>Generation defaults</h3><p class="lead">Applied to new items. JSON lines can override model, res, boost, display, strength, ratio, upscale.</p>
             <label class="l">Model</label><select id="model"></select>
             <div class="g3" style="margin-top:12px">
              <div><label class="l">Resolution</label><select id="res"><option value="1K">1K · faster</option><option value="2K">2K · best</option></select></div>
              <div><label class="l">Ratio <small>(single)</small></label><select id="ratio"></select></div>
              <div><label class="l">Parallel</label><select id="concurrency"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
             </div>
             <div class="g3" style="margin-top:12px">
              <div><label class="l">Color boost</label><select id="boost"><option value="off">Off · natural</option><option value="soft">Soft glow</option><option value="vivid">Vivid pop</option><option value="neon">Neon luxe</option><option value="ultra">Ultra impact</option></select></div>
              <div><label class="l">Display</label><select id="display"><option value="any">Any phone</option><option value="amoled">AMOLED</option><option value="lcd">LCD</option></select></div>
              <div><label class="l">Variation</label><select id="strength"><option value="subtle">Subtle</option><option value="clear">Clear</option><option value="strong">Strong</option></select></div>
             </div>
             <div style="margin-top:14px">
              <label class="sw"><span class="t">AI upscale before crop<small><code>e_upscale</code> → 1620 × 2880 · slower but sharper</small></span><input type="checkbox" id="upscale"><span class="k"></span></label>
             </div>
             <div class="foot"><button class="btn pri" data-save>Save defaults</button><span class="hint" style="margin:0" id="saveMsg1"></span></div>
            </div>
            <div class="pane" id="pDist">
             <h3>Distribution</h3><p class="lead">Completed items get Gemini‑Web metadata first, then are uploaded to R2 and queued in Firebase <b>with</b> title / tags / category — each item to exactly one account.</p>
             <div class="g2"><div><label class="l">Target account</label><select id="target"></select></div><div><label class="l">Queue path</label><input id="queuePath"></div></div>
             <div id="spreadBox" style="margin-top:8px;display:none"><label class="l">Spread across (each item → a different account, balanced)</label><div id="spreadPool" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px"></div></div>
             <div class="hint" style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45">🔒 <b style="color:var(--txt)">One image / set → one Zedge account, always.</b> Choose <b>spread</b> to hand out a big batch: set 1 → zedge_1, set 2 → zedge_2, … (least-loaded account first) — every account gets <i>different</i> files, none gets a file that another account already has. Once distributed, an item is locked to that account (no re-send, no “all accounts”, no frame regeneration). A SHA‑256 ledger also refuses any byte‑identical file that was ever uploaded to any account. Want the same concept in another account? Add the prompt again — it renders a different image.</div>
             <div style="margin-top:14px">
              <label class="sw"><span class="t">Auto‑distribute<small>Send each item as soon as all of its frames are done</small></span><input type="checkbox" id="autoDistribute"><span class="k"></span></label>
              <label class="sw"><span class="t">Gemini metadata before distribute<small>As soon as a set / image is rendered, Gemini Web writes title · tags · category · description + Zedge policy check (same script as <code>metadata</code> mode)</small></span><input type="checkbox" id="autoMetadata"><span class="k"></span></label>
              <label class="sw"><span class="t">Require metadata to distribute<small>Records are pushed to Firebase <b>with</b> metadata, exactly like the ringtone job — the Zedge bot never sees a “metadata missing” file. Turn off only if you want the old behaviour (push first, patch later).</small></span><input type="checkbox" id="requireMetadata"><span class="k"></span></label>
              <label class="sw"><span class="t">Final metadata pass after finish<small>Safety net: after the session the Firebase scan runs once for anything still missing title / tags / category</small></span><input type="checkbox" id="runMetadata"><span class="k"></span></label>
             </div>
             <label class="l"><span>Auto‑finish after idle</span><span>minutes · 0 = manual only</span></label><input id="autoFinish" type="number" min="0" max="300">
             <p class="hint">Loadshedding mode: turn on auto‑distribute + an idle timer, paste prompts, and walk away. The session finishes itself and hands off to metadata.</p>
             <div class="foot"><button class="btn pri" data-save>Save distribution</button><span class="hint" style="margin:0" id="saveMsg2"></span></div>
            </div>
            <div class="pane" id="pCred">
             <h3>Cloudinary keys</h3><p class="lead" id="credHint"></p>
             <label class="l">Cloud name</label><input id="c_cloud" autocomplete="off" placeholder="my-cloud">
             <div class="g2" style="margin-top:12px"><div><label class="l">API key</label><input id="c_key" autocomplete="off" placeholder="1234567890"></div><div><label class="l">API secret</label><input id="c_secret" type="password" autocomplete="new-password" placeholder="••••••••"></div></div>
             <p class="hint">Keys live only in this runner's memory for the session. Tip: add <code>CLOUDINARY_CLOUD_NAME / API_KEY / API_SECRET</code> repo secrets to skip this step.</p>
             <div class="foot"><button class="btn pri" data-save>Save keys</button><span class="hint" style="margin:0" id="saveMsg3"></span></div>
            </div>
           </section>
          </aside>

          <section class="card" id="collection">
           <div class="col-h">
            <h2>Collection <span class="status" id="status"><i></i><span>idle</span></span></h2>
            <div class="filters" id="filters"><button class="on" data-f="all">All<b id="fAll">0</b></button><button data-f="running">Active<b id="fRun">0</b></button><button data-f="done">Done<b id="fDone">0</b></button><button data-f="failed">Failed<b id="fFail">0</b></button><button data-f="dist">Sent<b id="fDist">0</b></button></div>
            <button class="btn sec sm" id="distAllBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Distribute all completed</button>
           </div>
           <div class="progress"><i id="bar"></i></div>
           <div class="acctsum" id="acctsum"></div>
           <div class="acctsum" style="padding-top:8px"><span class="mw" id="mw"><i></i><span id="mwTxt">metadata worker idle</span></span><button class="btn sec sm" id="metaRunBtn" title="Queue every finished item that still has no metadata for Gemini Web">🧠 Generate metadata <b id="metaNeed" style="margin-left:4px"></b></button><button class="btn sec sm icon" id="metaRefreshBtn" title="Re-read record status from Firebase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 1 0 6.7 16.7"/><path d="M20 5v6h-6"/></svg></button></div>
           <div class="done-banner" id="finishedBox"></div>
           <div class="banner" id="credBanner">⚠ Add your Cloudinary keys in <b>Keys</b> — queued items start as soon as they are saved.</div>
           <div class="grid" id="items"></div>
           <div class="empty" id="empty"><div class="phones"><i></i><i></i><i></i><i></i></div><h4>Nothing in the collection yet</h4><p>Paste prompts on the left — singles, 24‑hour, dual or battery sets — and watch them render here frame by frame.</p></div>
          </section>
          </main>

          <div class="console" id="console"><div class="bar" id="consoleBar"><span class="dot"></span><b>Console</b><span class="last" id="lastLog">waiting for the runner…</span><span id="consoleHint">▲ open</span></div><pre id="log"></pre></div>
          <div class="lb" id="lb"><img id="lbImg" alt=""><div class="cap" id="lbCap"></div></div>
          <div class="toasts" id="toasts"></div>

          <script>
          const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
          const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          const RE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 1 0 6.7 16.7"/><path d="M20 5v6h-6"/></svg>';
          const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
          let S=null,inited=false,filter='all',openPrompts=new Set(),editId=null;
          function toast(m,k){const t=document.createElement('div');t.className='toast'+(k?' '+k:'');t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity=0;t.style.transition='.3s';setTimeout(()=>t.remove(),300)},3200)}
          async function api(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
          const fmtLeft=ms=>{const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);return h?\`\${h}h \${String(m).padStart(2,'0')}m\`:\`\${m}m\`};
          const ring=(el,frac)=>{el.style.strokeDashoffset=(94.2*(1-Math.max(0,Math.min(1,frac)))).toFixed(1)};
          const typeCls=t=>t==='24-HOUR'?'T24':t;
          const accts=()=>S?S.accounts.filter(a=>a!=='spread'):[];const acls=a=>'z'+String(a).replace(/\\D/g,'');
          const fmtT=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
          const targetsOf=t=>[t];
          function sentRow(i){
           const cur=$('#target')?$('#target').value:S.settings.targetAccount;
           const sentTo=new Set(i.distributed.map(d=>d.dbName));
           if(!i.distributed.length&&i.distributeStatus!=='running'&&!i.distributeError) return \`<div class="sent"><span class="lbl">Sent to</span><span class="none">Not distributed yet\${i.status==='done'?\` · target: <b style="color:var(--txt)">\${cur==='spread'?'spread (next free account)':esc(cur)}</b>\`:''}</span></div>\`;
           const badges=i.distributed.map(d=>{const st=d.meta&&d.meta.status||'';const cls=st==='failed'?' fail':st&&st!=='queued'?' up':'';return \`<span class="acct \${acls(d.dbName)}" title="Firebase key \${esc(d.key)} · \${new Date(d.at).toLocaleString()}\${d.meta&&d.meta.error?' · '+esc(d.meta.error):''}">\${esc(d.dbName)}<small class="\${cls.trim()}">\${esc(d.key)} · \${fmtT(d.at)}\${st?' · '+esc(st)+(d.meta.policyCheck==='held'?' (held)':''):''}</small></span>\`}).join('');
           const pending=i.distributeStatus==='running'?targetsOf(i.lockedAccount||cur).filter(a=>!sentTo.has(a)&&a!=='spread').map(a=>\`<span class="acct pending">\${esc(a)}<small>uploading…</small></span>\`).join(''):'';
           const failed=i.distributeError&&i.distributeStatus!=='running'?i.distributeError.split(' · ').map(x=>{const m=x.match(/^(zedge_\\d)/);return m&&!sentTo.has(m[1])?\`<span class="acct err" title="\${esc(x)}">\${esc(m[1])}<small>failed</small></span>\`:''}).join(''):'';
           return \`<div class="sent"><span class="lbl">Sent to</span>\${badges}\${pending}\${failed}</div>\`}
          const tagList=t=>Array.isArray(t)?t:String(t||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
          const MS={queued:'queued for Gemini',running:'Gemini is writing…',done:'✓ Gemini Web',manual:'manual ✓',held:'🛑 policy hold',failed:'✗ failed'};
          function metaBlock(i){
           if(i.status!=='done') return '';
           const mw=S.metaWorker,m=i.meta,st=i.metaStatus||(m?'done':'none');
           const chip=\`<span class="ms \${st}">\${st==='running'||st==='queued'?'<i></i>':''}\${MS[st]||'no metadata'}</span>\`;
           const canRedo=mw.available&&st!=='queued'&&st!=='running';
           const head=\`<div class="mh">🧠 Zedge metadata \${chip}<span class="sp"></span>\${editId===i.id?'':\`<button class="btn sec sm" onclick="editMeta(\${i.id})" title="Type / fix title, tags, category yourself">\${PEN} Edit</button>\`}\${canRedo?\`<button class="btn sec sm" onclick="redoMeta(\${i.id})" title="Ask Gemini Web again\${i.distributed.length?' and patch every sent record':''}">\${RE} Redo</button>\`:''}</div>\`;
           if(editId===i.id){const f=m||{title:i.metadata.title,tags:(i.metadata.tags||[]).join(', '),category:i.metadata.category,description:i.metadata.description};
            return \`<div class="metab">\${head}<form class="medit" onsubmit="saveMeta(event,\${i.id})">
             <label>Title <span class="cnt" id="ttlCnt\${i.id}">\${String(f.title||'').length}/25</span><input name="title" maxlength="25" value="\${esc(f.title)}" oninput="$('#ttlCnt\${i.id}').textContent=this.value.length+'/25'" required></label>
             <label>Category<select name="category">\${S.categories.map(c=>\`<option\${c===f.category?' selected':''}>\${c}</option>\`).join('')}</select></label>
             <label class="full">Tags (2–10, comma separated)<input name="tags" value="\${esc(tagList(f.tags).join(', '))}" required></label>
             <label class="full">Description (max 5 words)<input name="description" maxlength="120" value="\${esc(f.description||'')}"></label>
             <div class="acts"><small>\${i.distributed.length?\`Saving patches \${i.distributed.length} Firebase record(s)\${m&&m.policyCheck==='held'?' and re-queues the held item':''}\`:'Saved metadata is pushed together with the record'}</small><button type="button" class="btn sec sm" onclick="cancelEdit()">Cancel</button><button class="btn pri sm">Save metadata</button></div></form></div>\`}
           let body;
           if(m&&m.title) body=\`<div class="mbody"><div class="t">\${esc(m.title)}<span class="cat">\${esc(m.category)}</span></div>\${m.description?\`<div class="d">\${esc(m.description)}</div>\`:''}<div class="tags">\${tagList(m.tags).map(t=>\`<span>\${esc(t)}</span>\`).join('')}</div>\${m.policyFlag?\`<div class="flag">🛑 Zedge policy: \${esc(m.policyFlag)} — pushed as <b>status failed / held</b>; fix with Edit (re-queues) or Redo.</div>\`:''}</div>\`;
           else if(st==='queued') body=\`<div class="mbody"><div class="wait"><i></i>\${mw.running&&mw.ready?'queued — Gemini is busy with another image':mw.running?'waiting — Gemini Web is opening…':mw.error?\`worker stopped: \${esc(mw.error)} · use Edit\`:'waiting for the metadata worker'}</div></div>\`;
           else if(st==='running') body=\`<div class="mbody"><div class="wait"><i></i>Gemini Web is looking at this image and writing title · tags · category…</div></div>\`;
           else if(st==='failed') body=\`<div class="mbody"><div class="flag">✗ \${esc(i.metaError||'metadata failed')} — press Redo or Edit.</div></div>\`;
           else body=\`<div class="mbody"><div class="wait">\${!mw.available?'GEMINI_SESSION missing — type the metadata with Edit (records without it are skipped by the Zedge bot).':S.settings.autoMetadata?'no metadata yet — press 🧠 Generate metadata or Edit':'auto metadata is off — press 🧠 Generate metadata or Edit'}</div></div>\`;
           return \`<div class="metab">\${head}\${body}</div>\`}
          function distBtn(i){
           const cur=$('#target')?$('#target').value:S.settings.targetAccount;
           if(i.distributeStatus==='running') return \`<button class="btn sec sm" disabled>Distributing → \${esc(i.lockedAccount||cur)}…</button>\`;
           const tl=cur==='spread'?'next account (spread)':cur;
           if(i.distributed.length) return \`<button class="btn sec sm" disabled title="One image/set = one Zedge account. Locked to \${esc(i.distributed[0].dbName)} — it can never be sent to another account.">🔒 Only in \${esc(i.distributed[0].dbName)}</button>\`;
           const hasMeta=!!(i.meta&&i.meta.title);
           if(S.settings.requireMetadata&&!hasMeta) return \`<button class="btn sec sm" onclick="dist(\${i.id})" title="Records without title/tags/category are skipped by the Zedge bot — waiting for Gemini, or press Edit">⏳ Metadata first → \${esc(tl)}</button>\`;
           if(hasMeta&&i.meta.policyCheck==='held') return \`<button class="btn hold sm" onclick="dist(\${i.id},true)" title="Pushed as status failed / policyCheck held — review in the app before requeue">🛑 Distribute held → \${esc(tl)}</button>\`;
           return \`<button class="btn pri sm" onclick="dist(\${i.id})" title="Send to \${esc(tl)} only — this locks the item to that account">Distribute → \${esc(tl)}</button>\`}const fmtB=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB';
          const setMsg=(el,txt,cls)=>{el.textContent=txt;el.className='msg on '+(cls||'')};

          /* tabs */
          $$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('on',x===b));$$('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.pane))});
          /* prompt helpers */
          const lines=()=>$('#ptext').value.split('\\n').map(l=>l.trim()).filter(Boolean).length;
          $('#ptext').addEventListener('input',()=>{$('#lineCount').textContent=lines()+' line'+(lines()===1?'':'s')});
          $('#ptext').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();$('#addBtn').click()}});
          $$('.chip[data-ins]').forEach(c=>c.onclick=()=>{const t=$('#ptext');t.value=(t.value.trim()?t.value.replace(/\\s*$/,'\\n'):'')+c.dataset.ins;t.dispatchEvent(new Event('input'));t.focus()});
          $('#clearPrompts').onclick=()=>{$('#ptext').value='';$('#ptext').dispatchEvent(new Event('input'))};

          function fillSettings(){const s=S.settings;
           $('#model').innerHTML=S.models.map(m=>\`<option\${m===s.model?' selected':''}>\${m}</option>\`).join('');
           $('#ratio').innerHTML=S.ratios.map(r=>\`<option\${r===s.ratio?' selected':''}>\${r}</option>\`).join('');
           $('#target').innerHTML=S.accounts.map(a=>\`<option value="\${a}"\${a===s.targetAccount?' selected':''}>\${a==='spread'?'spread — each item to a different account':a}</option>\`).join('');
           $('#spreadPool').innerHTML=accts().map(a=>\`<label class="chip" style="cursor:pointer;display:inline-flex;gap:6px;align-items:center"><input type="checkbox" class="sp" value="\${a}"\${(s.spreadPool||accts()).includes(a)?' checked':''}>\${a} <b style="color:var(--faint)">\${(S.spreadCounts||{})[a]??0}</b></label>\`).join('');$('#spreadBox').style.display=$('#target').value==='spread'?'':'none';
           $('#res').value=s.res;$('#concurrency').value=s.concurrency;$('#boost').value=s.boost;$('#display').value=s.display;$('#strength').value=s.strength;$('#upscale').checked=s.upscale;
           $('#queuePath').value=s.queuePath;$('#autoDistribute').checked=s.autoDistribute;$('#requireMetadata').checked=s.requireMetadata;$('#runMetadata').checked=s.runMetadata;$('#autoMetadata').checked=s.autoMetadata;$('#autoFinish').value=s.autoFinishMinutes;$('#c_cloud').value=S.creds.cloud_name||''}

          function itemCard(i){
           const done=i.frames.filter(f=>f.status==='done').length,n=i.frames.length;
           const shape=i.type==='SINGLE'&&i.settings.ratio!=='9:16'?(i.settings.ratio==='1:1'?' sq':(i.settings.ratio==='16:9'||i.settings.ratio==='4:3')?' land':''):'';
           const frames=i.frames.map((f,k)=>\`<div class="fr \${f.status}\${shape}" title="\${esc(f.name)}\${f.error?' — '+esc(f.error):''}">\${f.status==='done'?\`<img src="\${f.thumb}" loading="lazy" alt="\${esc(f.file)}" onclick="lb('\${f.thumb}','\${esc(i.folder)} · \${esc(f.file)}')">\`:\`<div class="ph">\${f.status==='running'?'rendering…':f.status==='failed'?'failed':'queued'}</div>\`}\${i.status!=='running'&&!i.distributed.length?\`<button class="re" title="Regenerate \${esc(f.name)}" onclick="retry(\${i.id},\${k})">\${RE}</button>\`:''}<div class="cap">\${esc(f.name)}</div></div>\`).join('');
           const dist=i.distributed.length?\`<span class="st dist">🔒 \${esc(i.distributed[0].dbName)} only</span>\`:'';const mst=i.status==='done'&&i.meta&&i.meta.title?\`<span class="st dist" style="color:\${i.meta.policyCheck==='held'?'#ffb3b3':'#9ef0c6'}">\${i.meta.policyCheck==='held'?'🛑 held':'🧠 meta ✓'}</span>\`:'';
           const busyDist='';
           return \`<article class="item \${i.status}" data-id="\${i.id}">
            <div class="ih"><div class="idx">\${String(i.index).padStart(2,'0')}</div><div class="ttl"><b title="\${esc(i.folder)}">\${esc(i.concept)}</b><small><span class="type \${typeCls(i.type)}">\${i.type}</span><span>\${esc(i.settings.model)}</span><span>· \${i.settings.res}\${i.type==='SINGLE'?' · '+i.settings.ratio:''}</span></small></div>
             <svg class="ring2" viewBox="0 0 36 36" title="\${done}/\${n}"><circle class="bg" cx="18" cy="18" r="15"/><circle class="fg" cx="18" cy="18" r="15" stroke-dasharray="94.2" stroke-dashoffset="\${(94.2*(1-done/n)).toFixed(1)}" style="\${i.status==='failed'||i.status==='partial'?'stroke:var(--err)':i.status==='running'?'stroke:var(--warn)':''}"/></svg></div>
            \${n<4?\`<div class="strip" data-n="\${n}">\${frames}<div class="beside"><div class="prompt \${openPrompts.has(i.id)?'open':''}" onclick="togglePrompt(\${i.id})">\${esc(i.prompt)}</div><div class="meta2"><span>\${n===1?'1 frame':n+' frames'}</span><span>· \${fmtB(i.frames.reduce((a,f)=>a+(f.size||0),0))}</span></div></div></div>\`
            :\`<div class="strip" data-n="\${n}">\${frames}</div><div class="prompt \${openPrompts.has(i.id)?'open':''}" onclick="togglePrompt(\${i.id})">\${esc(i.prompt)}</div>\`}
            \${i.error?\`<div class="err">\${esc(i.error)}</div>\`:''}\${i.distributeError&&i.distributeStatus!=='running'?\`<div class="err">Distribute · \${esc(i.distributeError)}</div>\`:''}
            \${(i.status==='done'||i.distributed.length)?sentRow(i):''}
            \${metaBlock(i)}
            <div class="if"><div class="meta"><span class="st \${i.status}">\${i.status} · \${done}/\${n}</span>\${mst}\${dist}\${busyDist}</div>
             \${i.status==='done'?distBtn(i):''}
             \${(i.status==='failed'||i.status==='partial')?\`<button class="btn warn sm" onclick="retry(\${i.id})">\${RE}Retry failed</button>\`:''}
             \${i.status!=='running'?\`<button class="btn sec sm icon" title="Remove" onclick="del(\${i.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>\`:''}
            </div></article>\`}

          function render(){const s=S,t=s.totals;
           $('#tFrames').textContent=\`\${t.framesDone} / \${t.frames}\`;ring($('#rFrames'),t.frames?t.framesDone/t.frames:0);
           $('#tItems').textContent=t.items;$('#tItemsDone').textContent=\`\${t.itemsDone} done\`;$('#tDist').textContent=t.distributed;
           const total=s.deadline-s.startedAt,left=Math.max(0,s.deadline-s.now);$('#tLeft').textContent=fmtLeft(left);ring($('#rTime'),left/total);
           $('#bar').style.width=(t.frames?t.framesDone/t.frames*100:0)+'%';
           $('#tMeta').textContent=\`\${t.metaItems} / \${t.itemsDone}\`;ring($('#rMeta'),t.itemsDone?t.metaItems/t.itemsDone:0);
           const mw=s.metaWorker,mwEl=$('#mw');const busy=s.items.some(i=>i.metaStatus==='running');mwEl.className='mw '+(mw.error&&!mw.running?'err':mw.running&&busy?'run':mw.running&&mw.ready?'ok':mw.running?'run':mw.available?'':'off');
           $('#mwTxt').innerHTML=!mw.available?\`<b>Gemini metadata unavailable</b> · \${s.geminiAvailable?'image_metadata.mjs missing':'GEMINI_SESSION not set'} — use Edit on each card\`:mw.running&&!mw.ready?\`<b>Gemini Web</b> <span class="cur">· \${esc(mw.current||'opening…')}</span>\`:mw.running?\`<b>Gemini Web \${busy?'writing':'ready'}</b> <span class="cur">· \${esc(mw.current||'idle')}</span>\${t.metaPending?\` · \${t.metaPending} pending\`:''} · ✅ \${mw.done} 🛑 \${mw.held} ❌ \${mw.failed}\`:mw.error?\`<b>Gemini worker stopped</b> · \${esc(mw.error)}\`:\`<b>Gemini worker idle</b>\${mw.lastExit?\` · exit \${mw.lastExit.code} at \${fmtT(mw.lastExit.at)}\`:''} · ✅ \${mw.done} 🛑 \${mw.held} ❌ \${mw.failed}\`;
           $('#metaRunBtn').disabled=!mw.available||(!t.metaNeeded&&mw.running);$('#metaNeed').textContent=t.metaNeeded?t.metaNeeded:'';
           $('#credPill').classList.toggle('off',!s.creds.ok);$('#credTxt').textContent=s.creds.ok?s.creds.cloud_name:'no credentials';
           $('#credHint').textContent=s.creds.ok?\`Connected to cloud "\${s.creds.cloud_name}" (key \${s.creds.api_key}). Fill all three fields to replace.\`:'Add cloud name, API key and API secret from your Cloudinary console.';
           $('#credBanner').classList.toggle('on',!s.creds.ok&&s.items.some(i=>i.status==='queued'));
           $('#pauseBtn').querySelector('span').textContent=s.paused?'Resume':'Pause';$('#pauseBtn').classList.toggle('warn',s.paused);
           const running=s.items.filter(i=>i.status==='running').length,queued=s.items.filter(i=>i.status==='queued').length,failed=s.items.filter(i=>i.status==='failed'||i.status==='partial').length;
           const st=$('#status');st.className='status '+(s.finished?'done':running?'run':s.paused&&queued?'paused':t.items&&!queued?'done':'');
           st.querySelector('span').textContent=s.finished?'finished':running?\`\${running} rendering · \${queued} queued\`:queued?(s.paused?\`paused · \${queued} queued\`:\`\${queued} queued\`):(t.items?'all done':'idle');
           $('#fAll').textContent=t.items;$('#fRun').textContent=running+queued;$('#fDone').textContent=t.itemsDone;$('#fFail').textContent=failed;$('#fDist').textContent=t.distributed;
           const fb=$('#finishedBox');fb.classList.toggle('on',s.finished);if(s.finished)fb.innerHTML=\`<b>Session finished — \${esc(s.finishReason)}</b>The workflow is moving on\${s.settings.runMetadata&&t.records>t.metaReady?' to the final Gemini‑Web metadata pass':''}. Everything generated is saved as the <code>image-studio-output</code> artifact.\`;
           const list=s.items.filter(i=>filter==='all'||(filter==='running'&&(i.status==='running'||i.status==='queued'))||(filter==='done'&&i.status==='done')||(filter==='failed'&&(i.status==='failed'||i.status==='partial'))||(filter==='dist'&&i.distributed.length)||(filter==='unsent'&&i.status==='done'&&!i.distributed.length)||(filter==='nometa'&&i.status==='done'&&!(i.meta&&i.meta.title))||(filter==='held'&&i.meta&&i.meta.policyCheck==='held')||(filter.startsWith('acct:')&&i.distributed.some(d=>d.dbName===filter.slice(5))));
           $('#empty').style.display=s.items.length?'none':'';$('#items').style.display=list.length?'':'none';
           if(s.items.length&&!list.length){$('#empty').style.display='';$('#empty').querySelector('h4').textContent='Nothing matches this filter';$('#empty').querySelector('p').textContent='Try another filter above.'}
           else if(!s.items.length){$('#empty').querySelector('h4').textContent='Nothing in the collection yet';$('#empty').querySelector('p').textContent='Paste prompts on the left — singles, 24‑hour, dual or battery sets — and watch them render here frame by frame.'}
           if(editId!==null&&!s.items.some(i=>i.id===editId))editId=null;
           if(editId===null){$('#items').innerHTML=list.map(itemCard).join('')}else{list.forEach(i=>{const el=$('#items').querySelector(\`[data-id="\${i.id}"]\`);if(!el){$('#items').insertAdjacentHTML('beforeend',itemCard(i));return}if(i.id===editId&&el.querySelector('.medit'))return;el.outerHTML=itemCard(i)})}
           $('#acctsum').innerHTML='<span class="lbl">Sent per account</span>'+accts().map(a=>{const n=s.items.filter(i=>i.distributed.some(d=>d.dbName===a)).length;return \`<button class="\${acls(a)} \${filter==='acct:'+a?'on':''} \${n?'':'none'}" onclick="acctFilter('\${a}')"><i></i>\${a} <b>\${n}</b></button>\`}).join('')+(s.items.some(i=>i.status==='done'&&!i.distributed.length)?\`<button class="\${filter==='unsent'?'on':''}" onclick="acctFilter('unsent')">not sent <b>\${s.items.filter(i=>i.status==='done'&&!i.distributed.length).length}</b></button>\`:'')+(t.metaNeeded?\`<button class="meta \${filter==='nometa'?'on':''}" onclick="acctFilter('nometa')"><i></i>needs metadata <b>\${t.metaNeeded}</b></button>\`:'')+(t.metaHeld?\`<button class="held \${filter==='held'?'on':''}" onclick="acctFilter('held')"><i></i>policy hold <b>\${t.metaHeld}</b></button>\`:'');
           const lg=$('#log');const atBottom=lg.scrollHeight-lg.scrollTop-lg.clientHeight<40;
           lg.innerHTML=s.log.slice(-200).map(l=>{const m=l.match(/^(\\[[^\\]]+\\])\\s?(.*)$/);const body=m?m[2]:l;const cls=/✅|🔥|🏁/.test(body)?'ok':/❌|✖/.test(body)?'er':/⚠️|⟳|⏸/.test(body)?'wn':/🎨|📥|☁️|🚀|🔑|▶️/.test(body)?'in':'';return \`<span class="ts">\${esc(m?m[1]:'')}</span> <span class="\${cls}">\${esc(body)}</span>\`}).join('\\n');
           if(atBottom)lg.scrollTop=lg.scrollHeight;$('#lastLog').textContent=s.log.length?s.log[s.log.length-1].replace(/^\\[[^\\]]+\\]\\s?/,''):'waiting for the runner…'}

          async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.status===401){location.reload();return}S=await r.json();if(!inited){fillSettings();inited=true}render()}catch(e){$('#status').className='status';$('#status').querySelector('span').textContent='reconnecting…'}}
          window.redoMeta=async id=>{const i=S.items.find(x=>x.id===id);if(i&&i.meta&&!confirm(\`Ask Gemini Web again for this \${i.type==='SINGLE'?'image':'set'}?\${i.distributed.length?\`\\nThe new metadata will be patched on \${i.distributed.length} sent record(s).\`:''}\`))return;try{await api('/api/meta/redo',{id});toast('Queued for Gemini Web','good')}catch(e){toast(e.message,'bad')}poll()};
          window.editMeta=id=>{editId=id;render()};window.cancelEdit=()=>{editId=null;render()};
          window.saveMeta=async(ev,id)=>{ev.preventDefault();const f=new FormData(ev.target);try{const r=await api('/api/meta/set',{id,title:f.get('title'),tags:f.get('tags'),category:f.get('category'),description:f.get('description')});editId=null;toast(r.patched?\`Metadata saved · \${r.patched} Firebase record(s) patched\`:'Metadata saved','good')}catch(e){toast(e.message,'bad')}poll()};
          $('#metaRunBtn').onclick=async()=>{try{const r=await api('/api/meta/run');toast(r.queued?\`\${r.queued} item(s) queued for Gemini Web\`:'Gemini worker (re)started','good')}catch(e){toast(e.message,'bad')}poll()};
          $('#metaRefreshBtn').onclick=async()=>{try{await api('/api/meta/refresh');toast('Record status refreshed from Firebase')}catch(e){toast(e.message,'bad')}poll()};
          window.acctFilter=a=>{const f=(a==='unsent'||a==='nometa'||a==='held')?a:'acct:'+a;filter=filter===f?'all':f;$$('#filters button').forEach(x=>x.classList.toggle('on',x.dataset.f===(filter==='all'?'all':'')));render()};
          window.togglePrompt=id=>{openPrompts.has(id)?openPrompts.delete(id):openPrompts.add(id);render()};
          window.lb=(src,cap)=>{$('#lbImg').src=src;$('#lbCap').textContent=cap;$('#lb').classList.add('on')};$('#lb').onclick=()=>$('#lb').classList.remove('on');document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});
          window.retry=async(id,frame)=>{try{await api('/api/retry',{id,frame});toast(frame===undefined?'Re-queued failed frames':'Frame re-queued')}catch(e){toast(e.message,'bad')}poll()};
          window.del=async id=>{if(!confirm('Remove this item and its files?'))return;try{await api('/api/delete',{id})}catch(e){toast(e.message,'bad')}poll()};
          window.dist=async(id,held)=>{if(held&&!confirm('This item is on Zedge policy hold. It will be pushed as status FAILED / policyCheck HELD (visible in the app\\'s Failed section, not uploaded). Continue?'))return;try{const r=await api('/api/distribute',{ids:[id],target:$('#target').value});toast(\`Distributing \${r.count} item → \${$('#target').value}\`,'good')}catch(e){toast(e.message,'bad')}poll()};
          $('#distAllBtn').onclick=async()=>{try{const r=await api('/api/distribute',{ids:'all',target:$('#target').value});toast(\`Distributing \${r.count} item(s) → \${$('#target').value}\${r.skipped?\` · \${r.skipped} waiting for metadata\`:''}\`,'good')}catch(e){toast(e.message,'bad')}poll()};
          $('#pauseBtn').onclick=async()=>{await api('/api/pause',{paused:!S.paused});poll()};
          document.addEventListener('change',e=>{if(e.target&&e.target.id==='target'&&S){$('#spreadBox').style.display=e.target.value==='spread'?'':'none';render()}});
          $$('#filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;$$('#filters button').forEach(x=>x.classList.toggle('on',x===b));render()});
          $('#consoleBar').onclick=()=>{const c=$('#console');c.classList.toggle('open');$('#consoleHint').textContent=c.classList.contains('open')?'▼ close':'▲ open';if(c.classList.contains('open')){const lg=$('#log');lg.scrollTop=lg.scrollHeight}};
          $('#finishBtn').onclick=async()=>{const nd=S.items.filter(i=>i.status==='done'&&!i.distributed.length).length,busy=S.items.filter(i=>i.status==='running'||i.status==='queued').length;
           if(!confirm(\`Finish the session?\${busy?\`\\n• \${busy} item(s) still queued/rendering will be abandoned.\`:''}\${nd?\`\\n• \${nd} completed item(s) are NOT distributed (they stay in the ZIP artifact).\`:''}\${S.settings.runMetadata&&S.totals.records>S.totals.metaReady?'\\n• The final Gemini‑Web metadata pass runs next for records still missing metadata.':''}\`))return;await api('/api/finish');toast('Finishing session…');poll()};
          $$('[data-save]').forEach(b=>b.onclick=async()=>{const pane=b.closest('.pane'),msgEl=pane.querySelector('[id^=saveMsg]');try{
           const settings={model:$('#model').value,res:$('#res').value,ratio:$('#ratio').value,boost:$('#boost').value,display:$('#display').value,strength:$('#strength').value,upscale:$('#upscale').checked,concurrency:$('#concurrency').value,targetAccount:$('#target').value,spreadPool:$$('#spreadPool .sp:checked').map(x=>x.value),queuePath:$('#queuePath').value,autoDistribute:$('#autoDistribute').checked,requireMetadata:$('#requireMetadata').checked,runMetadata:$('#runMetadata').checked,autoMetadata:$('#autoMetadata').checked,autoFinishMinutes:$('#autoFinish').value};
           const credentials={cloud_name:$('#c_cloud').value.trim(),api_key:$('#c_key').value.trim(),api_secret:$('#c_secret').value.trim()};
           const r=await api('/api/settings',{settings,credentials});msgEl.textContent='Saved ✓'+(r.creds.ok?'':' · keys still missing');$('#c_key').value='';$('#c_secret').value='';toast('Settings saved','good')}catch(e){msgEl.textContent=e.message;toast(e.message,'bad')}poll()});
          $('#addBtn').onclick=async()=>{const m=$('#addMsg');try{$('#addBtn').disabled=true;const r=await api('/api/prompts',{text:$('#ptext').value,type:document.querySelector('input[name=ptype]:checked').value,copies:$('#copies').value});
           setMsg(m,\`Queued \${r.added} item(s) · \${r.frames} frame(s)\${r.problems.length?' · skipped: '+r.problems.join('; '):''}\${r.credsOk?'':' — add Cloudinary keys to start'}\`,r.credsOk?'ok':'bad');$('#ptext').value='';$('#ptext').dispatchEvent(new Event('input'));toast(\`Queued \${r.added} item(s)\`,'good');if(!r.credsOk){$$('.tab')[3].click()}}catch(e){setMsg(m,e.message,'bad');toast(e.message,'bad')}finally{$('#addBtn').disabled=false}poll()};
          poll();setInterval(poll,2500);
          </script></body></html>

          `;

          server.listen(PORT, () => {
            log(`🖥️  Image Studio listening on http://localhost:${PORT}/?k=${TOKEN}`);
            log(`⏱️  Session deadline: ${new Date(deadline).toISOString()} (${TIMEOUT_MIN} min)`);
            log(hasCreds() ? `🔑 Cloudinary cloud: ${creds.cloud_name}` : '⚠️  No Cloudinary credentials yet — add them in the panel (or CLOUDINARY_* secrets).');
            log(state.metaWorker.available ? `🧠 Gemini-Web metadata worker ready (${path.basename(METADATA_SCRIPT)})` : `⚠️  Metadata worker unavailable: ${GEMINI_AVAILABLE ? 'image_metadata.mjs missing' : 'GEMINI_SESSION not set'} — metadata will not be generated in-session`);
            saveState();
          });
          process.on('SIGTERM', () => finish('runner stopped'));
          process.on('SIGINT', () => finish('interrupted'));
          STUDIO_EOF
          node --check studio_server.mjs && echo "✅ studio_server.mjs OK ($(wc -l < studio_server.mjs) lines)"


      - name: 🚀 Start Image Studio + Cloudflare tunnel
        if: github.event.inputs.mode == 'image_studio'
        id: tunnel
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          TARGET_ACCOUNT: ${{ github.event.inputs.target_account }}
          IMAGE_QUEUE_PATH: ${{ github.event.inputs.image_queue_path }}
          STUDIO_TIMEOUT_MINUTES: ${{ github.event.inputs.studio_timeout_minutes }}
          STUDIO_AUTO_METADATA: ${{ github.event.inputs.studio_auto_metadata }}
          GEMINI_SESSION: ${{ secrets.GEMINI_SESSION }}
          GEMINI_SESSION_INPUT: ${{ github.event.inputs.gemini_session }}
          METADATA_SCRIPT: ${{ github.workspace }}/image_metadata.mjs
          STUDIO_META_DIR: /tmp/studio_meta
          STUDIO_OUT_DIR: /tmp/studio_out
          STUDIO_RESULT_FILE: /tmp/studio_result.json
        run: |
          # Random access token — the tunnel URL is public, the panel only opens with ?k=TOKEN
          STUDIO_TOKEN="$(openssl rand -hex 12)"
          export STUDIO_TOKEN
          mkdir -p /tmp/studio_out

          nohup node studio_server.mjs > /tmp/studio_server.log 2>&1 &
          echo $! > /tmp/studio_server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8787/healthz > /dev/null || { echo "❌ Studio server did not start"; cat /tmp/studio_server.log; exit 1; }
          echo "✅ Studio server up (pid $(cat /tmp/studio_server.pid))"
          [ -f image_metadata.mjs ] && echo "🧠 image_metadata.mjs present — Gemini-Web metadata runs BEFORE every distribute" || echo "⚠️ image_metadata.mjs missing — in-session metadata disabled"

          nohup cloudflared tunnel --url http://localhost:8787 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          TUNNEL_URL=""
          for i in $(seq 1 90); do
            TUNNEL_URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            [ -n "$TUNNEL_URL" ] && break
            sleep 1
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Could not obtain a trycloudflare.com URL"; cat /tmp/cloudflared.log; exit 1
          fi
          PANEL_URL="${TUNNEL_URL}/?k=${STUDIO_TOKEN}"
          echo "$PANEL_URL" > /tmp/studio_url.txt
          echo "panel_url=$PANEL_URL" >> "$GITHUB_OUTPUT"

          echo ""
          echo "══════════════════════════════════════════════════════════════════════"
          echo "  🎨  IMAGE STUDIO PANEL IS LIVE"
          echo ""
          echo "  👉  $PANEL_URL"
          echo ""
          echo "  ⏱️  Session length: ${STUDIO_TIMEOUT_MINUTES:-240} min (press 'Finish session' in the panel when done)"
          echo "══════════════════════════════════════════════════════════════════════"
          echo ""
          {
            echo "## 🎨 Image Studio panel"
            echo ""
            echo "### 👉 [Open the panel]($PANEL_URL)"
            echo ""
            echo '```'
            echo "$PANEL_URL"
            echo '```'
            echo ""
            echo "- Session length: **${STUDIO_TIMEOUT_MINUTES:-240} min** · target account default: **${TARGET_ACCOUNT}** · queue: **${IMAGE_QUEUE_PATH}**"
            echo "- Paste prompts (one per line, \`TYPE | concept | prompt\`, or JSON), choose model / ratio / settings, then **Add to queue**."
            echo "- Generation runs on this runner even if your connection drops — reopen the link to continue."
            echo "- As soon as a set / image is rendered, **Gemini Web writes its title · tags · category · description + Zedge policy check** (same image_metadata.mjs). You can Edit / Redo it on the card."
            echo "- **Distribute** then sends the JPGs to R2 and pushes the Firebase record **with the metadata already inside** (ringtone-job order) — the Zedge bot never skips it for missing metadata. Policy-flagged items are pushed as status failed / held."
            echo "- **Finish session** ends the panel; a final Firebase-scan metadata pass runs only if some record was pushed without metadata."
            echo "- 🔀 Target **spread** hands a batch out across zedge_1–4 (each set/image to a different, least-loaded account); the per-account checkboxes choose which accounts take part."
            echo "- 🔒 **One image / set → one Zedge account.** Distributed items are locked; re-sending to another (or the same) account is refused, frames cannot be regenerated after distribution, and a SHA-256 ledger (\`distribution_ledger.json\` in the artifact) blocks any byte-identical file ever uploaded before."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"


      - name: 🖥️ Panel session (live log — ends when you press Finish, on idle auto-finish, or at timeout)
        if: github.event.inputs.mode == 'image_studio'
        run: |
          PID="$(cat /tmp/studio_server.pid)"
          echo "🔗 Panel: $(cat /tmp/studio_url.txt)"
          echo "⏳ Waiting for the session to finish (server pid $PID)..."
          # Stream the studio log live into the Actions log while the server is alive
          tail -n +1 -f /tmp/studio_server.log --pid="$PID" || true
          # Small grace period for the result file to be flushed
          sleep 3
          kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          if [ ! -f /tmp/studio_result.json ]; then
            echo "⚠️ No result file — the server stopped unexpectedly"
            echo '{"reason":"server stopped unexpectedly","items":0,"generated":0,"frames":0,"distributed":0,"records":0,"runMetadata":false}' > /tmp/studio_result.json
          fi
          cat /tmp/studio_result.json


      - name: 📤 Publish session result
        id: result
        if: always() && github.event.inputs.mode == 'image_studio'
        run: |
          R=/tmp/studio_result.json
          [ -f "$R" ] || echo '{"reason":"no session","items":0,"generated":0,"frames":0,"distributed":0,"records":0,"runMetadata":false}' > "$R"
          echo "run_metadata=$(jq -r '.runMetadata // false' $R)" >> "$GITHUB_OUTPUT"
          echo "records=$(jq -r '.records // 0' $R)" >> "$GITHUB_OUTPUT"
          echo "generated=$(jq -r '.generated // 0' $R)" >> "$GITHUB_OUTPUT"
          {
            echo "## 🎨 Image Studio results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Ended because | $(jq -r '.reason' $R) |"
            echo "| Items (sets + singles) | $(jq -r '.items' $R) |"
            echo "| Fully generated items | $(jq -r '.generated' $R) |"
            echo "| Frames generated | $(jq -r '.frames' $R) |"
            echo "| Items distributed | $(jq -r '.distributed' $R) |"
            echo "| Firebase records written | $(jq -r '.records' $R) |"
            echo "| Items with metadata before distribute | $(jq -r '.itemsWithMeta // 0' $R) / $(jq -r '.generated' $R) |"
            echo "| Records pushed WITH metadata | $(jq -r '.metaReady // 0' $R) / $(jq -r '.records' $R) |"
            echo "| Zedge policy holds | $(jq -r '.held // 0' $R) |"
            echo "| Final metadata pass after session | $(jq -r '.runMetadata' $R) |"
            echo ""
            echo "### 🔥 Sent per account"
            echo ""
            echo "| Account | Items |"
            echo "|---------|-------|"
            jq -r '.perAccount // {} | to_entries[] | "| \(.key) | \(.value) |"' $R
            echo ""
            if [ "$(jq -r '.manifest | length' $R)" != "0" ]; then
              echo "<details><summary>📋 Item → account manifest</summary>"
              echo ""
              echo "| # | Item | Type | Status | Sent to (Firebase key) → Gemini title · category · policy |"
              echo "|---|------|------|--------|-----------------------------------------------------------|"
              jq -r '.manifest | to_entries[] | "| \(.key+1) | \(.value.folder) | \(.value.type) | \(.value.status) | \(if (.value.sentTo|length)==0 then "—" else ([.value.sentTo[] | "\(.account) (`\(.firebaseKey)`)" + (if .title != "" then " → \(.title) · \(.category) · \(.policy)" else " → metadata pending" end)] | join("<br>")) end) |"' $R
              echo ""
              echo "</details>"
              echo ""
            fi
            echo "> All generated JPGs + prompts + metadata.json are attached as the **image-studio-output** artifact (also downloadable as ZIP from the panel)."
          } >> "$GITHUB_STEP_SUMMARY"


      - name: 🖼️ Generate Image Metadata & Patch Firebase
        # mode=metadata: always. mode=image_studio: final pass only when the panel reported
        # distributed records that still lack metadata (or the toggle was left on).
        if: github.event.inputs.mode == 'metadata' || (github.event.inputs.mode == 'image_studio' && steps.result.outputs.run_metadata == 'true')
        env:
          GEMINI_SESSION: ${{ secrets.GEMINI_SESSION }}
          GEMINI_SESSION_INPUT: ${{ github.event.inputs.gemini_session }}
          IMAGE_QUEUE_PATH: ${{ github.event.inputs.image_queue_path }}
        run: |
          node --experimental-vm-modules image_metadata.mjs

      - name: 🗂️ Upload generated images (artifact)
        if: always() && github.event.inputs.mode == 'image_studio'
        uses: actions/upload-artifact@v4
        with:
          name: image-studio-output
          path: /tmp/studio_out/
          if-no-files-found: warn
          retention-days: 7


      - name: 🧾 Upload studio + tunnel logs
        if: always() && github.event.inputs.mode == 'image_studio'
        uses: actions/upload-artifact@v4
        with:
          name: image-studio-logs
          path: |
            /tmp/studio_server.log
            /tmp/cloudflared.log
          if-no-files-found: ignore
          retention-days: 3


      - name: 🎥 Upload Session Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-recording
          path: /tmp/playwright-videos/
          if-no-files-found: warn
          retention-days: 3

      - name: 📸 Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: /tmp/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: 📊 Upload Run Summary
        if: always()
        run: |
          if [ "${{ github.event.inputs.mode }}" = "image_studio" ]; then
            echo "## 🖼️ Final metadata pass (after Image Studio session)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🖼️ Image Metadata Generator Results" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | Auto-scan (all images missing metadata) |" >> $GITHUB_STEP_SUMMARY
          echo "| Queue path | ${{ github.event.inputs.image_queue_path }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target DBs | All (zedge_1, zedge_2, zedge_3) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Image metadata generated via Gemini Web (image upload) and patched back to Firebase." >> $GITHUB_STEP_SUMMARY
