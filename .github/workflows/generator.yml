name: "☁️ Generator Hub - Ringtone + Image Studio + Metadata (single workflow)"
run-name: "🎯 MODE: ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "🎯 Which generator runs (the other is skipped)"
        required: true
        default: "ringtone"
        type: choice
        options:
          - ringtone
          - metadata
          - image_studio

      image_queue_path:
        description: "📂 Firebase path to scan for images"
        required: true
        default: "wallpaperQueue"

      auto_generate_count:
        description: "🤖 Auto-generate N ringtones (0 to disable)"
        required: true
        default: "10"

      length_seconds:
        description: "⏱️ Duration per ringtone (seconds, e.g. 5)"
        required: true
        default: "5"

      auto_process:
        description: "🎛️ Auto-process audio (trim silence + volume boost)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      volume_boost_pct:
        description: "🔊 Volume boost % (100–400)"
        required: false
        default: "200"

      silence_threshold:
        description: "🔇 Silence trim threshold (0.005–0.1)"
        required: false
        default: "0.02"

      pad_ms:
        description: "⏩ Edge padding ms (0–500)"
        required: false
        default: "100"

      target_account:
        description: "🔥 Target Firebase DB (Zedge account)"
        required: true
        default: "zedge_2"
        type: choice
        options:
          - zedge_1
          - zedge_2
          - zedge_3
          - all_accounts

      gemini_session:
        description: "🌐 Gemini Web Session JSON (paste storageState JSON — no API key needed!)"
        required: false
        default: ""

      studio_timeout_minutes:
        description: "🎨 [image_studio] Max panel session length in minutes (5–330; job hard limit is 360)"
        required: false
        default: "240"

      studio_auto_metadata:
        description: "🎨 [image_studio] Gemini-Web metadata BEFORE distribute (title/tags/category written into each Firebase record, like the ringtone job) + final pass at the end"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  generate-ringtones:
    if: github.event.inputs.mode == 'ringtone'
    name: 🎵 Generate & Push Ringtones to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Install Dependencies
        run: |
          npm init -y
          npm install node-fetch@3 fluent-ffmpeg @ffmpeg-installer/ffmpeg playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install chromium --with-deps

      - name: 🎛️ Install ffmpeg (required for silence trim + volume boost)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: 🖥️ Start Virtual Display (Xvfb)
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "✅ Xvfb virtual display started on :99"

      - name: 🎵 Generate Ringtones & Push to Firebase
        env:
          STABLE_AUDIO_TOKEN: ${{ secrets.STABLE_AUDIO_TOKEN }}
          GEMINI_SESSION: ${{ secrets.GEMINI_SESSION }}
          GEMINI_SESSION_INPUT: ${{ github.event.inputs.gemini_session }}
          AUTO_GENERATE_COUNT: ${{ github.event.inputs.auto_generate_count }}
          TARGET_ACCOUNT: ${{ github.event.inputs.target_account }}
          LENGTH_SECONDS: ${{ github.event.inputs.length_seconds }}
          AUTO_PROCESS: ${{ github.event.inputs.auto_process }}
          VOLUME_BOOST_PCT: ${{ github.event.inputs.volume_boost_pct }}
          SILENCE_THRESHOLD: ${{ github.event.inputs.silence_threshold }}
          PAD_MS: ${{ github.event.inputs.pad_ms }}
        run: |
          cat > generator.mjs << 'SCRIPT_EOF'
          import fetch from 'node-fetch';
          import fs from 'fs';
          import path from 'path';
          import { execSync } from 'child_process';
          import { createRequire } from 'module';

          // ─── CONFIG ────────────────────────────────────────────────────────────────
          const STABLE_AUDIO_TOKEN   = process.env.STABLE_AUDIO_TOKEN?.trim();
          const GEMINI_SESSION_RAW   = (process.env.GEMINI_SESSION_INPUT?.trim() || process.env.GEMINI_SESSION || '').trim();
          const TARGET_ACCOUNT       = (process.env.TARGET_ACCOUNT || 'zedge_2').trim().toLowerCase();
          const QUEUE_PATH           = 'wallpaperQueue';
          const AUTO_GENERATE_COUNT  = parseInt(process.env.AUTO_GENERATE_COUNT || '10', 10);
          const LENGTH_SECONDS       = parseInt(process.env.LENGTH_SECONDS || '30', 10);
          const AUTO_PROCESS         = process.env.AUTO_PROCESS !== 'false';
          const VOLUME_BOOST         = (parseInt(process.env.VOLUME_BOOST_PCT || '200', 10)) / 100;
          const SILENCE_THRESHOLD    = parseFloat(process.env.SILENCE_THRESHOLD || '0.02');
          const PAD_SEC              = (parseInt(process.env.PAD_MS || '100', 10)) / 1000;

          // Parse Gemini session
          if (!GEMINI_SESSION_RAW) {
            console.error('❌ Error: GEMINI_SESSION secret or input is missing. Direct Gemini Web Session is required.');
            process.exit(1);
          }
          let GEMINI_STORAGE_STATE = null;
          try {
            GEMINI_STORAGE_STATE = JSON.parse(GEMINI_SESSION_RAW);
            console.log('🌐 Gemini Web Session loaded successfully (no API key needed!)');
          } catch (e) {
            console.error('❌ Error: GEMINI_SESSION is not valid JSON. Please check your storageState JSON export.');
            process.exit(1);
          }

          let geminiBrowser = null;
          let geminiPage = null;

          async function initGemini() {
            console.log('🌐 Starting Gemini Shared Browser...');
            const { chromium } = await import('playwright-extra');
            const { default: StealthPlugin } = await import('puppeteer-extra-plugin-stealth');
            chromium.use(StealthPlugin());

            geminiBrowser = await chromium.launch({
              headless: false,  // Xvfb display
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage',
                     '--disable-blink-features=AutomationControlled']
            });

            const context = await geminiBrowser.newContext({
              storageState: GEMINI_STORAGE_STATE,
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              viewport: { width: 1280, height: 800 }
            });

            geminiPage = await context.newPage();
            console.log('🌐 Loading gemini.google.com/app/new ...');
            await geminiPage.goto('https://gemini.google.com/app/new', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await sleep(3000);

            // Dismiss any potential introductory overlays / cookie banners
            const dismissSels = [
              'button:has-text("I agree")',
              'button:has-text("Agree")',
              'button:has-text("Got it")',
              'button:has-text("Dismiss")',
              'button:has-text("Close")',
              'button:has-text("OK")'
            ];
            for (const sel of dismissSels) {
              try {
                if (await geminiPage.isVisible(sel)) {
                  await geminiPage.click(sel);
                  console.log(`  🧹 Dismissed overlay: ${sel}`);
                  await sleep(1000);
                }
              } catch (e) {}
            }

            // Verify logged in
            const inputVisible = await geminiPage.isVisible('div.ql-editor[contenteditable="true"]').catch(() => false);
            if (!inputVisible) {
              console.warn('  ⚠️ Gemini session may be expired — input not found. Check GEMINI_SESSION secret.');
              throw new Error('Gemini web: input not found — session likely expired');
            }
            console.log('  ✅ Gemini web session active and initialized!');
          }

          // ─── FIREBASE DB ROUTING ──────────────────────────────────────────────────
          const FIREBASE_DB_MAP = {
            zedge_1: 'https://zedge-1-default-rtdb.firebaseio.com',
            zedge_2: 'https://zedge2-34d95-default-rtdb.firebaseio.com',
            zedge_3: 'https://zedge3-1b3dc-default-rtdb.firebaseio.com'
          };

          // ─── R2 WORKER URL ────────────────────────────────────────────────────────
          const R2_WORKER_URL = 'https://tarek.henrydelacruz0t7.workers.dev';

          // Resolve which DB URLs to target
          let TARGET_DB_URLS;
          if (TARGET_ACCOUNT === 'all_accounts' || TARGET_ACCOUNT === 'all_four' || TARGET_ACCOUNT === 'all_three') {
            TARGET_DB_URLS = Object.entries(FIREBASE_DB_MAP).map(([name, url]) => ({ name, url }));
          } else if (FIREBASE_DB_MAP[TARGET_ACCOUNT]) {
            TARGET_DB_URLS = [{ name: TARGET_ACCOUNT, url: FIREBASE_DB_MAP[TARGET_ACCOUNT] }];
          } else {
            console.error(`❌ Unknown target_account: "${TARGET_ACCOUNT}". Use: zedge_1, zedge_2, zedge_3, all_accounts`);
            process.exit(1);
          }

          // ─── VALIDATION ────────────────────────────────────────────────────────────
          // Note: STABLE_AUDIO_TOKEN is OPTIONAL — if empty, account is auto-created at startup



          let PROMPTS = [];

          console.log('============================================================');
          console.log('  ☁️  BULK RINGTONE GENERATOR → FIREBASE');
          console.log('============================================================');
          console.log(`📋 Auto-Generating: ${AUTO_GENERATE_COUNT} unique ringtones`);
          console.log(`⏱️  Duration: ${LENGTH_SECONDS}s per ringtone`);
          console.log(`🎛️  Auto-process: ${AUTO_PROCESS ? 'Yes' : 'No'}`);

          // ─── FFMPEG RESOLUTION ─────────────────────────────────────────────────────
          // Previously `ffmpeg` was simply assumed to be on PATH. GitHub's ubuntu runner does NOT ship
          // ffmpeg, so every auto-process call threw "ffmpeg: not found", the error was swallowed by a
          // console.warn and the RAW (untrimmed, unboosted) audio was uploaded. Now we resolve a working
          // binary (system ffmpeg → FFMPEG_PATH → @ffmpeg-installer/ffmpeg) and abort early if none works.
          function resolveFfmpeg() {
            const candidates = [process.env.FFMPEG_PATH, 'ffmpeg'];
            try {
              const _req = createRequire(import.meta.url);
              candidates.push(_req('@ffmpeg-installer/ffmpeg').path);
            } catch {}
            for (const c of candidates.filter(Boolean)) {
              try {
                const v = execSync(`"${c}" -version`, { stdio: ['ignore', 'pipe', 'pipe'], timeout: 15000 }).toString().split('\n')[0];
                return { bin: c, version: v };
              } catch {}
            }
            return null;
          }
          const FFMPEG = AUTO_PROCESS ? resolveFfmpeg() : null;
          if (AUTO_PROCESS) {
            console.log(`🔊 Volume Boost: ${Math.round(VOLUME_BOOST * 100)}%`);
            console.log(`🔇 Silence Threshold: ${SILENCE_THRESHOLD}`);
            console.log(`⏩ Pad: ${Math.round(PAD_SEC * 1000)}ms`);
            if (FFMPEG) {
              console.log(`🎬 ffmpeg: ${FFMPEG.bin} (${FFMPEG.version})`);
            } else {
              console.error('❌ auto_process=true but NO working ffmpeg binary was found (system ffmpeg / FFMPEG_PATH / @ffmpeg-installer).');
              console.error('   Silence trim + volume boost would be silently skipped — aborting BEFORE spending generation credits.');
              console.error('   Fix: keep the "Install ffmpeg" step in this workflow, or set auto_process=false.');
              process.exit(1);
            }
          }
          // Audio processing stats for the run summary
          const audioStats = { processed: 0, failed: 0, trimmedSec: 0, reasons: [] };
          console.log(`🎯 Target: ${TARGET_ACCOUNT} → ${TARGET_DB_URLS.map(d => d.name).join(' + ')}`);
          TARGET_DB_URLS.forEach(d => console.log(`   🔥 ${d.name}: ${d.url}`));
          console.log(`📂 Queue Path: ${QUEUE_PATH}`);
          console.log(`🌐 Gemini Mode : Web scraping (gemini.google.com) — direct session!`);
          console.log('============================================================\n');

          // ─── GEMINI VIA WEB SCRAPING (uses saved Google session) ───────────────────
          async function callGeminiWeb(promptText, geminiPage, opts = {}) {
            console.log(`    🌐 Sending prompt (${promptText.length} chars)...`);

            // Click input and clear it
            const inputSel = 'div.ql-editor[contenteditable="true"]';
            await geminiPage.waitForSelector(inputSel, { timeout: 15000 });
            await geminiPage.click(inputSel);
            await geminiPage.keyboard.press('Control+a');
            await geminiPage.keyboard.press('Delete');
            await sleep(200);

            // Get current response count
            const getResponseCount = () => geminiPage.evaluate(() => {
              const selectors = [
                'div[id^="model-response-message-content"]',
                'div[id^="response-message-content"]',
                '.response-content-container',
                'message-content',
                'div.message-content'
              ];
              const seen = new Set();
              for (const sel of selectors) {
                document.querySelectorAll(sel).forEach(el => seen.add(el));
              }
              return seen.size;
            }).catch(() => 0);

            const initialCount = await getResponseCount();

            // Paste prompt and submit via Enter
            await geminiPage.keyboard.insertText(promptText);
            await sleep(500);
            await geminiPage.keyboard.press('Enter');
            console.log(`    ⌨️  Submitted via Enter key`);

            // Poll: wait for the new response element to appear, then stabilize
            const deadline = Date.now() + 90000;
            // v27.10: a reply is only accepted once it contains the closing tag of the LAST template section
            // (opts.completeWhen). Before, a 3 s pause while Gemini was still streaming was mistaken for a
            // finished answer -> half a template got parsed -> the audio prompt silently fell back to
            // "electronic synth pulse" while title/tags described another sound (ringtone != metadata).
            const completeRe = opts.completeWhen || null;
            const softDeadline = Date.now() + 75000;   // after this a stable partial reply is accepted (the parser validates it)
            let responseText = '';
            let lastSeen = '';
            let stableCount = 0;

            while (Date.now() < deadline) {
              await sleep(1500);

              const currentCount = await getResponseCount();
              if (currentCount <= initialCount) {
                continue; // No new response block yet
              }

              // Get the text of the absolute latest response block (DOM sorted)
              const latestText = await geminiPage.evaluate(() => {
                const selectors = [
                  'div[id^="model-response-message-content"]',
                  'div[id^="response-message-content"]',
                  '.response-content p',
                  'message-content',
                  'div.message-content'
                ];
                const allMatching = [];
                for (const sel of selectors) {
                  document.querySelectorAll(sel).forEach(el => allMatching.push(el));
                }
                if (allMatching.length === 0) return '';
                
                // Sort by their position in the document (DOM order)
                allMatching.sort((a, b) => (a.compareDocumentPosition(b) & 4) ? -1 : 1);
                
                const lastEl = allMatching[allMatching.length - 1];
                return lastEl ? (lastEl.innerText || lastEl.textContent || '').trim() : '';
              }).catch(() => '');

              if (!latestText) continue;

              // Track stability
              if (latestText === lastSeen) {
                stableCount++;
                if (stableCount >= 2 && (!completeRe || completeRe.test(latestText) || Date.now() > softDeadline)) {
                  responseText = latestText;
                  break;
                }
              } else {
                lastSeen = latestText;
                stableCount = 0;
              }
            }

            if (!responseText) {
              throw new Error(`Gemini web timeout: no response within 90s`);
            }
            console.log(`    ✅ Got response (${responseText.length} chars)`);
            return responseText;
          }

          // ─── VALID RINGTONE CATEGORIES ─────────────────────────────────────────────
          const VALID_RT_CATS = [
            'LATIN', 'MESSAGE_TONES', 'OTHER', 'POP', 'RNB_SOUL', 'REGGAE', 'RELIGIOUS', 'ROCK',
            'SAYINGS', 'ALTERNATIVE', 'ANIMALS', 'BLUES', 'BOLLYWOOD', 'CHILDREN', 'CLASSICAL',
            'SOUND_EFFECTS', 'WORLD', 'COMEDY', 'CONTACT_RINGTONES', 'COUNTRY', 'DANCE',
            'ELECTRONICA', 'GAMES', 'HIP_HOP', 'HOLIDAYS', 'JAZZ'
          ];

          // ─── GEMINI RESPONSE CLEANERS ──────────────────────────────────────────────
          function cleanTitle(raw) {
            if (!raw) return '';
            // Remove common conversational prefixes
            raw = raw.replace(/^(here is a title:|title:|the title is:|suggested title:)/i, '').trim();

            // Look for quoted text
            const quoteMatch = raw.match(/"([^"\r\n]{3,60})"/);
            if (quoteMatch) return quoteMatch[1].trim();

            // Look for bold text
            const boldMatch = raw.match(/\*\*([^\*\r\n]{3,60})\*\*/);
            if (boldMatch) return boldMatch[1].trim();

            // Split by lines and filter out conversational fillers
            const lines = raw.split('\n')
              .map(l => l.trim())
              .filter(l => {
                const lower = l.toLowerCase();
                return l.length > 0 &&
                       !lower.startsWith('here') &&
                       !lower.startsWith('sure') &&
                       !lower.startsWith('based') &&
                       !lower.startsWith('suggest') &&
                       !lower.startsWith('the') &&
                       !lower.startsWith('this');
              });

            if (lines.length > 0) {
              return lines[0].replace(/^["'*\s]+|["'*\s]+$/g, '').trim().slice(0, 30);
            }
            return raw.replace(/^["'*\s]+|["'*\s]+$/g, '').slice(0, 30).trim();
          }

          function cleanKeywords(raw) {
            if (!raw) return '';
            const words = raw.match(/[a-zA-Z0-9]{2,20}/g) || [];
            const stopWords = new Set(['here', 'are', 'the', 'keywords', 'based', 'on', 'this', 'prompt', 'and', 'for', 'with', 'your', 'ringtone', 'title', 'tags', 'single', 'word']);
            const uniqueWords = [...new Set(
              words
                .map(w => w.trim())
                .filter(w => {
                  const lower = w.toLowerCase();
                  return w.length > 1 && !stopWords.has(lower);
                })
            )];
            return uniqueWords.slice(0, 10).join(', ');
          }

          function cleanCategory(raw) {
            if (!raw) return 'OTHER';
            const upper = raw.toUpperCase();
            for (const cat of VALID_RT_CATS) {
              if (upper.includes(cat)) {
                return cat;
              }
            }
            return 'OTHER';
          }

          // Write a SHORT description of this ringtone in MAXIMUM 5 WORDS.
          function cleanDescription(raw) {
            if (!raw) return '';
            const quoteMatch = raw.match(/"([^"\r\n]{3,100})"/);
            let text = quoteMatch ? quoteMatch[1] : raw;
            text = text.replace(/^(here is a short description:|description:)/i, '').trim();
            const words = text.split(/\s+/).filter(Boolean);
            return words.slice(0, 5).join(' ');
          }

          // ─── ZEDGE CONTENT POLICY GUARD (v21) ─────────────────────────────────────
          // Enforces Zedge's Content Guidelines on everything this workflow produces:
          // original-only (no artists, songs, characters, brands, logos, celebrities), no
          // adult / hate / violence / drugs / illegal content, accurate non-promotional
          // metadata, 2–10 real tags. Violations are regenerated or skipped — never uploaded.
          const ZEDGE_POLICY_RULES = `ZEDGE MARKETPLACE POLICY (MANDATORY — a single violation permanently suspends the seller account):
          - 100% ORIGINAL work only. Never name, reference, imitate or hint at any real artist, band, singer, song, lyric, album, film, TV show, game, anime, cartoon, comic, character, franchise, brand, company, product, logo, trademark, sports team, celebrity or public figure. No "in the style of", no "sounds like", no theme/cover/remix of anything existing.
          - No sexual, suggestive, nude or adult content. No hate speech, slurs, hate symbols, discrimination or stereotypes. No violence, gore, weapons, drugs, self-harm or illegal activity. Nothing involving minors.
          - Metadata must be truthful and describe ONLY this item. No promotional or spam words (free, download, app, website, subscribe, follow, link, buy), no URLs, hashtags, @handles, emojis, brand or service names, no misleading keywords.
          - Keywords: between 2 and 10 genuine descriptive single words.`;
          const POLICY_PROMO = /\b(free|download|downloads|website|subscribe|follow|buy|sale|discount|promo|www|http|https|telegram|whatsapp|instagram|tiktok|youtube|facebook|twitter|zedge)\b/i;
          const POLICY_ADULT = /\b(sexy|sex|sexual|nude|nudity|naked|porn|porno|xxx|erotic|erotica|boobs|breasts?|booty|bikini|lingerie|topless|hot girls?|seductive|nsfw|hentai|fetish|stripper|thong|underwear|cleavage)\b/i;
          const POLICY_HARM = /\b(nigg\w*|fagg?\w*|retard\w*|murder|gore|gun|guns|rifle|pistol|shooting|shooter|terror\w*|nazi|hitler|swastika|isis|jihad|marijuana|cocaine|heroin|meth|drugs|suicide|self-harm|rape|racist|slur)\b/i;
          const POLICY_IP = /\b(disney|pixar|marvel|dc comics|batman|superman|spider-?man|iron ?man|avengers|wolverine|x-?men|deadpool|harley quinn|star ?wars|darth|vader|yoda|jedi|mandalorian|grogu|harry ?potter|hogwarts|lord of the rings|hobbit|game of thrones|stranger things|squid game|breaking bad|pokemon|pikachu|charizard|super mario|luigi|zelda|minecraft|fortnite|roblox|among us|gta|call of duty|pubg|free fire|valorant|league of legends|overwatch|god of war|kratos|elden ring|naruto|goku|dragon ?ball|one piece|luffy|attack on titan|demon slayer|jujutsu|gojo|itachi|sasuke|death note|my hero academia|hello kitty|sanrio|mickey|minnie|donald duck|elsa|moana|encanto|toy story|shrek|minions|despicable|kung fu panda|spongebob|simpsons|rick and morty|peppa|paw patrol|barbie|hot wheels|lego|nike|adidas|puma|gucci|louis vuitton|iphone|samsung|xiaomi|oneplus|huawei|tesla|bmw|mercedes|audi|ferrari|lamborghini|porsche|toyota|coca-?cola|pepsi|starbucks|mcdonald'?s|kfc|netflix|spotify|nfl|nba|fifa|uefa|real madrid|barcelona|manchester united|liverpool fc|juventus|psg|messi|ronaldo|neymar|mbappe|lebron|taylor swift|beyonce|drake|eminem|rihanna|bts|blackpink|billie eilish|ed sheeran|weeknd|bad bunny|justin bieber|ariana grande|dua lipa|coldplay|imagine dragons|linkin park|metallica|beatles|nirvana|michael jackson|elvis|kanye|travis scott|post malone|shakira|adele|bruno mars|hans zimmer|john williams|bollywood|shah rukh|salman khan|allu arjun|pushpa|kgf|pathaan|jawan|kabir singh|arijit|pritam|ar rahman|a\.r\. rahman|anirudh|nokia|nokia tune|marimba|over the horizon|xbox|playstation|nintendo|godzilla|king kong|jurassic|transformers|optimus prime|bumblebee|pirates of the caribbean|jack sparrow|james bond|mission impossible|john wick|fast and furious|terminator|poppy playtime|huggy wuggy|skibidi|fnaf|cuphead|genshin|honkai|clash of clans|clash royale|brawl stars|candy crush|angry birds|subway surfers|temple run|flappy bird|tom and jerry|doraemon|shinchan|ben 10|scooby|looney|bugs bunny|winnie the pooh|cars movie|lightning mcqueen|olaf|stitch|lilo|baymax|zootopia|inside out|wednesday addams|squid|haikyuu|chainsaw man|spy x family|frieren|solo leveling|sung jinwoo)\b/i;
          function zedgePolicyIssues(meta) {
            const issues = [];
            const fields = { title: meta.title || '', tags: meta.tags || '', description: meta.description || '', prompt: meta.enhancedPrompt || '' };
            for (const [f, v] of Object.entries(fields)) {
              if (!v) continue;
              const ip = v.match(POLICY_IP); if (ip) issues.push(`${f}: protected name "${ip[0]}"`);
              const ad = v.match(POLICY_ADULT); if (ad) issues.push(`${f}: adult term "${ad[0]}"`);
              const hv = v.match(POLICY_HARM); if (hv) issues.push(`${f}: prohibited term "${hv[0]}"`);
              if (f !== 'prompt') {
                const pr = v.match(POLICY_PROMO); if (pr) issues.push(`${f}: promotional/spam word "${pr[0]}"`);
                if (/[#@]|https?:|www\.|\.(com|net|org|io|app)\b/i.test(v)) issues.push(`${f}: link/hashtag/handle`);
              }
            }
            return issues;
          }
          function zedgeCleanTags(tags) {
            const words = String(tags || '').split(/[,\s]+/).map(w => w.trim().toLowerCase()).filter(w => /^[a-z0-9-]{2,20}$/.test(w));
            const out = [];
            for (const w of words) if (!out.includes(w) && !POLICY_IP.test(w) && !POLICY_ADULT.test(w) && !POLICY_HARM.test(w) && !POLICY_PROMO.test(w)) out.push(w);
            return out.slice(0, 10);
          }
          // Returns { issues, meta } — meta has policy-clean, deduped, 2–10 tags.
          function zedgeEnforce(meta, kind) {
            const issues = zedgePolicyIssues(meta);
            const tags = zedgeCleanTags(meta.tags);
            const fallback = kind === 'image' ? ['wallpaper', 'background', 'art', 'design', 'phone', 'screen'] : ['melody', 'tune', 'alert', 'phone', 'music', 'sound'];
            const cat = String(meta.category || '').toLowerCase().replace(/[^a-z]/g, '');
            if (cat && cat !== 'other' && !tags.includes(cat)) tags.unshift(cat);
            for (const w of fallback) { if (tags.length >= 2) break; if (!tags.includes(w)) tags.push(w); }
            return { issues, meta: { ...meta, tags: tags.slice(0, 10).join(', ') } };
          }
          // ─── METADATA GENERATION ───────────────────────────────────────────────────
          // ─── SMART PROMPT VARIETY ENGINE ─────────────────────────────────────────
          // 1) Shuffled-deck sampling: all 15 themes are dealt before any theme repeats.
          // 2) Per-run memory: a theme item (instrument, animal, etc.) is not reused
          //    until its whole pool has been exhausted.
          // 3) Recent-concept feedback: the last 12 generated titles/prompts are shown
          //    to Gemini with an order to create something COMPLETELY different.
          const _pathDeck = [];
          const _usedThemeItems = new Set();
          const RECENT_CONCEPTS = [];

          function drawPath(paths) {
            if (_pathDeck.length === 0) {
              _pathDeck.push(...[...paths].sort(() => Math.random() - 0.5));
            }
            return _pathDeck.pop();
          }

          function pickFresh(pool, poolName) {
            let fresh = pool.filter(x => !_usedThemeItems.has(`${poolName}:${x}`));
            if (fresh.length === 0) {
              pool.forEach(x => _usedThemeItems.delete(`${poolName}:${x}`));
              fresh = pool;
            }
            const item = fresh[Math.floor(Math.random() * fresh.length)];
            _usedThemeItems.add(`${poolName}:${item}`);
            return item;
          }

          function rememberConcept(title, enhancedPrompt) {
            RECENT_CONCEPTS.push(`"${title}" — ${enhancedPrompt.slice(0, 70)}`);
            if (RECENT_CONCEPTS.length > 12) RECENT_CONCEPTS.shift();
          }

          async function generateMetadataFromPrompt(prompt) {
            console.log(`  🤖 Generating enhanced metadata...`);

            const genres = ['Classical', 'Jazz', 'Acoustic Folk', 'Heavy Metal', 'Country', 'Reggae', 'Blues', 'Latin', 'Bollywood', 'Cinematic Orchestral', 'World Music', 'Celtic Harp', 'Tribal Percussion', 'Soul', 'Funk', 'Opera', 'Bluegrass', 'Flamenco', 'Bossa Nova', 'Salsa', 'Griot', 'Ambient Nature', 'Medieval', 'Renaissance', 'Baroque', 'Gospel', 'R&B', 'Trap Soul', 'Neo Soul', 'Indie Folk', 'Post-Rock', 'Afrobeat', 'K-Pop Instrumental', 'Synthwave', 'Lofi Hip-Hop'];
            const instruments = ['Grand Piano', 'Violin', 'Trumpet', 'Saxophone', 'Cello', 'Acoustic Guitar', 'Sitar', 'Banjo', 'Ukulele', 'Accordion', 'Harmonica', 'Flute', 'Djembe Drums', 'Music Box', 'Marimba', 'Kalimba', 'Bagpipes', 'Steel Pan', 'Harp', 'Didgeridoo', 'Koto', 'Ocarina', 'Lute', 'Tambourine', 'Erhu', 'Duduk', 'Hurdy Gurdy', 'Hang Drum', 'Electric Sitar', 'Theremin'];
            const moods = ['Peaceful', 'Energetic', 'Mysterious', 'Joyful', 'Melancholic', 'Heroic', 'Whimsical', 'Dark', 'Bright', 'Epic', 'Spooky', 'Nostalgic', 'Rustic', 'Celestial', 'Primal', 'Graceful', 'Intense', 'Playful', 'Romantic', 'Triumphant', 'Haunting', 'Serene', 'Frantic', 'Dreamlike'];

            const animals = ['Lion Roar', 'Elephant Trumpet', 'Wolf Howl', 'Whale Song', 'Tropical Birds', 'Eagle Cry', 'Owl Hoot', 'Cat Purr/Meow', 'Dog Barking', 'Horse Neigh', 'Dolphin Click', 'Frog Croak', 'Cricket Chirp', 'Cicada Buzz', 'Fox Scream', 'Bear Growl', 'Humpback Whale', 'Cheetah Chirp', 'Snow Leopard', 'Parrot Mimicry'];
            const comedy = ['Slapstick Cartoon', 'Silly Laugh', 'Meme Sound', 'Clown Horn', 'Funny Sneeze', 'Ridiculous Voice', 'Boing Spring', 'Honk', 'Slide Whistle', 'Fail Horn', 'Trombone Wah-Wah', 'Cartoon Run', 'Squeaky Toy', 'Price Is Right Fail', 'Game Show Buzz'];
            const nature = ['Thunderstorm', 'Ocean Waves', 'Heavy Rain', 'Wind Through Trees', 'Fire Crackling', 'Water Waterfall', 'Avalanche Rumble', 'Bamboo Forest', 'Northern Lights (Aurora Hum)', 'Cave Dripping', 'Earthquake Rumble', 'Tornado Warning', 'Spring Birds Dawn', 'Desert Wind'];
            const sciFi = ['Laser Blast', 'Robot Voice', 'Spaceship Engine', 'Alien Transmission', 'Cybernetic Hum', 'Time Travel Portal', 'Digital Power Up', 'Warning Siren', 'Quantum Computer', 'Warp Drive', 'Hologram Flicker', 'AI Awakening', 'Plasma Shield', 'Nanobots Swarm'];
            const situations = ['Morning Wake-up Alarm', 'Subtle Office Notification', 'High-Energy Gaming Alert', 'Relaxing Spa Background', 'Urgent Siren Style', 'Magical Fantasy Pickup', 'Spooky Haunted House', 'Satisfying ASMR Click', 'Gym Workout Hype', 'Late Night Study', 'Road Trip Energy', 'Cooking Kitchen Ambience', 'Sports Victory Fanfare'];
            const topics = ['Cyberpunk City', 'Deep Space', 'Ancient Temple', 'Undersea Kingdom', 'Industrial Factory', 'Enchanted Forest', 'Virtual Reality', 'Desert Caravan', 'Steam Engine', 'Viking Voyage', 'Samurai Dojo', 'Aztec Pyramid', 'Arctic Expedition', 'Silk Road Journey', 'Pirate Ship'];
            const actions = ['Whirring', 'Echoing', 'Resonating', 'Pulsing', 'Shimmering', 'Crashing', 'Whispering', 'Thumping', 'Gliding', 'Swirling', 'Exploding', 'Dissolving', 'Spiraling', 'Cascading', 'Vibrating'];
            const adjectives = ['Metallic', 'Ethereal', 'Rusty', 'Crystal', 'Shadowy', 'Luminous', 'Velvet', 'Frozen', 'Golden', 'Electric', 'Obsidian', 'Neon', 'Ancient', 'Celestial', 'Molten'];

            // NEW THEME DATA
            const horror = ['Creaking Door', 'Heartbeat Accelerating', 'Distant Screaming', 'Ghostly Whisper', 'Dripping Blood', 'Demon Growl', 'Haunted Music Box', 'Church Bell at Midnight', 'Eerie Silence Breaking', 'Zombie Horde'];
            const sports = ['Stadium Crowd Roar', 'Starting Pistol', 'Basketball Swoosh', 'Soccer Goal Celebration', 'Boxing Bell', 'Race Car Engine', 'Skateboard Tricks', 'Weightlifting Grunt', 'Swimming Splash', 'Tennis Ace'];
            const romance = ['Soft Piano Serenade', 'Violin Love Theme', 'Heartbeat in Sync', 'Candlelight Jazz', 'Acoustic Love Song', 'Wedding Bells', 'Slow Dance Waltz', 'Sunset Guitar', 'Gentle Harp Melody', 'Whispering Lovers'];
            const cultural = ['Indian Tabla Fusion', 'Japanese Shamisen', 'African Djembe Circle', 'Irish Jig', 'Arabic Oud Solo', 'Chinese Pipa Melody', 'Cuban Conga Rhythm', 'Andean Panpipe', 'Mongolian Throat Singing', 'Greek Bouzouki'];
            const kids = ['Playful Xylophone', 'Cartoon Adventure', 'Lullaby Box', 'Silly Monster', 'Magic Toy Land', 'Bubble Pop Fun', 'Playground Melody', 'Rainbow Song', 'Counting Stars', 'Happy Elephant'];
            const asmr = ['Keyboard Typing', 'Paper Turning Pages', 'Rain on Window', 'Whispering Voice', 'Sand Pouring', 'Crunching Leaves', 'Hair Brushing', 'Soft Tapping', 'Coffee Brewing', 'Crackling Fireplace'];
            const epic = ['Orchestral Battle March', 'Choir of Warriors', 'Dragon Theme', 'Kingdom Rising', 'Final Boss Theme', 'Hero Transformation', 'Galaxy Explosion', 'Ancient Gods Awakening', 'Legendary Sword Unsheathing', 'Apocalypse Dawn'];
            const urban = ['City Traffic Jazz', 'Subway Beat', 'Hip-Hop Street', 'Breakbeat Alley', 'Night Club Bass', 'Graffiti Art Funk', 'Skyscraper Wind', 'Street Vendor Rhythm', 'Neon Market', 'Urban Jungle Groove'];

            // Extra creative dimensions so no two sound recipes ever feel alike
            const structures = ['a catchy 3-note hook that repeats once and resolves', 'a rising build that peaks into a bright memorable motif', 'a call-and-response between two contrasting sounds', 'a seamless loop with a satisfying rhythmic groove', 'a gentle intro that blooms into a rich melodic phrase', 'a punchy opening with a sparkling, slowly fading tail', 'a playful question-answer melody that ends on a high note', 'a hypnotic repeating figure with one surprising accent'];
            const productions = ['warm analog studio polish', 'crisp modern cinematic production', 'intimate close-mic organic recording', 'lush layered stereo depth', 'punchy radio-ready mix', 'airy minimalist production with real room ambience'];
            const tempos = ['slow and spacious', 'relaxed mid-tempo', 'upbeat and bouncy', 'fast and exhilarating', 'gently pulsing', 'confident strutting groove'];
            const signatures = ['one unexpected ear-candy detail', 'a signature sound no other ringtone has', 'a tiny human imperfection that makes it feel alive', 'a sparkling harmonic flourish at the very end', 'a bold dynamic contrast between soft and loud', 'a subtle rhythmic twist that rewards repeat listens'];

            const THEME_BUILDERS = {
              Musical:    () => `Style: ${pickFresh(genres, 'genres')} | Lead: ${pickFresh(instruments, 'instruments')} | Mood: ${pickFresh(moods, 'moods')}`,
              Animal:     () => `Type: Animal Sound | Focus: ${pickFresh(animals, 'animals')} | Mood: ${pickFresh(moods, 'moods')}`,
              Comedy:     () => `Type: Comedy/Funny | Sound: ${pickFresh(comedy, 'comedy')} | Character: ${pickFresh(moods, 'moods')}`,
              SciFi:      () => `Type: Sci-Fi / Futuristic | Element: ${pickFresh(sciFi, 'sciFi')} | Vibe: ${pickFresh(moods, 'moods')}`,
              Situation:  () => `Purpose: ${pickFresh(situations, 'situations')} | Atmosphere: ${pickFresh(moods, 'moods')}`,
              SmartTopic: () => `Creative Topic: ${pickFresh(adjectives, 'adjectives')} ${pickFresh(topics, 'topics')} ${pickFresh(actions, 'actions')}`,
              Horror:     () => `Type: Horror/Suspense | Sound: ${pickFresh(horror, 'horror')} | Mood: ${pickFresh(moods, 'moods')}`,
              Sports:     () => `Type: Sports/Action | Sound: ${pickFresh(sports, 'sports')} | Energy: ${pickFresh(moods, 'moods')}`,
              Romance:    () => `Type: Romantic/Emotional | Theme: ${pickFresh(romance, 'romance')} | Mood: ${pickFresh(moods, 'moods')}`,
              Cultural:   () => `Type: World/Cultural Music | Style: ${pickFresh(cultural, 'cultural')} | Mood: ${pickFresh(moods, 'moods')}`,
              Kids:       () => `Type: Children/Playful | Theme: ${pickFresh(kids, 'kids')} | Mood: Joyful and Energetic`,
              ASMR:       () => `Type: ASMR/Relaxing Sounds | Sound: ${pickFresh(asmr, 'asmr')} | Texture: Ultra HD, highly detailed`,
              Epic:       () => `Type: Epic/Cinematic | Theme: ${pickFresh(epic, 'epic')} | Scale: Grand and Powerful`,
              Urban:      () => `Type: Urban/Street | Vibe: ${pickFresh(urban, 'urban')} | Mood: ${pickFresh(moods, 'moods')}`,
              Nature:     () => `Type: Nature Soundscape | Element: ${pickFresh(nature, 'nature')} | Intensity: High`
            };

            const isShort = LENGTH_SECONDS < 6;
            const soundType = isShort ? 'Short Notification/Alert' : 'Full Ringtone';

            // Shuffled-deck draw: all 15 themes appear before any theme repeats
            const selectedPath = drawPath(Object.keys(THEME_BUILDERS));
            const mandatoryTheme = THEME_BUILDERS[selectedPath]();
            const soundRecipe = [
              `- Structure: ${structures[Math.floor(Math.random() * structures.length)]}`,
              `- Tempo/Energy: ${tempos[Math.floor(Math.random() * tempos.length)]}`,
              `- Production: ${productions[Math.floor(Math.random() * productions.length)]}`,
              `- Signature detail: ${signatures[Math.floor(Math.random() * signatures.length)]}`
            ].join('\n');

            const randomSalt = Math.random().toString(36).substring(7);
            const BANNED_WORDS = 'Glitched, Echo, Electronic, Digital, Lo-fi, Synth, Pulse, Wave, Bass, Trap, Chill, Cool, Awesome, Ringtone, Beat, Sound, Vibe, Remix, DJ, Techno, EDM';
            const validCategories = VALID_RT_CATS.filter(c => c !== 'OTHER').join(', ');

            // Craft rules tuned per sound type so notifications and ringtones stop sounding the same
            const craftRules = isShort
              ? `CRAFT RULES for a premium NOTIFICATION sound (${LENGTH_SECONDS}s):\n` +
                `- Design ONE memorable 2-4 note motif with a clean, bright attack and a smooth natural decay.\n` +
                `- It must stay pleasant after being heard 100 times a day: no harsh, shrill, or startling frequencies.\n` +
                `- It must be instantly recognizable and clearly distinct from default iPhone/Samsung tones.\n` +
                `- Name the real instrument or sound source, the exact articulation (plucked, struck, breathy...), and the feel of the decay tail.`
              : `CRAFT RULES for a chart-topping RINGTONE (${LENGTH_SECONDS}s):\n` +
                `- The hook must be instantly recognizable within the FIRST 2 SECONDS.\n` +
                `- Give it a clear melodic identity someone could hum back after one listen.\n` +
                `- It must loop seamlessly and cut through a noisy room on a small phone speaker (strong mids, crisp highs, no muddy lows).\n` +
                `- Name real instruments, an approximate BPM, a key or tonal center, and a clear structure (hook, build, resolve).`;

            const noveltyBlock = RECENT_CONCEPTS.length > 0
              ? `ALREADY GENERATED IN THIS BATCH — your new concept must be COMPLETELY different from ALL of these in melody, instrumentation and feel:\n` +
                RECENT_CONCEPTS.map((c, i) => `${i + 1}. ${c}`).join('\n') + `\n\n`
              : '';

            // v27.10: the audio is rendered by a text-to-MUSIC model. It cannot make realistic animal calls, speech,
            // laughter or real-world foley - asking for "a lion roar" yields a synth pad titled "Lion Roar", i.e. the
            // sound does not match its metadata. Gemini is told what the renderer can do and that TITLE / KEYWORDS /
            // DESCRIPTION must describe the ENHANCED_PROMPT literally (same instruments, mood, tempo).
            const RENDERER_RULES = `AUDIO RENDERER FACTS (the ENHANCED_PROMPT is sent VERBATIM to a text-to-MUSIC AI model that renders exactly ${LENGTH_SECONDS} seconds; nothing is edited afterwards):\n` +
              `- It renders instruments, genres, rhythm, tempo, mood and synthetic textures very well.\n` +
              `- It CANNOT produce realistic animal calls, human voices, speech, laughter, words or recognizable real-world recordings (rain, typing, crowds, engines, sirens...). When the theme is such a sound, translate it into a MUSICAL equivalent (lion roar -> deep growling brass swell over tribal drums; thunderstorm -> rumbling timpani and dark low strings; keyboard typing -> crisp woodblock and rimshot pattern) and describe THAT.\n` +
              `- TITLE, KEYWORDS and DESCRIPTION must describe ONLY what the ENHANCED_PROMPT will literally sound like. Never promise a sound, voice or effect that is not written in the ENHANCED_PROMPT. Every keyword must be justified by a word or idea present in the ENHANCED_PROMPT; use the same instrument, genre and mood words in both.`;

            // Construct the single, unified consolidated prompt
            const CONSOLIDATED_PROMPT = `You are an award-winning mobile sound designer and metadata optimizer. Your ringtones and notification sounds top marketplace charts because they are wildly creative, instantly catchy, and a genuine pleasure to hear — people happily pay for them.\n\n${ZEDGE_POLICY_RULES}\n\n${RENDERER_RULES}\n\n` +
              (prompt 
                ? `I want to generate a ${soundType} based on this idea: "${prompt}".\n` +
                  `Rewrite it into a vivid, detailed 30-word text-to-music prompt with organic, high-definition textures.\n\n${craftRules}\n\n[Salt: ${randomSalt}]\n\n`
                : `First, generate a unique, sellable text-to-music prompt (max 30 words) for a ${soundType}.\n\n` +
                  `MANDATORY THEME: ${mandatoryTheme}\n` +
                  `SOUND DESIGN RECIPE (weave ALL of these into the prompt):\n${soundRecipe}\n\n` +
                  `${craftRules}\n\n` +
                  `CRITICAL: DO NOT use "glitched", "echo", or generic electronic terms unless it is a Sci-Fi element. Focus on HIGH DEFINITION, realistic textures. Be specific and sensory, never generic.\n\n` +
                  `${noveltyBlock}[Random Salt: ${randomSalt}]\n\n`) +
              `Based on that generated text-to-music prompt, also generate the following metadata:\n` +
              `1. A creative and UNIQUE title (max 25 characters). DO NOT USE THESE BANNED WORDS: ${BANNED_WORDS}. Reflect the ${selectedPath} nature and ${soundType} purpose using evocative imagery. No quotes.\n` +
              `2. 10 relevant, descriptive SINGLE-WORD keywords (comma-separated) that truthfully describe THIS sound only. Focus on genre, mood, animals, emotions, vibes. No brands, artists, promo words.\n` +
              `3. The most appropriate category selected ONLY from this list: ${validCategories}.\n` +
              `4. A SHORT description in MAXIMUM 5 WORDS capturing the soul of the sound. No punctuation, no sentences.\n\n` +
              `CRITICAL: You MUST format your entire response exactly like this template so it can be parsed programmatically. Do not include any introductory or concluding text outside these tags:\n` +
              `[ENHANCED_PROMPT]...[/ENHANCED_PROMPT]\n` +
              `[TITLE]...[/TITLE]\n` +
              `[KEYWORDS]...[/KEYWORDS]\n` +
              `[CATEGORY]...[/CATEGORY]\n` +
              `[DESCRIPTION]...[/DESCRIPTION]`;

            if (!geminiPage) {
              throw new Error('Gemini page is not initialized!');
            }

            // Reset to a fresh chat for every new metadata prompt sequence
            console.log('  🌐 Resetting to a fresh Gemini chat...');
            await geminiPage.goto('https://gemini.google.com/app/new', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await sleep(2000);

            // Send the single consolidated prompt
            const responseText = await callGeminiWeb(CONSOLIDATED_PROMPT, geminiPage, { completeWhen: /\[\s*\/\s*DESCRIPTION\s*\]/i });

            // Parser helper for tags
            const getTagValue = (text, tag) => {
              // v27.10 tolerant parser: Gemini renders markdown, so "[ENHANCED_PROMPT]" can come back as
              // "**[ENHANCED PROMPT]**", "[ENHANCEDPROMPT]", with a ":" after it, or without its closing tag.
              // The old strict regex then returned '' and the caller silently used a fallback value.
              const t = tag.replace(/_/g, '[_ \\-]?');
              const open = new RegExp(`\\[\\s*${t}\\s*\\]\\s*:?`, 'i');
              const m = text.match(open);
              if (!m) return '';
              let rest = text.slice(m.index + m[0].length);
              const close = rest.match(new RegExp(`\\[\\s*\\/\\s*${t}\\s*\\]`, 'i'));
              if (close) rest = rest.slice(0, close.index);
              else { const nx = rest.match(/\[\s*\/?\s*(ENHANCED[_ -]?PROMPT|TITLE|KEYWORDS|CATEGORY|DESCRIPTION|POLICY)\s*\]/i); if (nx) rest = rest.slice(0, nx.index); }
              rest = rest.replace(/\*\*/g, '').replace(/^`+|`+$/g, '').replace(/^\s*:\s*/, '').trim();
              return /^(\.{3}|\u2026)$/.test(rest) ? '' : rest;   // the literal "..." template placeholder counts as missing
            };

            const r0 = getTagValue(responseText, 'ENHANCED_PROMPT');
            const r1 = getTagValue(responseText, 'TITLE');
            const r2 = getTagValue(responseText, 'KEYWORDS');
            const r3 = getTagValue(responseText, 'CATEGORY');
            const r4 = getTagValue(responseText, 'DESCRIPTION');

            // v27.10: never fall back silently. A missing ENHANCED_PROMPT / TITLE / KEYWORDS throws, so the caller
            // retries in a fresh chat (3 attempts). Before, a half-parsed reply made Stable Audio render the generic
            // fallback "electronic synth pulse" while the stored title/tags described a completely different sound.
            const missing = [];
            if (!r0 || r0.split(/\s+/).filter(Boolean).length < 5) missing.push('ENHANCED_PROMPT');
            if (!r1) missing.push('TITLE');
            if (!r2) missing.push('KEYWORDS');
            if (missing.length) {
              console.warn(`  ⚠️ Gemini reply incomplete - missing ${missing.join(', ')} | reply head: "${responseText.slice(0, 180).replace(/\s+/g, ' ')}"`);
              throw new Error(`Gemini reply incomplete (missing ${missing.join(', ')}) - regenerating`);
            }
            if (!r3) console.warn('  ⚠️ CATEGORY tag missing -> OTHER');
            if (!r4) console.warn('  ⚠️ DESCRIPTION tag missing -> derived from the title');
            const enhancedPrompt = r0.replace(/^["']|["']$/g, '').trim();
            const finalTitle = cleanTitle(r1) || (prompt || 'Random Ringtone').split(' ').slice(0, 4).join(' ').slice(0, 30);
            const finalTags = cleanKeywords(r2);
            const finalCategory = cleanCategory(r3);
            const finalDesc = cleanDescription(r4) || finalTitle;

            // v27.10 alignment guard: the tags must describe the ENHANCED_PROMPT (= what Stable Audio actually renders).
            // Zero overlap between tag stems and prompt words means the metadata talks about another sound -> regenerate.
            const promptWords = (enhancedPrompt.toLowerCase().match(/[a-z]{3,}/g) || []);
            const stem = (w) => w.slice(0, 4);
            const tagList = finalTags.split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
            const overlap = tagList.filter(tg => promptWords.some(w => w.startsWith(stem(tg)) || tg.startsWith(stem(w))));
            if (tagList.length && overlap.length === 0) {
              console.warn(`  ⚠️ Tags do not describe the audio prompt (0 overlap) - regenerating. Prompt: "${enhancedPrompt.slice(0, 100)}" | Tags: ${finalTags}`);
              throw new Error('metadata does not describe the audio prompt - regenerating');
            }
            console.log(`  🔗 Metadata/audio alignment: ${overlap.length}/${tagList.length} tags found in the audio prompt`);

            console.log(`  ✨ Enhanced Prompt: "${enhancedPrompt}"`);
            rememberConcept(finalTitle, enhancedPrompt);

            return {
              enhancedPrompt: enhancedPrompt,
              title: finalTitle,
              tags: finalTags,
              category: finalCategory,
              description: finalDesc
            };
          }

          // ─── CREDENTIAL HELPERS ────────────────────────────────────────────────────
          function generateRandomEmail() {
            const ts  = Date.now();
            const rnd = Math.random().toString(36).substring(2, 10);
            const domains = ['gmail.com', 'yahoo.com', 'outlook.com', 'hotmail.com'];
            const domain  = domains[Math.floor(Math.random() * domains.length)];
            return `stableaudio_${rnd}_${ts}@${domain}`;
          }

          function generateStrongPassword() {
            const lc  = 'abcdefghijklmnopqrstuvwxyz';
            const uc  = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const num = '0123456789';
            const sp  = '!@#$%^&*';
            let pw = '';
            pw += lc[Math.floor(Math.random() * lc.length)];
            pw += lc[Math.floor(Math.random() * lc.length)];
            pw += uc[Math.floor(Math.random() * uc.length)];
            pw += uc[Math.floor(Math.random() * uc.length)];
            pw += num[Math.floor(Math.random() * num.length)];
            pw += num[Math.floor(Math.random() * num.length)];
            pw += sp[Math.floor(Math.random() * sp.length)];
            pw += sp[Math.floor(Math.random() * sp.length)];
            const all = lc + uc + num + sp;
            for (let i = 0; i < 4; i++) pw += all[Math.floor(Math.random() * all.length)];
            return pw.split('').sort(() => Math.random() - 0.5).join('');
          }

          // ─── AUTO ACCOUNT CREATION (Playwright — mirrors background.js) ───────────
          // Called automatically when Stable Audio API returns a rate-limit error.
          // Returns the new Bearer token string, or throws on failure.
          async function createStableAudioAccount() {
            const email    = generateRandomEmail();
            const password = generateStrongPassword();

            console.log('\n  🤖 AUTO ACCOUNT CREATION STARTED');
            console.log(`  📧 Email   : ${email}`);
            console.log(`  🔑 Password: ${password}`);

            // Use playwright-extra + stealth plugin → bypasses Auth0 bot detection
            // Xvfb virtual display is already running (started by the workflow step above)
            const { chromium } = await import('playwright-extra');
            const { default: StealthPlugin } = await import('puppeteer-extra-plugin-stealth');
            chromium.use(StealthPlugin());

            const browser = await chromium.launch({
              headless: false,  // Real browser on Xvfb — undetectable by Auth0
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-blink-features=AutomationControlled'
              ]
            });

            let capturedToken = null;

            try {
              const context = await browser.newContext({
                userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
              });
              const page = await context.newPage();

              // ── Intercept network to capture Bearer token ──────────────────────────
              // Stable Audio's SPA sends the access token in Authorization headers.
              // We sniff it from outgoing requests to their API.
              page.on('request', req => {
                const auth = req.headers()['authorization'];
                if (auth && auth.startsWith('Bearer ') && req.url().includes('stableaudio.com')) {
                  const tok = auth.replace('Bearer ', '').trim();
                  if (tok.length > 50) {
                    capturedToken = tok;
                    console.log('  🔑 Token captured from network request!');
                  }
                }
              });
              // Also sniff /oauth/token response (PKCE code exchange) — this is the key one!
              page.on('response', async resp => {
                try {
                  const url = resp.url();
                  const isTokenEndpoint = url.includes('/oauth/token') || url.includes('/token') || url.includes('auth0') || url.includes('login.stableaudio');
                  if (isTokenEndpoint && resp.status() === 200) {
                    const json = await resp.json().catch(() => null);
                    if (json && (json.access_token || json.id_token)) {
                      capturedToken = json.access_token || json.id_token;
                      console.log(`  🔑 Token captured from /oauth/token response!`);
                    }
                  }
                } catch {}
              });

              // ── Step 1: Hit Auth0 logout to destroy SSO session server-side ──────
              console.log('  🔓 Step 1: Destroying existing Auth0 SSO session...');
              await page.goto('https://login.stableaudio.com/v2/logout', { waitUntil: 'domcontentloaded', timeout: 15000 }).catch(() => {});
              await sleep(2000);

              // ── Step 2: Clear all cookies + localStorage ──────────────────────────
              console.log('  🧹 Step 2: Wiping all cookies and storage...');
              await context.clearCookies();
              await page.evaluate(() => { try { localStorage.clear(); sessionStorage.clear(); } catch {} }).catch(() => {});

              // ── Step 3: Load Stable Audio fresh ───────────────────────────────────
              console.log('  🌐 Step 3: Loading fresh Stable Audio page...');
              await page.goto('https://stableaudio.com', { waitUntil: 'networkidle', timeout: 30000 });
              await sleep(2000);

              // ── Step 4: Click Sign Up button ─────────────────────────────────────
              console.log('  🖱️  Step 4: Looking for Sign Up button...');
              const signupSelectors = [
                'button:has-text("Sign up")',
                'button:has-text("Sign Up")',
                'a:has-text("Sign up")',
                '[data-testid="signup"]'
              ];
              let clicked = false;
              for (const sel of signupSelectors) {
                try {
                  await page.waitForSelector(sel, { timeout: 5000 });
                  await page.click(sel);
                  clicked = true;
                  console.log(`  ✅ Sign Up clicked (${sel})`);
                  break;
                } catch {}
              }
              if (!clicked) {
                // Try evaluating in-page
                clicked = await page.evaluate(() => {
                  const btn = Array.from(document.querySelectorAll('button')).find(b =>
                    ['sign up', 'sign-up'].includes(b.textContent.trim().toLowerCase())
                  );
                  if (btn) { btn.click(); return true; }
                  return false;
                });
                if (!clicked) throw new Error('Could not find Sign Up button on Stable Audio page.');
              }
              await sleep(3000);

              // ── Step 5: Wait for Auth0 email input ───────────────────────────────
              console.log('  📝 Step 5: Waiting for Auth0 registration form...');
              await page.waitForSelector('input[name="email"]', { timeout: 20000 });

              // ── Step 6: Fill email + password using React-compatible dispatch ────
              console.log('  ✍️  Step 6: Filling credentials...');
              await page.evaluate(({ em, pw }) => {
                const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
                const emailEl = document.querySelector('input[name="email"]');
                const passEl  = document.querySelector('input[name="password"]');
                if (emailEl) {
                  setter.call(emailEl, em);
                  emailEl.dispatchEvent(new Event('input',  { bubbles: true }));
                  emailEl.dispatchEvent(new Event('change', { bubbles: true }));
                }
                if (passEl) {
                  setter.call(passEl, pw);
                  passEl.dispatchEvent(new Event('input',  { bubbles: true }));
                  passEl.dispatchEvent(new Event('change', { bubbles: true }));
                }
              }, { em: email, pw: password });
              await sleep(800);

              // ── Step 7: Submit the form ───────────────────────────────────────────
              console.log('  🚀 Step 7: Submitting registration form...');
              await page.waitForSelector('button[type="submit"]', { timeout: 10000 });
              await page.click('button[type="submit"]');

              // ── Step 8: Wait for OAuth code exchange + extract token ──────────────
              // Auth0 redirects back to stableaudio.com/generate?code=...&state=...
              // The SPA POSTs to /oauth/token to exchange the code for a Bearer token.
              // We MUST NOT navigate away during this exchange — stay on callback URL!
              console.log('  ⏳ Step 8: Waiting for OAuth code exchange + token...');

              // 8a: Wait until we land on stableaudio.com
              if (!page.url().includes('stableaudio.com')) {
                try {
                  await page.waitForURL(url => url.includes('stableaudio.com'), { timeout: 60000 });
                  console.log(`  ✅ OAuth callback arrived: ${page.url()}`);
                } catch {
                  console.warn(`  ⚠️ Timeout waiting for redirect — on: ${page.url()}`);
                }
              } else {
                console.log(`  ✅ Already on stableaudio.com: ${page.url()}`);
              }

              // 8b: If URL has ?code= the SPA is exchanging it — wait for clean URL
              if (page.url().includes('code=')) {
                console.log('  🔄 OAuth code exchange in progress — waiting (do NOT navigate)...');
                try {
                  await page.waitForURL(
                    url => url.includes('stableaudio.com') && !url.includes('code='),
                    { timeout: 30000 }
                  );
                  console.log(`  ✅ Code exchanged! URL: ${page.url()}`);
                } catch {
                  console.warn('  ⚠️ Code cleanup timeout — token may already be in localStorage');
                }
              }
              await sleep(3000);

              // 8c: Poll for token (90s window, 3 strategies)
              console.log('  🔍 Step 8c: Polling for token...');
              const tokenDeadline = Date.now() + 90000;
              while (!capturedToken && Date.now() < tokenDeadline) {
                // Strategy 1: Deep localStorage scan
                const lsToken = await page.evaluate(() => {
                  for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (!key) continue;
                    try {
                      const parsed = JSON.parse(localStorage.getItem(key));
                      if (parsed?.body?.access_token) return parsed.body.access_token;
                      if (parsed?.access_token)       return parsed.access_token;
                      if (parsed?.idToken)             return parsed.idToken;
                    } catch {}
                  }
                  return null;
                }).catch(() => null);
                if (lsToken) { capturedToken = lsToken; break; }

                // Strategy 2: Fetch interceptor (sniff outgoing Authorization headers)
                const intercepted = await page.evaluate(() => {
                  if (window.__sniffedToken) return window.__sniffedToken;
                  if (!window.__fetchPatched) {
                    window.__fetchPatched = true;
                    const origFetch = window.fetch;
                    window.fetch = function(...args) {
                      const [, opts] = args;
                      const auth = opts?.headers?.Authorization || opts?.headers?.authorization || '';
                      if (auth.startsWith('Bearer ') && auth.length > 60)
                        window.__sniffedToken = auth.replace('Bearer ', '');
                      return origFetch.apply(this, args);
                    };
                  }
                  return null;
                }).catch(() => null);
                if (intercepted) { capturedToken = intercepted; break; }

                await sleep(1500);
              }

              if (!capturedToken) throw new Error('Token not captured within 90s after OAuth code exchange.');

              console.log('  ✅ NEW ACCOUNT CREATED SUCCESSFULLY');
              console.log(`  📧 ${email}`);
              console.log(`  🔑 Token: ${capturedToken.slice(0, 30)}...`);
              return capturedToken;

            } finally {
              await browser.close().catch(() => {});
            }
          }

          // ─── STABLE AUDIO API ──────────────────────────────────────────────────────
          // Live token — starts empty, set by auto-account-creation or from secret
          let currentToken = STABLE_AUDIO_TOKEN || null;

          async function generateStableAudio(prompt, lengthSeconds, isRetry = false) {
            const seed = Math.floor(Math.random() * 65536) - 32768;
            console.log(`  🎵 Calling Stable Audio API... (seed: ${seed})`);

            const res = await fetch(
              'https://api.stableaudio.com/v1alpha/generations/stable-audio-v2-5/text-to-music',
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${currentToken}`
                },
                body: JSON.stringify({
                  data: {
                    type: 'generations',
                    attributes: {
                      prompts: [{ text: prompt, weight: 1 }],
                      length_seconds: lengthSeconds,
                      seed
                    }
                  }
                })
              }
            );

            if (!res.ok) {
              const errText = await res.text();
              const errLower = errText.toLowerCase();
              const isLimitError = (
                res.status === 429 ||
                (res.status === 400 && (
                  errLower.includes('limit') || errLower.includes('quota') ||
                  errLower.includes('credit') || errLower.includes('rate') ||
                  errLower.includes('exceeded') || errLower.includes('insufficient')
                ))
              );

              if (isLimitError && !isRetry) {
                console.warn('\n  ⚠️ API limit hit! Auto-creating new Stable Audio account...');
                currentToken = await createStableAudioAccount();
                console.log('  🔄 Retrying prompt with new token...');
                return generateStableAudio(prompt, lengthSeconds, true); // retry once
              }
              if (isLimitError) throw new Error(`API_LIMIT_REACHED (auto-recovery also failed): ${errText.slice(0, 200)}`);
              throw new Error(`Stable Audio API error (${res.status}): ${errText.slice(0, 300)}`);
            }

            const data = await res.json();
            return { resultUrl: data.data[0].links.result, seed };
          }

          async function pollStableAudioResult(resultUrl) {
            const maxRetries = 60;
            for (let i = 0; i < maxRetries; i++) {
              process.stdout.write(`  ⏳ Polling result... attempt ${i + 1}/${maxRetries}\r`);
              const res = await fetch(resultUrl, {
                headers: { 'Authorization': `Bearer ${currentToken}`, 'Accept': '*/*' }
              });
              if (res.status === 200) {
                process.stdout.write('\n');
                console.log(`  ✅ Audio generation complete!`);
                return Buffer.from(await res.arrayBuffer());
              }
              if (res.status === 202) {
                await sleep(3000);
              } else {
                throw new Error(`Poll failed: HTTP ${res.status}`);
              }
            }
            throw new Error('Timed out waiting for audio generation (3 minutes).');
          }

          // ─── AUDIO AUTO-PROCESSING (via ffmpeg) ────────────────────────────────────
          // Trim silence + normalize + volume boost using ffmpeg.
          // Returns { buffer, stats } — stats are logged AND stored in Firebase so the panel/app can show
          // exactly what happened (previously nothing was recorded, so a skipped process looked identical
          // to a successful one).
          function ffRun(args, timeout = 60000) {
            try {
              return execSync(`"${FFMPEG.bin}" -hide_banner -nostats ${args}`, { timeout, stdio: ['ignore', 'pipe', 'pipe'] }).toString();
            } catch (e) {
              const stderrTail = e.stderr ? e.stderr.toString().trim().split('\n').slice(-5).join(' | ') : '';
              throw new Error(`ffmpeg failed: ${stderrTail || e.message}`);
            }
          }
          // Measure duration + peak/mean volume of a file (single ffmpeg pass with volumedetect)
          function ffMeasure(file) {
            // volumedetect prints to stderr; merge it into stdout (2>&1) and never let the shell fail the call
            const out = execSync(`"${FFMPEG.bin}" -hide_banner -nostats -i "${file}" -af volumedetect -f null - 2>&1 || true`,
              { timeout: 60000, stdio: ['ignore', 'pipe', 'ignore'] }).toString();
            if (!/max_volume/.test(out)) {
              throw new Error(`ffmpeg measure failed: ${out.trim().split('\n').slice(-3).join(' | ')}`);
            }
            const dur = /Duration:\s*(\d+):(\d+):([\d.]+)/.exec(out);
            const peak = /max_volume:\s*(-?[\d.]+)\s*dB/.exec(out);
            const mean = /mean_volume:\s*(-?[\d.]+)\s*dB/.exec(out);
            return {
              duration: dur ? (+dur[1]) * 3600 + (+dur[2]) * 60 + (+dur[3]) : null,
              peakDb: peak ? parseFloat(peak[1]) : null,
              meanDb: mean ? parseFloat(mean[1]) : null,
            };
          }

          async function autoProcessAudio(inputBuffer, gainFactor, silenceThreshold, padSec) {
            if (!FFMPEG) throw new Error('ffmpeg binary not available');
            const tmpDir    = '/tmp/ringtone_proc';
            fs.mkdirSync(tmpDir, { recursive: true });
            const stamp     = `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
            const tmpIn     = path.join(tmpDir, `in_${stamp}.mp3`);
            const tmpOut    = path.join(tmpDir, `out_${stamp}.mp3`);
            fs.writeFileSync(tmpIn, inputBuffer);

            const dbThreshold = 20 * Math.log10(silenceThreshold); // linear → dB (0.02 → -34dB)
            const dbStr = `${dbThreshold.toFixed(1)}dB`;

            try {
              // Pass 1: measure the raw file
              const before = ffMeasure(tmpIn);

              // Gain plan:
              //   • normalizeDb  → lift the peak to -1 dBFS (Stable Audio output is often very quiet, -15…-25 dB peaks;
              //                    a plain ×2 "boost" on such a file is barely audible — THAT is why boost felt like it did nothing)
              //   • boostDb      → the user's volume_boost_pct on top (200% = +6 dB), squashed by the limiter → louder/punchier
              const boostDb = 20 * Math.log10(Math.max(gainFactor, 0.01));
              const normalizeDb = before.peakDb == null ? 0 : Math.min(30, Math.max(0, -1.0 - before.peakDb));
              const totalGainDb = normalizeDb + boostDb;

              const filterChain = [
                // Trim leading silence, keep padSec of it as edge padding (detection=peak == linear amplitude threshold)
                `silenceremove=start_periods=1:start_threshold=${dbStr}:start_silence=${padSec}:detection=peak`,
                // Trim trailing silence (reverse → trim → reverse)
                `areverse`,
                `silenceremove=start_periods=1:start_threshold=${dbStr}:start_silence=${padSec}:detection=peak`,
                `areverse`,
                // Normalize + boost in one gain stage
                `volume=${totalGainDb.toFixed(2)}dB`,
                // Brick-wall limiter → no clipping/distortion at 200-400%
                `alimiter=limit=0.95:attack=5:release=50:level=false`
              ].join(',');

              ffRun(`-i "${tmpIn}" -af "${filterChain}" -ar 44100 -b:a 192k -y "${tmpOut}"`);

              if (!fs.existsSync(tmpOut) || fs.statSync(tmpOut).size < 1000) {
                throw new Error('ffmpeg output empty or too small (was the whole clip below the silence threshold?)');
              }

              // Pass 2: measure the result so we can PROVE the processing happened
              const after = ffMeasure(tmpOut);
              const outBuf = fs.readFileSync(tmpOut);
              const trimmed = (before.duration != null && after.duration != null) ? Math.max(0, before.duration - after.duration) : null;

              const stats = {
                durationBefore: before.duration != null ? +before.duration.toFixed(2) : null,
                durationAfter:  after.duration  != null ? +after.duration.toFixed(2)  : null,
                trimmedSec:     trimmed != null ? +trimmed.toFixed(2) : null,
                peakBeforeDb:   before.peakDb,
                peakAfterDb:    after.peakDb,
                meanBeforeDb:   before.meanDb,
                meanAfterDb:    after.meanDb,
                gainDb:         +totalGainDb.toFixed(2),
                normalizeDb:    +normalizeDb.toFixed(2),
                boostDb:        +boostDb.toFixed(2),
                boostPct:       Math.round(gainFactor * 100),
                silenceThreshold,
                padMs:          Math.round(padSec * 1000),
                ffmpeg:         FFMPEG.version,
              };
              console.log(`  🎛️  Processed: ${(inputBuffer.length / 1024).toFixed(0)}KB → ${(outBuf.length / 1024).toFixed(0)}KB | `
                + `${stats.durationBefore}s → ${stats.durationAfter}s (trimmed ${stats.trimmedSec}s) | `
                + `peak ${stats.peakBeforeDb}dB → ${stats.peakAfterDb}dB | gain +${stats.gainDb}dB (normalize ${stats.normalizeDb} + boost ${stats.boostDb})`);
              return { buffer: outBuf, stats };
            } finally {
              try { fs.unlinkSync(tmpIn); } catch {}
              try { fs.unlinkSync(tmpOut); } catch {}
            }
          }

          // ─── FIREBASE HELPERS ──────────────────────────────────────────────────────
          // Push to a single DB URL, returns the new Firebase key
          async function firebasePushToUrl(dbUrl, queuePath, data) {
            const res = await fetch(`${dbUrl}/${queuePath}.json`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
            if (!res.ok) {
              const err = await res.text();
              throw new Error(`Firebase push failed (${res.status}): ${err.slice(0, 200)}`);
            }
            const result = await res.json();
            return result.name;
          }

          // Push to ALL target DBs in parallel, returns array of { name, key }
          async function firebasePushAll(queuePath, data) {
            const results = await Promise.allSettled(
              TARGET_DB_URLS.map(async db => {
                const key = await firebasePushToUrl(db.url, queuePath, data);
                return { dbName: db.name, key };
              })
            );
            const pushed = [];
            for (const r of results) {
              if (r.status === 'fulfilled') pushed.push(r.value);
              else console.error(`  ⚠️ Push failed for one DB: ${r.reason?.message}`);
            }
            if (!pushed.length) throw new Error('All Firebase pushes failed!');
            return pushed;
          }

          // ─── R2 UPLOAD HELPER ─────────────────────────────────────────────────────
          // Uploads an audio Buffer to Cloudflare R2 via the worker and returns the public URL.
          async function uploadToR2(audioBuffer, fileName, dbName) {
            const cleanedName = fileName.replace(/[^a-zA-Z0-9._-]/g, '_');
            const destinationKey = `${String(dbName).replace(/^zedge_?/i, 'zedge')}/ringtone/${Date.now()}_${cleanedName}`; // v21.1: same folder layout as panel/app (zedgeN/ringtone/)
            let response;
            try {
              response = await fetch(R2_WORKER_URL, {
                method: 'POST',
                headers: {
                  'X-File-Name': destinationKey,
                  'X-File-Type': 'audio/mpeg'
                },
                body: audioBuffer
              });
            } catch (networkErr) {
              throw new Error(`Network error reaching R2 worker: ${networkErr.message}`);
            }
            if (!response.ok) {
              let body = '';
              try { body = await response.text(); } catch (_) {}
              throw new Error(`R2 upload failed (HTTP ${response.status}): ${body || response.statusText}`);
            }
            let data;
            try { data = await response.json(); } catch (e) {
              throw new Error(`R2 worker returned invalid JSON: ${e.message}`);
            }
            if (!data.url) throw new Error(`R2 worker response missing 'url' field: ${JSON.stringify(data)}`);
            return data.url;
          }

          // ─── UTILITY ──────────────────────────────────────────────────────────────
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          function generateFilename(title, dbName) {
            // Each account has its own distinct file-naming personality

            if (dbName === 'zedge_1') {
              // ── zedge_1: pure keyboard smash (looks like a lazy human) ──
              const smashes = [
                'asdf', 'asdfg', 'asdfgh', 'qwerty', 'qweqwe', 'zxczxc',
                'hjkl', 'lkjh', 'poiu', 'asdasd', 'qwer', 'zxcv', 'asdfghjkl',
                'test', 'new', 'audio', 'untitled', 'file', 'rec', 'my',
              ];
              let name = '';
              if (Math.random() > 0.4) {
                name = smashes[Math.floor(Math.random() * smashes.length)];
                if (Math.random() > 0.5) name += Math.floor(Math.random() * 999);
              } else {
                const pool = 'asdfghjklasdfghjklqwertyuiopzxcvbnm';
                const len = Math.floor(Math.random() * 6) + 4;
                for (let i = 0; i < len; i++) name += pool[Math.floor(Math.random() * pool.length)];
              }
              return `${name}.mp3`;

            } else if (dbName === 'zedge_2') {
              // ── zedge_2: human-style descriptive lowercase, like someone saving a file normally ──
              const prefixes = ['my', 'cool', 'new', 'best', 'fav', 'top', 'great', 'nice', 'saved', 'ringtone', 'tone', 'sound', 'audio'];
              const midWords = ['ring', 'tone', 'beat', 'track', 'song', 'clip', 'tune', 'sound', 'mix', 'edit'];
              const suffixes = ['v1', 'v2', 'final', 'new', 'copy', 'edit', 'backup', '2', '3', '1', 'hd'];
              const roll = Math.random();
              let name = '';
              if (roll < 0.33) {
                // e.g. myringtone, coolbeat, favtone
                name = prefixes[Math.floor(Math.random() * prefixes.length)] + midWords[Math.floor(Math.random() * midWords.length)];
              } else if (roll < 0.66) {
                // e.g. ringtone_final, beat_v2, sound_copy
                name = midWords[Math.floor(Math.random() * midWords.length)] + '_' + suffixes[Math.floor(Math.random() * suffixes.length)];
              } else {
                // e.g. my_cool_tone, new_beat_1
                name = prefixes[Math.floor(Math.random() * prefixes.length)] + '_' + midWords[Math.floor(Math.random() * midWords.length)];
                if (Math.random() > 0.5) name += '_' + suffixes[Math.floor(Math.random() * suffixes.length)];
              }
              return `${name}.mp3`;

            } else if (dbName === 'zedge_3') {
              // ── zedge_3: numeric / timestamp style — like auto-saved recordings ──
              const styles = [
                () => `recording_${Date.now()}`,
                () => `audio_${Math.floor(Math.random() * 90000) + 10000}`,
                () => `track_${String(Math.floor(Math.random() * 9999)).padStart(4, '0')}`,
                () => `file${Math.floor(Math.random() * 999)}`,
                () => { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${Math.floor(Math.random()*9999)}`; },
                () => `rec_${Math.floor(Math.random() * 9999)}`,
                () => `mix${Math.floor(Math.random() * 999)}_final`,
              ];
              const fn = styles[Math.floor(Math.random() * styles.length)];
              return `${fn()}.mp3`;

            } else if (dbName === 'zedge_4') {
              // ── zedge_4: "downloaded / shared file" style — Title-Case words, dashes, like files saved from apps ──
              const words = ['Ringtone', 'Tone', 'Sound', 'Alarm', 'Notification', 'Message', 'Melody', 'Beat', 'Loop', 'Alert', 'Chime', 'Ring'];
              const tags = ['Download', 'Free', 'HD', 'New', 'Best', 'Top', 'Original', 'Remix', 'Short', 'Clean'];
              const apps = ['WhatsApp-Audio', 'Telegram-Audio', 'Voice-Memo', 'Audio-Clip', 'Sound-Clip'];
              const roll = Math.random();
              let name = '';
              if (roll < 0.35) {
                // e.g. Ringtone-Download-23, Alarm-HD-7
                name = words[Math.floor(Math.random() * words.length)] + '-' + tags[Math.floor(Math.random() * tags.length)] + '-' + (Math.floor(Math.random() * 99) + 1);
              } else if (roll < 0.7) {
                // e.g. WhatsApp-Audio-2025-03-14, Voice-Memo-0042
                const d = new Date();
                const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                name = apps[Math.floor(Math.random() * apps.length)] + '-' + (Math.random() > 0.5 ? dateStr : String(Math.floor(Math.random() * 9999)).padStart(4, '0'));
              } else {
                // e.g. New-Tone, Best-Melody-Remix
                name = tags[Math.floor(Math.random() * tags.length)] + '-' + words[Math.floor(Math.random() * words.length)];
                if (Math.random() > 0.5) name += '-' + tags[Math.floor(Math.random() * tags.length)];
              }
              return `${name}.mp3`;

            } else {
              // fallback: keyboard smash
              const pool = 'asdfghjklqwertyuiop';
              let name = '';
              for (let i = 0; i < 6; i++) name += pool[Math.floor(Math.random() * pool.length)];
              return `${name}.mp3`;
            }
          }

          // ─── GENERATE ONE UNIQUE RINGTONE FOR A SINGLE DB ─────────────────────────
          // Used by both single-account and all_accounts modes.
          // Each call produces a fresh audio (new seed) + fresh metadata → unique upload.
          async function generateAndPushOne(prompt, dbTarget) {
            // Step A: Unique metadata per account (Gemini re-called each time)
            // Zedge policy: the user-supplied idea itself must be clean (no artists/characters/brands).
            if (prompt) { const pi = zedgePolicyIssues({ title: prompt }); if (pi.length) throw new Error(`Zedge policy: idea prompt blocked — ${pi.join('; ')} (nothing generated)`); }
            let meta = null;
            for (let attempt = 1; attempt <= 3 && !meta; attempt++) {
              let candidate;
              try { candidate = await generateMetadataFromPrompt(prompt); }
              catch (e) { console.warn(`  ⚠️ [${dbTarget.name}] Metadata attempt ${attempt}/3 failed: ${e.message}`); continue; }
              const check = zedgeEnforce(candidate, 'audio');
              if (check.issues.length) { console.warn(`  🚫 [${dbTarget.name}] Zedge policy (attempt ${attempt}/3): ${check.issues.join('; ')} — regenerating`); continue; }
              meta = check.meta;
            }
            if (!meta) throw new Error('Zedge policy: no compliant metadata after 3 attempts — item skipped, nothing uploaded');
            console.log(`  📝 [${dbTarget.name}] Title: "${meta.title}"`);
            console.log(`  🏷️  [${dbTarget.name}] Tags: ${meta.tags}  ✅ policy-checked`);

            // Step B: Generate unique audio (each call gets a random seed → different sound)
            const { resultUrl, seed } = await generateStableAudio(meta.enhancedPrompt, LENGTH_SECONDS);
            console.log(`  🎼 [${dbTarget.name}] Audio prompt sent to Stable Audio: "${meta.enhancedPrompt}"`);
            let audioBuffer = await pollStableAudioResult(resultUrl);

            // Step C: Optional auto-processing (silence trim + normalize + volume boost)
            let processed = false;
            let processing = null;
            let processError = null;
            if (AUTO_PROCESS) {
              try {
                const r = await autoProcessAudio(audioBuffer, VOLUME_BOOST, SILENCE_THRESHOLD, PAD_SEC);
                audioBuffer = r.buffer;
                processing = r.stats;
                processed = true;
                audioStats.processed++;
                if (r.stats.trimmedSec) audioStats.trimmedSec += r.stats.trimmedSec;
              } catch (e) {
                processError = e.message;
                audioStats.failed++;
                if (audioStats.reasons.length < 10) audioStats.reasons.push(`[${dbTarget.name}] ${e.message.slice(0, 160)}`);
                // Loud, unmissable warning — the RAW file will be uploaded, and the item is flagged processed:false
                console.error(`  ❌ [${dbTarget.name}] AUTO-PROCESS FAILED → uploading RAW audio (no trim / no boost): ${e.message}`);
              }
            }

            // Step D: Upload audio to R2, then push metadata + fileUrl to Firebase
            const fileName = generateFilename(meta.title, dbTarget.name);
            console.log(`  ☁️  [${dbTarget.name}] Uploading "${fileName}" to R2 (${(audioBuffer.length / 1024).toFixed(0)}KB)...`);
            const fileUrl = await uploadToR2(audioBuffer, fileName, dbTarget.name);
            console.log(`  ✅ [${dbTarget.name}] R2 upload complete: ${fileUrl}`);

            const key = await firebasePushToUrl(dbTarget.url, QUEUE_PATH, {
              name: fileName,
              type: 'audio/mpeg',
              size: audioBuffer.length,
              width: null,
              height: null,
              isMp3: true,
              contentType: 'RINGTONE',
              fileUrl,
              title: meta.title,
              tags: meta.tags,
              category: meta.category,
              description: meta.description,
              policyCheck: 'passed',
              policyCheckedAt: Date.now(),
              status: 'queued',
              prompt: prompt || meta.enhancedPrompt,   // v27.10: what the audio model was really asked (shown as "Generation prompt" in panel/app/desktop)
              enhancedPrompt: meta.enhancedPrompt,
              audioSeed: seed,
              audioModel: 'stable-audio-v2-5',
              // Audio processing audit trail (visible in panel/app item details)
              autoProcess: AUTO_PROCESS,
              processed,
              processing,
              processError,
              createdAt: Date.now()
            });
            console.log(`  ✅ [${dbTarget.name}] Firebase key: ${key}  🎵 "${meta.title}"${AUTO_PROCESS ? (processed ? '  🎛️ processed' : '  ⚠️ RAW (unprocessed)') : ''}`);
            return { dbName: dbTarget.name, key, title: meta.title, category: meta.category, processed };
          }

          // ─── PROCESS A SINGLE PROMPT ───────────────────────────────────────────────
          async function processPrompt(idx, prompt) {
            const num = `[${idx + 1}/${AUTO_GENERATE_COUNT}]`;
            console.log(`\n${num} ─────────────────────────────────────────────`);
            if (prompt) console.log(`${num} Prompt: "${prompt}"`);
            else console.log(`${num} Auto-Generating Random Ringtone...`);
            console.log(`${num} ─────────────────────────────────────────────`);

            if (TARGET_DB_URLS.length === 1) {
              // ── Single account: 1 audio → 1 DB ─────────────────────────────────────
              const result = await generateAndPushOne(prompt, TARGET_DB_URLS[0]);
              return { keys: [result], title: result.title, category: result.category };

            } else {
              // ── all_accounts: generate a UNIQUE audio per account (NOT the same file!) ──
              // Each account gets a different seed → different sound → safe from duplicate detection
              console.log(`  🔀 all_accounts mode: generating ${TARGET_DB_URLS.length} UNIQUE audios (one per account)...`);
              const pushResults = [];
              for (const dbTarget of TARGET_DB_URLS) {
                console.log(`\n  ➡️  Generating unique ringtone for [${dbTarget.name}]...`);
                try {
                  const result = await generateAndPushOne(prompt, dbTarget);
                  pushResults.push(result);
                } catch (e) {
                  console.error(`  ❌ [${dbTarget.name}] Failed: ${e.message}`);
                }
                // Small delay between accounts to avoid API burst
                if (TARGET_DB_URLS.indexOf(dbTarget) < TARGET_DB_URLS.length - 1) {
                  await sleep(3000);
                }
              }
              if (!pushResults.length) throw new Error('All account pushes failed.');
              return { keys: pushResults, title: pushResults[0].title, category: pushResults[0].category };
            }
          }


          // ─── STARTUP: AUTO-CREATE ACCOUNT IF NO TOKEN PROVIDED ─────────────────────
          if (!currentToken) {
            console.log('\n⚠️  No STABLE_AUDIO_TOKEN provided — auto-creating Stable Audio account...');
            try {
              currentToken = await createStableAudioAccount();
              console.log('✅ Startup account creation successful. Starting generation...');
            } catch (startupErr) {
              console.error(`❌ Startup account creation FAILED: ${startupErr.message}`);
              console.error('   Cannot proceed without a valid token.');
              process.exit(1);
            }
          } else {
            console.log('✅ Using provided STABLE_AUDIO_TOKEN.');
          }

          // Initialize Gemini Shared Browser
          try {
            await initGemini();
          } catch (geminiErr) {
            console.error(`❌ Failed to initialize Gemini browser: ${geminiErr.message}`);
            process.exit(1);
          }

          // ─── MAIN LOOP ─────────────────────────────────────────────────────────────
          let successCount = 0;
          let failedCount = 0;
          const results = [];

          if (AUTO_GENERATE_COUNT === 0) {
            console.log('✅ AUTO_GENERATE_COUNT is 0. Nothing to do.');
            process.exit(0);
          }

          for (let i = 0; i < AUTO_GENERATE_COUNT; i++) {
            try {
              const result = await processPrompt(i, null);
              results.push({ status: 'success', ...result, prompt: 'Auto-Generated' });
              successCount++;
            } catch (err) {
              console.error(`\n❌ Prompt ${i + 1} FAILED: ${err.message}`);
              results.push({ status: 'failed', prompt: 'Auto-Generated', error: err.message });
              failedCount++;

              // If API limit is hit, abort remaining prompts
              if (err.message.startsWith('API_LIMIT_REACHED')) {
                console.error('\n🛑 Aborting: Stable Audio API credits exhausted.');
                console.error('   Update STABLE_AUDIO_TOKEN secret with a fresh token and re-run.');
                for (let j = i + 1; j < AUTO_GENERATE_COUNT; j++) {
                  results.push({ status: 'skipped', prompt: 'Auto-Generated' });
                }
                break;
              }

              // Small delay before retrying next prompt
              if (i < AUTO_GENERATE_COUNT - 1) {
                console.log('  ⏳ Waiting 5s before next prompt...');
                await sleep(5000);
              }
            }
          }

          // ─── SHUTDOWN ─────────────────────────────────────────────────────────────
          if (geminiBrowser) {
            console.log('🌐 Closing Gemini Shared Browser...');
            await geminiBrowser.close().catch(() => {});
          }

          // ─── SUMMARY ──────────────────────────────────────────────────────────────
          const skippedCount = results.filter(r => r.status === 'skipped').length;
          console.log('\n============================================================');
          console.log('  🏁  GENERATION COMPLETE');
          console.log('============================================================');
          console.log(`✅ Success : ${successCount}/${AUTO_GENERATE_COUNT}`);
          console.log(`❌ Failed  : ${failedCount}/${AUTO_GENERATE_COUNT}`);
          console.log(`⏭️  Skipped : ${skippedCount}/${AUTO_GENERATE_COUNT}`);
          console.log('');
          console.log('📋 Results:');
          results.forEach((r, i) => {
            const icon = r.status === 'success' ? '✅' : r.status === 'failed' ? '❌' : '⏭️';
            const detail = r.status === 'success'
              ? `"${r.title}" [${r.category}] → ${r.keys?.map(k => `${k.dbName}:${k.key}`).join(', ')}`
              : r.status === 'failed'
              ? `FAILED: ${r.error?.slice(0, 80)}`
              : 'SKIPPED';
            console.log(`  ${icon} [${i + 1}] "${r.prompt?.slice(0, 40)}" → ${detail}`);
          });
          if (AUTO_PROCESS) {
            console.log('');
            console.log(`🎛️  Audio processing: ${audioStats.processed} processed, ${audioStats.failed} RAW (failed), ${audioStats.trimmedSec.toFixed(1)}s silence trimmed in total`);
            audioStats.reasons.forEach(r => console.log(`     ⚠️ ${r}`));
          }
          console.log('============================================================');

          // Markdown for the GitHub step summary
          try {
            const md = [];
            md.push(`| Result | Count |`, `|---|---|`);
            md.push(`| ✅ Generated | ${successCount}/${AUTO_GENERATE_COUNT} |`);
            md.push(`| ❌ Failed | ${failedCount}/${AUTO_GENERATE_COUNT} |`);
            md.push(`| ⏭️ Skipped | ${skippedCount}/${AUTO_GENERATE_COUNT} |`);
            if (AUTO_PROCESS) {
              md.push(`| 🎛️ Audio processed (trim + boost) | ${audioStats.processed} |`);
              md.push(`| ⚠️ Uploaded RAW (processing failed) | ${audioStats.failed} |`);
              md.push(`| ✂️ Silence trimmed (total) | ${audioStats.trimmedSec.toFixed(1)}s |`);
              md.push(`| 🎬 ffmpeg | ${FFMPEG ? FFMPEG.version : 'not found'} |`);
            }
            if (audioStats.reasons.length) {
              md.push('', '**Processing failures:**', '');
              audioStats.reasons.forEach(r => md.push(`- ${r.replace(/\|/g, '\\|')}`));
            }
            fs.writeFileSync('/tmp/generator_summary.md', md.join('\n') + '\n');
          } catch {}

          if (failedCount === AUTO_GENERATE_COUNT) {
            process.exit(1);
          }
          SCRIPT_EOF
          node --experimental-vm-modules generator.mjs

      - name: 📊 Upload Run Summary
        if: always()
        run: |
          echo "## ☁️ Bulk Ringtone Generator Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Prompts | See workflow input |" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${{ github.event.inputs.length_seconds }}s per ringtone |" >> $GITHUB_STEP_SUMMARY
          echo "| Auto-process | ${{ github.event.inputs.auto_process }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Volume Boost | ${{ github.event.inputs.volume_boost_pct }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Account | ${{ github.event.inputs.target_account }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/generator_summary.md ]; then
            echo "### 🎛️ Generation & audio processing" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat /tmp/generator_summary.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "> Ringtones pushed to Firebase with status **queued** — Zedge bot will pick them up on next run." >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # 🖼️ IMAGE METADATA  +  🎨 IMAGE STUDIO (mode = image_studio)
  #    mode=metadata     → scan all DBs, write Gemini-Web metadata (unchanged behaviour).
  #    mode=image_studio → bulk prompts → Cloudinary image generation → 1620×2880 JPGs
  #                        → R2 + Firebase distribution, driven from a control panel that is
  #                        exposed through a Cloudflare quick tunnel (trycloudflare.com).
  #                        Metadata order = SAME as the ringtone job: as soon as a set / image
  #                        is rendered, the SAME image_metadata.mjs (Gemini Web, local-jobs
  #                        mode, one browser for the whole session) writes title / tags /
  #                        category / description + Zedge policy verdict; ONLY THEN the record
  #                        is pushed to Firebase WITH that metadata (status queued, or
  #                        status failed + policyCheck held when flagged). The Zedge bot never
  #                        sees a "metadata missing" record. A final Firebase-scan pass still
  #                        runs after the session as a safety net.
  #    🔒 One image / set → ONE Zedge account only (no all_accounts, item lock, SHA-256 file
  #       ledger, no frame regeneration after distribution) — duplicate content across
  #       accounts gets Zedge accounts suspended. To feed all accounts from one batch use
  #       target "spread": item 1 → zedge_1, item 2 → zedge_2, … (least-loaded first), so
  #       every account gets DIFFERENT files. target_account=all_accounts falls back to
  #       zedge_2 in the studio; ringtone/metadata modes are unchanged.
  #    If your power/internet drops, the runner keeps generating; reopen the same link.
  # ═══════════════════════════════════════════════════════════════════════════
  generate-image-metadata:
    if: github.event.inputs.mode == 'metadata' || github.event.inputs.mode == 'image_studio'
    name: ${{ github.event.inputs.mode == 'image_studio' && '🎨 Image Studio → tunnel panel → R2 + Firebase + Gemini metadata' || '🖼️ Generate Image Metadata → Firebase' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Install Dependencies
        run: |
          npm init -y
          npm install node-fetch@3 playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install chromium --with-deps

      - name: 🖥️ Start Virtual Display (Xvfb)
        run: |
          sudo apt-get install -y xvfb ffmpeg
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "✅ Xvfb virtual display started on :99"

      - name: 📝 Write Gemini-Web metadata script (image_metadata.mjs)
        run: |
          cat > image_metadata.mjs << 'IMGMETA_EOF'
          import fetch from 'node-fetch';
          import fs from 'fs';
          import path from 'path';
          import os from 'os';
          import { execSync } from 'child_process';

          // ─── CONFIG ────────────────────────────────────────────────────────────────
          const GEMINI_SESSION_RAW = (process.env.GEMINI_SESSION_INPUT?.trim() || process.env.GEMINI_SESSION || '').trim();
          const TARGET_ACCOUNT     = 'all_accounts'; // Always scan all DBs automatically
          const IMAGE_QUEUE_PATH   = (process.env.IMAGE_QUEUE_PATH || 'wallpaperQueue').trim();
          // No count cap — we always process ALL images missing metadata automatically.

          // ─── CONTENT KINDS: plain wallpapers, wallpaper sets, and video content ───
          const SET_KINDS = {
            WALLPAPER_24H:     { label: '24H Wallpaper Set',     slots: ['morning', 'afternoon', 'evening', 'night'] },
            WALLPAPER_DUAL:    { label: 'Dual Wallpaper Set',    slots: ['lock', 'home'] },
            WALLPAPER_BATTERY: { label: 'Battery Wallpaper Set', slots: ['critical', 'low', 'mid', 'high', 'full', 'charging'] }
          };
          const VIDEO_KINDS = {
            LIVE_WALLPAPER:     { label: 'Live Wallpaper (video)' },
            CHARGING_ANIMATION: { label: 'Charging Animation (video)' }
          };
          const KIND_PROMPT_CONTEXT = {
            WALLPAPER: `I have attached a phone wallpaper image.`,
            WALLPAPER_24H: `I have attached ONE image from a 24H WALLPAPER SET - 4 wallpapers of the same scene that automatically change through the day (morning, afternoon, evening, night). Write metadata for the WHOLE day-cycle set, not just this single frame.`,
            WALLPAPER_DUAL: `I have attached ONE image from a DUAL WALLPAPER SET - a matching lock screen + home screen wallpaper pair. Write metadata that fits the matching pair.`,
            WALLPAPER_BATTERY: `I have attached ONE image from a BATTERY WALLPAPER SET - artwork that changes with the phone battery level (critical, low, mid, high, full, charging). Write metadata that fits the whole battery pack.`,
            LIVE_WALLPAPER: `I have attached a FRAME extracted from a LIVE WALLPAPER VIDEO (an animated phone wallpaper). Write metadata for the animated live wallpaper.`,
            CHARGING_ANIMATION: `I have attached a FRAME extracted from a phone CHARGING ANIMATION VIDEO (an animation that plays while the phone is charging). Write metadata that fits a charging screen animation.`
          };
          function getRecordKind(record) {
            const ct = String(record.contentType || '').toUpperCase().trim();
            if (SET_KINDS[ct] || VIDEO_KINDS[ct]) return ct;
            if (typeof record.type === 'string' && record.type.startsWith('video/')) return 'LIVE_WALLPAPER';
            return 'WALLPAPER';
          }
          function kindLabel(kind) {
            return (SET_KINDS[kind] || VIDEO_KINDS[kind] || {}).label || 'Wallpaper';
          }
          function slotUrlValue(v) {
            return typeof v === 'string' ? v : ((v && v.fileUrl) || '');
          }
          function firstSlotUrl(record, kind) {
            const meta = SET_KINDS[kind];
            if (!meta || !record.files) return '';
            for (const s of meta.slots) {
              const u = slotUrlValue(record.files[s]);
              if (u) return u;
            }
            return '';
          }

          // ─── PARSE GEMINI SESSION ──────────────────────────────────────────────────
          if (!GEMINI_SESSION_RAW) {
            console.error('❌ Error: GEMINI_SESSION secret or input is missing.');
            process.exit(1);
          }

          // ─── COOKIE NORMALIZER ────────────────────────────────────────────────────
          // Converts browser-extension cookie objects (EditThisCookie, Cookie-Editor, etc.)
          // into Playwright storageState-compatible cookie objects.
          //
          // Key field differences:
          //   expirationDate (float)  → expires (int, -1 = session)
          //   sameSite "no_restriction" → "None"
          //   sameSite null/undefined  → "None"
          //   sameSite "lax"           → "Lax"
          //   sameSite "strict"        → "Strict"
          //   hostOnly, storeId, session → stripped (not used by Playwright)
          function normalizeCookies(rawCookies) {
            return rawCookies.map(c => {
              // sameSite mapping
              let sameSite = 'None';
              if (c.sameSite) {
                const ss = c.sameSite.toLowerCase();
                if (ss === 'lax')                               sameSite = 'Lax';
                else if (ss === 'strict')                       sameSite = 'Strict';
                else if (ss === 'none' || ss === 'no_restriction') sameSite = 'None';
              }
              // expires: Playwright uses integer seconds, -1 means session cookie
              const expires = c.expires   !== undefined ? Math.floor(c.expires) :
                              c.expirationDate !== undefined ? Math.floor(c.expirationDate) :
                              -1;
              return {
                name:     c.name,
                value:    c.value,
                domain:   c.domain,
                path:     c.path || '/',
                expires,
                httpOnly: !!c.httpOnly,
                secure:   !!c.secure,
                sameSite,
              };
            });
          }

          // ─── NORMALIZE SESSION FORMAT ─────────────────────────────────────────────
          // The GEMINI_SESSION may arrive in several formats:
          //   1. Playwright storageState:  { cookies: [...], origins: [...] }
          //   2. Raw cookie array:         [{ name, value, domain, ... }, ...]
          //   3. Wrapped/nested formats:   { cookies: [...], ... } with extra keys
          // We normalize all of them into a valid Playwright storageState object.
          let GEMINI_STORAGE_STATE = null;
          try {
            const parsed = JSON.parse(GEMINI_SESSION_RAW);
            console.log(`📋 Parsed session JSON top-level type: ${Array.isArray(parsed) ? 'array' : typeof parsed}`);
            if (typeof parsed === 'object' && parsed !== null && !Array.isArray(parsed)) {
              console.log(`📋 Top-level keys: ${Object.keys(parsed).slice(0, 10).join(', ')}`);
            }

            // Format 1: Already a Playwright storageState with cookies array
            if (parsed && typeof parsed === 'object' && !Array.isArray(parsed) && Array.isArray(parsed.cookies)) {
              GEMINI_STORAGE_STATE = {
                cookies: normalizeCookies(parsed.cookies),
                origins: Array.isArray(parsed.origins) ? parsed.origins : []
              };
              console.log('🔄 Detected format: Playwright storageState object');

            // Format 2: Raw array of cookie objects (browser extension export)
            } else if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].name !== undefined) {
              GEMINI_STORAGE_STATE = { cookies: normalizeCookies(parsed), origins: [] };
              console.log('🔄 Detected format: Raw cookie array (browser extension) — normalizing fields');

            // Format 3: Object but cookies nested under alternate key
            } else if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
              const altKeys = ['cookie', 'Cookie', 'cookieList', 'cookieJar', 'session'];
              let found = null;
              for (const k of altKeys) {
                if (Array.isArray(parsed[k]) && parsed[k].length > 0) { found = parsed[k]; break; }
              }
              if (!found) {
                for (const val of Object.values(parsed)) {
                  if (val && typeof val === 'object' && Array.isArray(val.cookies) && val.cookies.length > 0) {
                    found = val.cookies;
                    break;
                  }
                }
              }
              if (found) {
                GEMINI_STORAGE_STATE = { cookies: normalizeCookies(found), origins: [] };
                console.log('🔄 Detected format: Nested/alternate key — extracted and normalized cookies');
              }
            }

            if (!GEMINI_STORAGE_STATE || !Array.isArray(GEMINI_STORAGE_STATE.cookies) || GEMINI_STORAGE_STATE.cookies.length === 0) {
              console.error('❌ Error: Could not find any cookies in GEMINI_SESSION JSON.');
              console.error('   Expected one of these formats:');
              console.error('     1. Playwright storageState: {"cookies":[...],"origins":[...]}');
              console.error('     2. Browser extension array: [{"name":"...","value":"...","domain":"..."}]');
              console.error('   Please re-export the session from your browser.');
              process.exit(1);
            }

            const googleCookies = GEMINI_STORAGE_STATE.cookies.filter(c =>
              c.domain && (c.domain.includes('google.com') || c.domain.includes('gemini.google.com'))
            );
            console.log(`🌐 Gemini Web Session loaded: ${GEMINI_STORAGE_STATE.cookies.length} total cookies, ${googleCookies.length} google.com cookies.`);
            // Log key auth cookies to confirm they're present
            const keyNames = ['SID', 'SSID', 'APISID', 'SAPISID', '__Secure-1PSID', '__Secure-3PSID'];
            const foundKeys = GEMINI_STORAGE_STATE.cookies.filter(c => keyNames.includes(c.name)).map(c => c.name);
            console.log(`🔑 Key auth cookies found: ${foundKeys.join(', ') || 'NONE — session may fail!'}`);
            if (googleCookies.length === 0) {
              console.warn('⚠️  Warning: No google.com cookies found — session may not restore correctly.');
            }

          } catch (e) {
            console.error('❌ Error: GEMINI_SESSION is not valid JSON:', e.message);
            process.exit(1);
          }

          // Write storageState to a temp file — passing an object directly to
          // newContext() can silently drop localStorage; writing to disk is reliable.
          const STORAGE_STATE_FILE = path.join(os.tmpdir(), 'gemini_storage_state.json');
          fs.writeFileSync(STORAGE_STATE_FILE, JSON.stringify(GEMINI_STORAGE_STATE, null, 2));
          console.log(`💾 StorageState written to: ${STORAGE_STATE_FILE}`);
          console.log(`   Cookies: ${GEMINI_STORAGE_STATE.cookies.length}, Origins: ${GEMINI_STORAGE_STATE.origins.length}`);

          // ─── FIREBASE DB ROUTING ──────────────────────────────────────────────────
          const FIREBASE_DB_MAP = {
            zedge_1: 'https://zedge-1-default-rtdb.firebaseio.com',
            zedge_2: 'https://zedge2-34d95-default-rtdb.firebaseio.com',
            zedge_3: 'https://zedge3-1b3dc-default-rtdb.firebaseio.com'
          };

          let TARGET_DB_URLS;
          if (TARGET_ACCOUNT === 'all_accounts' || TARGET_ACCOUNT === 'all_four' || TARGET_ACCOUNT === 'all_three') {
            TARGET_DB_URLS = Object.entries(FIREBASE_DB_MAP).map(([name, url]) => ({ name, url }));
          } else if (FIREBASE_DB_MAP[TARGET_ACCOUNT]) {
            TARGET_DB_URLS = [{ name: TARGET_ACCOUNT, url: FIREBASE_DB_MAP[TARGET_ACCOUNT] }];
          } else {
            console.error(`❌ Unknown target_account: "${TARGET_ACCOUNT}".`);
            process.exit(1);
          }

          // ─── UTILITY ──────────────────────────────────────────────────────────────
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          // ─── VALID IMAGE CATEGORIES ────────────────────────────────────────────────
          const VALID_IMG_CATS = [
            'ANIMALS', 'ANIME', 'CARS_N_VEHICLES', 'COMICS', 'DESIGNS',
            'DRAWINGS', 'ENTERTAINMENT', 'FUNNY', 'GAMES', 'HOLIDAYS',
            'LOVE', 'MUSIC', 'NATURE', 'OTHER', 'PATTERNS',
            'PEOPLE', 'SAYINGS', 'SPACE', 'SPIRITUAL', 'SPORTS',
            'TECHNOLOGY'
          ];

          // ─── RESPONSE CLEANERS ─────────────────────────────────────────────────────
          function cleanTitle(raw) {
            if (!raw) return '';
            raw = raw.replace(/^(here is a title:|title:|the title is:|suggested title:)/i, '').trim();
            const quoteMatch = raw.match(/"([^"\r\n]{3,60})"/);
            if (quoteMatch) return quoteMatch[1].trim();
            const boldMatch = raw.match(/\*\*([^\*\r\n]{3,60})\*\*/);
            if (boldMatch) return boldMatch[1].trim();
            const lines = raw.split('\n')
              .map(l => l.trim())
              .filter(l => {
                const lower = l.toLowerCase();
                return l.length > 0 &&
                       !lower.startsWith('here') &&
                       !lower.startsWith('sure') &&
                       !lower.startsWith('based') &&
                       !lower.startsWith('suggest') &&
                       !lower.startsWith('the') &&
                       !lower.startsWith('this');
              });
            if (lines.length > 0) {
              return lines[0].replace(/^["'*\s]+|["'*\s]+$/g, '').trim().slice(0, 30);
            }
            return raw.replace(/^["'*\s]+|["'*\s]+$/g, '').slice(0, 30).trim();
          }

          function cleanKeywords(raw) {
            if (!raw) return '';
            const words = raw.match(/[a-zA-Z0-9]{2,20}/g) || [];
            const stopWords = new Set(['here', 'are', 'the', 'keywords', 'based', 'on', 'this', 'image', 'and', 'for', 'with', 'your', 'wallpaper', 'title', 'tags', 'single', 'word']);
            const uniqueWords = [...new Set(
              words
                .map(w => w.trim())
                .filter(w => {
                  const lower = w.toLowerCase();
                  return w.length > 1 && !stopWords.has(lower);
                })
            )];
            return uniqueWords.slice(0, 10).join(', ');
          }

          function cleanCategory(raw) {
            if (!raw) return 'OTHER';
            const upper = raw.toUpperCase().replace(/[^A-Z0-9_\s]/g, ' ');

            // Alias map: words/phrases Gemini might use → exact Zedge category value
            const ALIAS_MAP = [
              { cat: 'ANIMALS',        aliases: ['ANIMAL', 'ANIMALS', 'WILDLIFE', 'PET', 'PETS', 'BIRD', 'BIRDS', 'CAT', 'DOG'] },
              { cat: 'ANIME',          aliases: ['ANIME', 'MANGA', 'ANIMATION', 'ANIMATED'] },
              { cat: 'CARS_N_VEHICLES',aliases: ['CAR', 'CARS', 'VEHICLE', 'VEHICLES', 'AUTOMOTIVE', 'AUTO', 'TRUCK', 'MOTORCYCLE', 'BIKE', 'TRANSPORT', 'CARS N VEHICLES', 'CARS AND VEHICLES'] },
              { cat: 'COMICS',         aliases: ['COMIC', 'COMICS', 'SUPERHERO', 'CARTOON', 'CARTOONS', 'ILLUSTRATION'] },
              { cat: 'DESIGNS',        aliases: ['DESIGN', 'DESIGNS', 'GRAPHIC', 'ABSTRACT', 'ART', 'ARTISTIC', 'PATTERN ART', 'GEOMETRIC'] },
              { cat: 'DRAWINGS',       aliases: ['DRAWING', 'DRAWINGS', 'SKETCH', 'SKETCHES', 'HAND DRAWN', 'PENCIL', 'INK'] },
              { cat: 'ENTERTAINMENT',  aliases: ['ENTERTAINMENT', 'MOVIE', 'MOVIES', 'FILM', 'TV', 'CELEBRITY', 'CELEBRITIES', 'ACTOR', 'ACTRESS', 'SHOW'] },
              { cat: 'FUNNY',          aliases: ['FUNNY', 'HUMOR', 'HUMOUR', 'MEME', 'MEMES', 'COMEDY', 'JOKE', 'JOKES', 'LOL'] },
              { cat: 'GAMES',          aliases: ['GAME', 'GAMES', 'GAMING', 'VIDEO GAME', 'VIDEOGAME', 'ESPORTS', 'GAMER'] },
              { cat: 'HOLIDAYS',       aliases: ['HOLIDAY', 'HOLIDAYS', 'CHRISTMAS', 'HALLOWEEN', 'EASTER', 'NEW YEAR', 'FESTIVAL', 'CELEBRATION'] },
              { cat: 'LOVE',           aliases: ['LOVE', 'ROMANCE', 'ROMANTIC', 'HEART', 'HEARTS', 'VALENTINES', 'COUPLE', 'WEDDING'] },
              { cat: 'MUSIC',          aliases: ['MUSIC', 'MUSICAL', 'SONG', 'SONGS', 'BAND', 'CONCERT', 'INSTRUMENT', 'DJ'] },
              { cat: 'NATURE',         aliases: ['NATURE', 'NATURAL', 'LANDSCAPE', 'FOREST', 'MOUNTAIN', 'OCEAN', 'FLOWER', 'FLORAL', 'PLANT', 'TREE', 'BEACH', 'SUNSET', 'SKY', 'FOOD', 'TRAVEL', 'CITY', 'ARCHITECTURE', 'SPACE EARTH'] },
              { cat: 'PATTERNS',       aliases: ['PATTERN', 'PATTERNS', 'TEXTURE', 'TEXTURES', 'MINIMALIST', 'MINIMAL', 'RETRO', 'VINTAGE'] },
              { cat: 'PEOPLE',         aliases: ['PEOPLE', 'PERSON', 'PORTRAIT', 'FACE', 'HUMAN', 'MAN', 'WOMAN', 'GIRL', 'BOY'] },
              { cat: 'SAYINGS',        aliases: ['SAYING', 'SAYINGS', 'QUOTE', 'QUOTES', 'MOTIVATIONAL', 'INSPIRATIONAL', 'TEXT', 'TYPOGRAPHY', 'WORDS'] },
              { cat: 'SPACE',          aliases: ['SPACE', 'GALAXY', 'UNIVERSE', 'COSMOS', 'STAR', 'STARS', 'PLANET', 'NEBULA', 'ASTRONAUT', 'SCI FI', 'SCIFI', 'SCIENCE FICTION'] },
              { cat: 'SPIRITUAL',      aliases: ['SPIRITUAL', 'RELIGION', 'RELIGIOUS', 'FAITH', 'GOD', 'MANDALA', 'MEDITATION', 'ZEN', 'BUDDHIST', 'ISLAMIC', 'CHRISTIAN'] },
              { cat: 'SPORTS',         aliases: ['SPORT', 'SPORTS', 'FOOTBALL', 'BASKETBALL', 'SOCCER', 'TENNIS', 'BASEBALL', 'ATHLETICS', 'FITNESS', 'GYM'] },
              { cat: 'TECHNOLOGY',     aliases: ['TECHNOLOGY', 'TECH', 'DIGITAL', 'CYBER', 'NEON', 'FUTURISTIC', 'COMPUTER', 'ROBOT', 'AI', 'CIRCUIT', 'DARK'] },
            ];

            for (const { cat, aliases } of ALIAS_MAP) {
              if (aliases.some(a => upper.includes(a))) return cat;
            }
            return 'OTHER';
          }

          function cleanDescription(raw) {
            if (!raw) return '';
            const quoteMatch = raw.match(/"([^"\r\n]{3,100})"/);
            let text = quoteMatch ? quoteMatch[1] : raw;
            text = text.replace(/^(here is a short description:|description:)/i, '').trim();
            const words = text.split(/\s+/).filter(Boolean);
            return words.slice(0, 5).join(' ');
          }

          // ─── FIREBASE: SCAN FOR IMAGES WITHOUT METADATA ───────────────────────────
          async function scanImagesWithoutMetadata(dbUrl, queuePath) {
            console.log(`  🔍 Scanning ${dbUrl}/${queuePath} for images without metadata...`);
            const res = await fetch(`${dbUrl}/${queuePath}.json`);
            if (!res.ok) {
              const err = await res.text();
              throw new Error(`Firebase read failed (${res.status}): ${err.slice(0, 200)}`);
            }
            const data = await res.json();
            if (!data || typeof data !== 'object') {
              console.log('  ℹ️  Queue is empty or not an object — nothing to process.');
              return [];
            }

            let totalRecords = 0, skippedNotImage = 0, skippedHasMetadata = 0, skippedNoData = 0;
            const candidates = [];

            for (const [key, record] of Object.entries(data)) {
              if (!record || typeof record !== 'object') continue;
              totalRecords++;

              // ── Step 1: Confirm it is an IMAGE record ──────────────────────────────
              // Primary:   type field set to "image/*"  (always written by distribute-image.html)
              // Secondary: isMp3 explicitly set to false (older records without type field)
              // Exclude:   isMp3: true  (ringtones), missing type AND isMp3 not explicitly false
              const typeIsImage = typeof record.type === 'string' && record.type.startsWith('image/');
              const isExplicitlyImage = record.isImage === true;
              const isImplicitlyImage = record.isMp3 === false && !record.type; // only if type is absent
              const isImage = typeIsImage || isExplicitlyImage || isImplicitlyImage;

              // Content kind: WALLPAPER | WALLPAPER_24H | WALLPAPER_DUAL | WALLPAPER_BATTERY
              //             | LIVE_WALLPAPER | CHARGING_ANIMATION (videos accepted too)
              const kind = getRecordKind(record);
              const isVideoContent = !!VIDEO_KINDS[kind];

              if (!isImage && !isVideoContent) {
                skippedNotImage++;
                continue;
              }

              // ── Step 2: Only process records that are MISSING metadata ─────────────
              const missingTitle    = !record.title    || String(record.title).trim()    === '';
              const missingTags     = !record.tags     || String(record.tags).trim()     === '';
              const missingCategory = !record.category || String(record.category).trim() === '';
              const needsMetadata   = missingTitle || missingTags || missingCategory;

              if (!needsMetadata) {
                skippedHasMetadata++;
                continue; // already has full metadata — skip
              }

              // ── Step 3: Must have a downloadable image source ──────────────────────
              // fileUrl   = R2 URL (written by distribute-image.html)
              // imageUrl  = legacy remote URL
              // fileBase64 = inline base64 (older records)
              const setSlotUrl = SET_KINDS[kind] ? firstSlotUrl(record, kind) : '';
              const hasSource = !!(record.fileUrl || record.imageUrl || record.fileBase64 || setSlotUrl || (VIDEO_KINDS[kind] && record.thumbUrl)); // v27.10 video thumb
              if (!hasSource) {
                skippedNoData++;
                console.warn(`  ⚠️  [${key}] Skipped — no fileUrl / imageUrl / fileBase64 / set slot file found.`);
                continue;
              }

              const sourceType = record.fileUrl ? 'R2 fileUrl' : record.imageUrl ? 'imageUrl' : record.fileBase64 ? 'fileBase64' : 'set slot file (R2)';
              const missing = [
                missingTitle    ? 'title'    : null,
                missingTags     ? 'tags'     : null,
                missingCategory ? 'category' : null,
              ].filter(Boolean).join(', ');
              console.log(`  ✅ [${key}] Queued — ${kindLabel(kind)} | source: ${sourceType} | missing: ${missing}`);
              candidates.push({ key, record, kind });
            }

            console.log(`  📊 Scan complete: ${totalRecords} total | ${skippedNotImage} not-image | ${skippedHasMetadata} already-done | ${skippedNoData} no-source | ${candidates.length} to process`);
            return candidates;
          }

          // ─── ZEDGE CONTENT POLICY GUARD (v21) ─────────────────────────────────────
          // Enforces Zedge's Content Guidelines on everything this workflow produces:
          // original-only (no artists, songs, characters, brands, logos, celebrities), no
          // adult / hate / violence / drugs / illegal content, accurate non-promotional
          // metadata, 2–10 real tags. Violations are regenerated or skipped — never uploaded.
          const ZEDGE_POLICY_RULES = `ZEDGE MARKETPLACE POLICY (MANDATORY — a single violation permanently suspends the seller account):
          - 100% ORIGINAL work only. Never name, reference, imitate or hint at any real artist, band, singer, song, lyric, album, film, TV show, game, anime, cartoon, comic, character, franchise, brand, company, product, logo, trademark, sports team, celebrity or public figure. No "in the style of", no "sounds like", no theme/cover/remix of anything existing.
          - No sexual, suggestive, nude or adult content. No hate speech, slurs, hate symbols, discrimination or stereotypes. No violence, gore, weapons, drugs, self-harm or illegal activity. Nothing involving minors.
          - Metadata must be truthful and describe ONLY this item. No promotional or spam words (free, download, app, website, subscribe, follow, link, buy), no URLs, hashtags, @handles, emojis, brand or service names, no misleading keywords.
          - Keywords: between 2 and 10 genuine descriptive single words.`;
          const POLICY_PROMO = /\b(free|download|downloads|website|subscribe|follow|buy|sale|discount|promo|www|http|https|telegram|whatsapp|instagram|tiktok|youtube|facebook|twitter|zedge)\b/i;
          const POLICY_ADULT = /\b(sexy|sex|sexual|nude|nudity|naked|porn|porno|xxx|erotic|erotica|boobs|breasts?|booty|bikini|lingerie|topless|hot girls?|seductive|nsfw|hentai|fetish|stripper|thong|underwear|cleavage)\b/i;
          const POLICY_HARM = /\b(nigg\w*|fagg?\w*|retard\w*|murder|gore|gun|guns|rifle|pistol|shooting|shooter|terror\w*|nazi|hitler|swastika|isis|jihad|marijuana|cocaine|heroin|meth|drugs|suicide|self-harm|rape|racist|slur)\b/i;
          const POLICY_IP = /\b(disney|pixar|marvel|dc comics|batman|superman|spider-?man|iron ?man|avengers|wolverine|x-?men|deadpool|harley quinn|star ?wars|darth|vader|yoda|jedi|mandalorian|grogu|harry ?potter|hogwarts|lord of the rings|hobbit|game of thrones|stranger things|squid game|breaking bad|pokemon|pikachu|charizard|super mario|luigi|zelda|minecraft|fortnite|roblox|among us|gta|call of duty|pubg|free fire|valorant|league of legends|overwatch|god of war|kratos|elden ring|naruto|goku|dragon ?ball|one piece|luffy|attack on titan|demon slayer|jujutsu|gojo|itachi|sasuke|death note|my hero academia|hello kitty|sanrio|mickey|minnie|donald duck|elsa|moana|encanto|toy story|shrek|minions|despicable|kung fu panda|spongebob|simpsons|rick and morty|peppa|paw patrol|barbie|hot wheels|lego|nike|adidas|puma|gucci|louis vuitton|iphone|samsung|xiaomi|oneplus|huawei|tesla|bmw|mercedes|audi|ferrari|lamborghini|porsche|toyota|coca-?cola|pepsi|starbucks|mcdonald'?s|kfc|netflix|spotify|nfl|nba|fifa|uefa|real madrid|barcelona|manchester united|liverpool fc|juventus|psg|messi|ronaldo|neymar|mbappe|lebron|taylor swift|beyonce|drake|eminem|rihanna|bts|blackpink|billie eilish|ed sheeran|weeknd|bad bunny|justin bieber|ariana grande|dua lipa|coldplay|imagine dragons|linkin park|metallica|beatles|nirvana|michael jackson|elvis|kanye|travis scott|post malone|shakira|adele|bruno mars|hans zimmer|john williams|bollywood|shah rukh|salman khan|allu arjun|pushpa|kgf|pathaan|jawan|kabir singh|arijit|pritam|ar rahman|a\.r\. rahman|anirudh|nokia|nokia tune|marimba|over the horizon|xbox|playstation|nintendo|godzilla|king kong|jurassic|transformers|optimus prime|bumblebee|pirates of the caribbean|jack sparrow|james bond|mission impossible|john wick|fast and furious|terminator|poppy playtime|huggy wuggy|skibidi|fnaf|cuphead|genshin|honkai|clash of clans|clash royale|brawl stars|candy crush|angry birds|subway surfers|temple run|flappy bird|tom and jerry|doraemon|shinchan|ben 10|scooby|looney|bugs bunny|winnie the pooh|cars movie|lightning mcqueen|olaf|stitch|lilo|baymax|zootopia|inside out|wednesday addams|squid|haikyuu|chainsaw man|spy x family|frieren|solo leveling|sung jinwoo)\b/i;
          function zedgePolicyIssues(meta) {
            const issues = [];
            const fields = { title: meta.title || '', tags: meta.tags || '', description: meta.description || '', prompt: meta.enhancedPrompt || '' };
            for (const [f, v] of Object.entries(fields)) {
              if (!v) continue;
              const ip = v.match(POLICY_IP); if (ip) issues.push(`${f}: protected name "${ip[0]}"`);
              const ad = v.match(POLICY_ADULT); if (ad) issues.push(`${f}: adult term "${ad[0]}"`);
              const hv = v.match(POLICY_HARM); if (hv) issues.push(`${f}: prohibited term "${hv[0]}"`);
              if (f !== 'prompt') {
                const pr = v.match(POLICY_PROMO); if (pr) issues.push(`${f}: promotional/spam word "${pr[0]}"`);
                if (/[#@]|https?:|www\.|\.(com|net|org|io|app)\b/i.test(v)) issues.push(`${f}: link/hashtag/handle`);
              }
            }
            return issues;
          }
          function zedgeCleanTags(tags) {
            const words = String(tags || '').split(/[,\s]+/).map(w => w.trim().toLowerCase()).filter(w => /^[a-z0-9-]{2,20}$/.test(w));
            const out = [];
            for (const w of words) if (!out.includes(w) && !POLICY_IP.test(w) && !POLICY_ADULT.test(w) && !POLICY_HARM.test(w) && !POLICY_PROMO.test(w)) out.push(w);
            return out.slice(0, 10);
          }
          // Returns { issues, meta } — meta has policy-clean, deduped, 2–10 tags.
          function zedgeEnforce(meta, kind) {
            const issues = zedgePolicyIssues(meta);
            const tags = zedgeCleanTags(meta.tags);
            const fallback = kind === 'image' ? ['wallpaper', 'background', 'art', 'design', 'phone', 'screen'] : ['melody', 'tune', 'alert', 'phone', 'music', 'sound'];
            const cat = String(meta.category || '').toLowerCase().replace(/[^a-z]/g, '');
            if (cat && cat !== 'other' && !tags.includes(cat)) tags.unshift(cat);
            for (const w of fallback) { if (tags.length >= 2) break; if (!tags.includes(w)) tags.push(w); }
            return { issues, meta: { ...meta, tags: tags.slice(0, 10).join(', ') } };
          }
          // ─── FIREBASE: PATCH METADATA ─────────────────────────────────────────────
          async function firebasePatchMetadata(dbUrl, queuePath, key, metadata) {
            const res = await fetch(`${dbUrl}/${queuePath}/${key}.json`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(metadata)
            });
            if (!res.ok) {
              const err = await res.text();
              throw new Error(`Firebase PATCH failed (${res.status}): ${err.slice(0, 200)}`);
            }
            return await res.json();
          }

          // ─── DECODE MEDIA → TEMP IMAGE FILE ───────────────────────────────────────
          // Supports fileBase64 (data URL), remote imageUrl / fileUrl (R2), wallpaper
          // set slot files (24H / Dual / Battery), and video content — for videos a
          // single representative frame is extracted with ffmpeg for Gemini vision.
          async function imageToTempFile(record, key, kind) {
            const tmpDir = path.join(os.tmpdir(), 'img_meta');
            fs.mkdirSync(tmpDir, { recursive: true });

            if (record.fileBase64) {
              let base64Data = record.fileBase64;
              let ext = 'png';

              if (base64Data.startsWith('data:')) {
                const mimeMatch = base64Data.match(/data:([^;]+);base64,/);
                if (mimeMatch) {
                  const mime = mimeMatch[1];
                  ext = mime.split('/')[1] || 'png';
                }
                base64Data = base64Data.replace(/^data:[^;]+;base64,/, '');
              }

              const buffer = Buffer.from(base64Data, 'base64');
              const filePath = path.join(tmpDir, `${key}.${ext}`);
              fs.writeFileSync(filePath, buffer);
              console.log(`  💾 Saved image from fileBase64 → ${filePath} (${(buffer.length / 1024).toFixed(1)} KB)`);
              return filePath;

            } else {
              // fileUrl  = R2 URL saved by distribute-image.html
              // imageUrl = legacy field name (kept for backwards compatibility)
              // Wallpaper sets: fall back to the first slot file when fileUrl is absent
              // v27.10 video thumb: Live Wallpaper / Charging Animation records already carry a JPEG
              // thumbnail (thumbUrl, written by the panel + app). Use it directly - no multi-MB video
              // download, no ffmpeg dependency. Falls back to frame extraction only when thumbUrl is missing.
              if (VIDEO_KINDS[kind] && record.thumbUrl) {
                console.log(`  🎬 Video item - using thumbnail: ${record.thumbUrl}`);
                const tRes = await fetch(record.thumbUrl);
                if (tRes.ok) {
                  const tBuf = Buffer.from(await tRes.arrayBuffer());
                  if (tBuf.length > 1024) {
                    const tPath = path.join(tmpDir, `${key}.jpg`);
                    fs.writeFileSync(tPath, tBuf);
                    console.log(`  💾 Saved video thumbnail → ${tPath} (${(tBuf.length / 1024).toFixed(1)} KB)`);
                    return tPath;
                  }
                }
                console.warn(`  ⚠️  Thumbnail fetch failed (HTTP ${tRes.status}) - falling back to video frame extraction`);
              }
              const remoteUrl = record.fileUrl || record.imageUrl || (SET_KINDS[kind] ? firstSlotUrl(record, kind) : '');
              if (!remoteUrl) throw new Error('No fileBase64, fileUrl, imageUrl, or set slot file found on record.');
              const urlSource = record.fileUrl ? 'fileUrl (R2)' : record.imageUrl ? 'imageUrl' : 'set slot file (R2)';
              console.log(`  🌐 Downloading from ${urlSource}: ${remoteUrl}`);
              const res = await fetch(remoteUrl);
              if (!res.ok) throw new Error(`Failed to fetch ${urlSource} (HTTP ${res.status}): ${remoteUrl}`);
              const buffer = Buffer.from(await res.arrayBuffer());
              const contentType = res.headers.get('content-type') || 'image/jpeg';
              const ext = contentType.split('/')[1]?.split(';')[0] || 'jpg';

              // VIDEO CONTENT (Live Wallpaper / Charging Animation): save the video,
              // then extract a single representative frame with ffmpeg for Gemini.
              if (VIDEO_KINDS[kind] || contentType.startsWith('video/')) {
                const videoExt = contentType.startsWith('video/') ? ext : 'mp4';
                const videoPath = path.join(tmpDir, `${key}_video.${videoExt}`);
                fs.writeFileSync(videoPath, buffer);
                console.log(`  💾 Downloaded video → ${videoPath} (${(buffer.length / 1024).toFixed(1)} KB)`);
                const framePath = path.join(tmpDir, `${key}.jpg`);
                try {
                  execSync(`ffmpeg -y -ss 1 -i "${videoPath}" -frames:v 1 -q:v 3 "${framePath}"`, { stdio: 'pipe' });
                } catch (e) {
                  // Very short clips can fail at -ss 1 — retry from the very first frame
                  execSync(`ffmpeg -y -i "${videoPath}" -frames:v 1 -q:v 3 "${framePath}"`, { stdio: 'pipe' });
                }
                try { fs.unlinkSync(videoPath); } catch {}
                if (!fs.existsSync(framePath) || !fs.statSync(framePath).size) {
                  throw new Error('ffmpeg could not extract a frame from the video.');
                }
                console.log(`  🎬 Extracted video frame → ${framePath}`);
                return framePath;
              }

              const filePath = path.join(tmpDir, `${key}.${ext}`);
              fs.writeFileSync(filePath, buffer);
              console.log(`  💾 Downloaded from ${urlSource} → ${filePath} (${(buffer.length / 1024).toFixed(1)} KB)`);
              return filePath;
            }
          }

          // ─── GEMINI WEB: SEND TEXT PROMPT AND WAIT FOR RESPONSE ──────────────────
          async function callGeminiWeb(promptText, geminiPage, opts = {}) {
            console.log(`    🌐 Sending prompt (${promptText.length} chars)...`);

            const inputSel = 'div.ql-editor[contenteditable="true"]';
            await geminiPage.waitForSelector(inputSel, { timeout: 15000 });
            // Dismiss any overlay blocking the input before clicking
            try { await geminiPage.keyboard.press('Escape'); await sleep(300); } catch (_) {}
            // Use { force: true } to click through any invisible overlay layer
            await geminiPage.click(inputSel, { force: true });
            await geminiPage.keyboard.press('Control+a');
            await geminiPage.keyboard.press('Delete');
            await sleep(200);

            const getResponseCount = () => geminiPage.evaluate(() => {
              const selectors = [
                'div[id^="model-response-message-content"]',
                'div[id^="response-message-content"]',
                '.response-content-container',
                'message-content',
                'div.message-content'
              ];
              const seen = new Set();
              for (const sel of selectors) {
                document.querySelectorAll(sel).forEach(el => seen.add(el));
              }
              return seen.size;
            }).catch(() => 0);

            const initialCount = await getResponseCount();

            await geminiPage.keyboard.insertText(promptText);
            await sleep(500);
            await geminiPage.keyboard.press('Enter');
            console.log(`    ⌨️  Submitted via Enter key`);

            const deadline = Date.now() + 90000;
            // v27.10: a reply is only accepted once it contains the closing tag of the LAST template section
            // (opts.completeWhen). Before, a 3 s pause while Gemini was still streaming was mistaken for a
            // finished answer -> half a template got parsed -> the audio prompt silently fell back to
            // "electronic synth pulse" while title/tags described another sound (ringtone != metadata).
            const completeRe = opts.completeWhen || null;
            const softDeadline = Date.now() + 75000;   // after this a stable partial reply is accepted (the parser validates it)
            let responseText = '';
            let lastSeen = '';
            let stableCount = 0;

            while (Date.now() < deadline) {
              await sleep(1500);
              const currentCount = await getResponseCount();
              if (currentCount <= initialCount) continue;

              const latestText = await geminiPage.evaluate(() => {
                const selectors = [
                  'div[id^="model-response-message-content"]',
                  'div[id^="response-message-content"]',
                  '.response-content p',
                  'message-content',
                  'div.message-content'
                ];
                const allMatching = [];
                for (const sel of selectors) {
                  document.querySelectorAll(sel).forEach(el => allMatching.push(el));
                }
                if (allMatching.length === 0) return '';
                allMatching.sort((a, b) => (a.compareDocumentPosition(b) & 4) ? -1 : 1);
                const lastEl = allMatching[allMatching.length - 1];
                return lastEl ? (lastEl.innerText || lastEl.textContent || '').trim() : '';
              }).catch(() => '');

              if (!latestText) continue;

              if (latestText === lastSeen) {
                stableCount++;
                if (stableCount >= 2 && (!completeRe || completeRe.test(latestText) || Date.now() > softDeadline)) { responseText = latestText; break; }
              } else {
                lastSeen = latestText;
                stableCount = 0;
              }
            }

            if (!responseText) throw new Error('Gemini web timeout: no response within 90s');
            console.log(`    ✅ Got response (${responseText.length} chars)`);
            return responseText;
          }

          // ─── GEMINI: CHECK WHETHER AN IMAGE ATTACHMENT IS VISIBLE ─────────────────
          async function hasImageAttached(geminiPage) {
            return geminiPage.evaluate(() => [
              'ms-file-attachment',
              'upload-progress-thumbnail',
              '[class*="upload-thumbnail"]',
              '[class*="file-chip"]',
              '[class*="attachment"]',
              '[class*="FileChip"]',
              'rich-textarea img',
              '[data-test-id*="attachment"]',
              '[data-test-id*="upload"]',
              '.attachment-chip',
              '.upload-thumbnail',
            ].some(s => document.querySelector(s))).catch(() => false);
          }

          // ─── GEMINI: UPLOAD IMAGE FILE ─────────────────────────────────────────────
          // PRIMARY: Playwright's native setInputFiles() via the "Open upload file menu"
          // button — the same mechanism the Rigatone extension uses.
          // FALLBACK: evaluate()-based strategies (clipboard, drag, file-input-override).
          async function uploadImageToGemini(imagePath, geminiPage) {
            console.log(`    📎 Uploading image: ${path.basename(imagePath)}`);

            const mimeType = imagePath.endsWith('.jpg') || imagePath.endsWith('.jpeg')
              ? 'image/jpeg'
              : imagePath.endsWith('.webp') ? 'image/webp' : 'image/png';

            // Log DOM state for debugging
            const domDebug = await geminiPage.evaluate(() => ({
              fileInputs : document.querySelectorAll('input[type="file"]').length,
              editors    : document.querySelectorAll('div.ql-editor, rich-textarea').length,
              ariaButtons: [...document.querySelectorAll('button[aria-label]')]
                             .map(b => b.getAttribute('aria-label')).filter(Boolean).slice(0, 15),
            })).catch(() => ({}));
            console.log(`    🔍 DOM: fileInputs=${domDebug.fileInputs}, editors=${domDebug.editors}`);
            console.log(`    🔍 aria-labels: ${JSON.stringify(domDebug.ariaButtons)}`);

            // ── STRATEGY A: Native setInputFiles via upload button (most reliable) ────
            // Clicks "Open upload file menu" → waits for file input → setInputFiles()
            // This mirrors exactly what the Rigatone extension does in the browser.
            try {
              // Try aria-label variants Gemini uses for the upload/attachment button
              const uploadBtnSelectors = [
                'button[aria-label="Open upload file menu"]',
                'button[aria-label="Upload file"]',
                'button[aria-label="Add image"]',
                'button[aria-label="Attach files"]',
                '[aria-label="Open upload file menu"]',
                '[data-test-id="upload-button"]',
              ];

              let uploadBtnClicked = false;
              for (const sel of uploadBtnSelectors) {
                try {
                  const btn = await geminiPage.$(sel);
                  if (btn) {
                    await btn.click();
                    console.log(`    🖱️  Clicked upload button: ${sel}`);
                    uploadBtnClicked = true;
                    break;
                  }
                } catch (_) {}
              }

              if (!uploadBtnClicked) {
                // Fallback: find by aria-label text match in page evaluate
                uploadBtnClicked = await geminiPage.evaluate(() => {
                  const btn = [...document.querySelectorAll('button, [role="button"]')].find(el => {
                    const label = (el.getAttribute('aria-label') || '').toLowerCase();
                    return label.includes('upload') || label.includes('attach') || label.includes('add image');
                  });
                  if (btn) { btn.click(); return true; }
                  return false;
                });
                if (uploadBtnClicked) console.log('    🖱️  Clicked upload button via evaluate fallback');
              }

              if (uploadBtnClicked) {
                // Wait for a file input to appear (hidden inputs become temporarily accessible)
                const fileInput = await geminiPage.waitForSelector('input[type="file"]', { timeout: 5000 }).catch(() => null);
                if (fileInput) {
                  // Use Playwright's native setInputFiles — bypasses all JS injection complexity
                  await fileInput.setInputFiles(imagePath);
                  console.log('    ✅ Image attached via strategy: setInputFiles (native Playwright)');
                  await sleep(1500);
                  return true;
                }
              }
            } catch (e) {
              console.log(`    ⚠️  setInputFiles strategy failed: ${e.message}`);
            }

            // ── STRATEGY B: Playwright filechooser intercept ──────────────────────────
            // Triggers the file chooser dialog by clicking any upload button.
            try {
              const [fileChooser] = await Promise.all([
                geminiPage.waitForEvent('filechooser', { timeout: 4000 }),
                geminiPage.evaluate(() => {
                  const btn = [...document.querySelectorAll('button, [role="button"]')].find(el => {
                    const label = (el.getAttribute('aria-label') || el.textContent || '').toLowerCase();
                    return label.includes('upload') || label.includes('attach') || label.includes('add image');
                  });
                  if (btn) btn.click();
                }),
              ]);
              await fileChooser.setFiles(imagePath);
              console.log('    ✅ Image attached via strategy: filechooser-intercept');
              await sleep(1500);
              return true;
            } catch (_) {}

            // ── STRATEGY C: evaluate()-based injection (clipboard / drag / file-input) ─
            const imageBuffer = fs.readFileSync(imagePath);
            const base64Data  = imageBuffer.toString('base64');
            const dataUrl = `data:${mimeType};base64,${base64Data}`;

            const result = await geminiPage.evaluate(async ({ dataUrl, name, mime }) => {

              function dataUrlToFile(dataUrl, name, type) {
                const arr  = dataUrl.split(',');
                const bstr = atob(arr[1]);
                let n = bstr.length;
                const u8 = new Uint8Array(n);
                while (n--) u8[n] = bstr.charCodeAt(n);
                return new File([u8], name, { type });
              }

              function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

              function hasAttachment() {
                return [
                  'ms-file-attachment', 'upload-progress-thumbnail',
                  '[class*="upload-thumbnail"]', '[class*="file-chip"]',
                  '[class*="attachment"]', '[class*="FileChip"]',
                  '[jsname][class*="chip"]', 'rich-textarea img',
                  '[data-test-id*="attachment"]', '[data-test-id*="upload"]',
                  '.attachment-chip', '.upload-thumbnail',
                ].some(s => document.querySelector(s));
              }

              const files = [dataUrlToFile(dataUrl, name, mime)];

              // C1: ClipboardEvent paste
              try {
                const editor =
                  document.querySelector('rich-textarea [contenteditable="true"]') ||
                  document.querySelector('.ql-editor') ||
                  document.querySelector('[contenteditable="true"]');
                if (editor) {
                  editor.focus();
                  for (const file of files) {
                    const dt = new DataTransfer();
                    dt.items.add(file);
                    editor.dispatchEvent(new ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: dt }));
                    await delay(150);
                  }
                  await delay(700);
                  if (hasAttachment()) return { ok: true, strategy: 'clipboard-paste' };
                }
              } catch (_) {}

              // C2: Broad DragEvent broadcast
              try {
                const dt = new DataTransfer();
                files.forEach(f => dt.items.add(f));
                const opts = { bubbles: true, cancelable: true, dataTransfer: dt };
                window.dispatchEvent(new DragEvent('dragenter', opts));
                document.dispatchEvent(new DragEvent('dragenter', opts));
                await delay(150);
                window.dispatchEvent(new DragEvent('dragover', opts));
                document.dispatchEvent(new DragEvent('dragover', opts));
                await delay(250);
                const targets = [
                  document.querySelector('[data-filedrop-id="chat-window-input-container"]'),
                  document.querySelector('file-drop-indicator'),
                  document.querySelector('.input-area-container'),
                  document.querySelector('.input-area'),
                  document.querySelector('rich-textarea'),
                  document.querySelector('[contenteditable="true"]'),
                  document.querySelector('fieldset'),
                  document.body,
                ].filter(Boolean);
                for (const el of targets) { el.dispatchEvent(new DragEvent('drop', opts)); await delay(80); }
                document.dispatchEvent(new DragEvent('drop', opts));
                window.dispatchEvent(new DragEvent('drop', opts));
                await delay(800);
                if (hasAttachment()) return { ok: true, strategy: 'drag-broadcast' };
              } catch (_) {}

              // C3: file-input override on existing hidden inputs
              try {
                const inputs = [...document.querySelectorAll('input[type="file"]')];
                let tried = 0;
                for (const inp of inputs) {
                  try {
                    const dt2 = new DataTransfer();
                    files.forEach(f => dt2.items.add(f));
                    Object.defineProperty(inp, 'files', { value: dt2.files, configurable: true });
                    inp.dispatchEvent(new Event('change', { bubbles: true }));
                    inp.dispatchEvent(new Event('input',  { bubbles: true }));
                    tried++;
                  } catch (_) {}
                }
                if (tried) {
                  await delay(700);
                  if (hasAttachment()) return { ok: true, strategy: 'file-input-override' };
                }
              } catch (_) {}

              return { ok: false, strategy: 'all-failed' };

            }, { dataUrl, name: path.basename(imagePath), mime: mimeType });

            if (result.ok) {
              console.log(`    ✅ Image attached via strategy: ${result.strategy}`);
              return true;
            }

            // All strategies failed — take a debug screenshot
            console.warn('    ❌ All strategies exhausted. Taking debug screenshot...');
            try {
              const screenshotPath = `/tmp/gemini_upload_fail_${Date.now()}.png`;
              await geminiPage.screenshot({ path: screenshotPath, fullPage: false });
              console.warn(`    📸 Screenshot saved: ${screenshotPath}`);
            } catch (e) {
              console.warn(`    📸 Screenshot failed: ${e.message}`);
            }
            return false;
          }

          // ─── GENERATE METADATA FOR ONE IMAGE VIA GEMINI ───────────────────────────
          async function generateImageMetadata(imagePath, key, geminiPage, kind) {
            console.log(`  🤖 Generating metadata for image [${key}]...`);

            // Open a fresh Gemini chat for each image
            console.log('  🌐 Opening fresh Gemini chat...');
            await geminiPage.goto('https://gemini.google.com/app/new', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await sleep(3000);

            // Dismiss any overlays / cookie banners / "What's new" modals
            // First try Escape key to close any overlay blocking the input
            try { await geminiPage.keyboard.press('Escape'); await sleep(500); } catch (_) {}
            const dismissSels = [
              'button:has-text("I agree")', 'button:has-text("Agree")',
              'button:has-text("Got it")', 'button:has-text("Dismiss")',
              'button:has-text("Close")', 'button:has-text("OK")',
              'button:has-text("Continue")', 'button:has-text("Skip")'
            ];
            for (const sel of dismissSels) {
              try {
                if (await geminiPage.isVisible(sel)) {
                  await geminiPage.click(sel);
                  await sleep(600);
                }
              } catch (e) {}
            }
            // One more Escape in case a secondary dialog appeared
            try { await geminiPage.keyboard.press('Escape'); await sleep(400); } catch (_) {}

            // Verify the chat input is ready (session already validated at startup)
            const inputVisible = await geminiPage.isVisible('div.ql-editor[contenteditable="true"], rich-textarea [contenteditable="true"]').catch(() => false);
            if (!inputVisible) {
              // Take debug screenshot
              const screenshotPath = `/tmp/gemini_no_input_${Date.now()}.png`;
              await geminiPage.screenshot({ path: screenshotPath }).catch(() => {});
              console.warn(`   ⚠️  Input not found — screenshot: ${screenshotPath}`);
              throw new Error('Gemini chat input not found. The page may not have loaded correctly.');
            }

            // Upload the image using setInputFiles (native Playwright) + fallback strategies
            const uploaded = await uploadImageToGemini(imagePath, geminiPage);
            if (!uploaded) {
              throw new Error('Could not attach image to Gemini after all strategies.');
            }
            await sleep(1500);

            // Build the metadata prompt (content-kind aware: wallpaper / set / video)
            const validCategories = VALID_IMG_CATS.filter(c => c !== 'OTHER').join(', ');
            const kindContext = KIND_PROMPT_CONTEXT[kind] || KIND_PROMPT_CONTEXT.WALLPAPER;
            const METADATA_PROMPT =
              `You are an expert image curator, SEO metadata specialist and Zedge marketplace compliance reviewer.\n\n${ZEDGE_POLICY_RULES}\n\n` +
              `${kindContext}\n` +
              `Look at the attached image carefully and generate the following metadata:\n` +
              `1. A creative and UNIQUE TITLE (max 25 characters). Use evocative, descriptive words. Avoid generic filler words like "beautiful", "amazing", "stunning". No quotes.\n` +
              `2. 15 relevant, descriptive single-word KEYWORDS (comma-separated). Cover the subject, colors, mood, style, and use-case.\n` +
              `3. The most appropriate CATEGORY selected ONLY from this list: ${validCategories}.\n` +
              `4. A SHORT description in MAXIMUM 5 WORDS. No punctuation, no full sentences.\n` +
              `5. POLICY verdict: write OK if this image is clearly safe and original under the policy above. Otherwise write FLAG: <short reason> — flag any recognizable copyrighted character, franchise art, brand/logo/trademark, celebrity or real identifiable person (selfie, family photo), text watermark, sexual/suggestive content, hate symbol, violence, weapons, drugs, apparent minors, or a stretched / blurry / badly cropped low-quality image.\n\n` +
              `CRITICAL: Format your ENTIRE response EXACTLY like this — no other text outside these tags:\n` +
              `[TITLE]...[/TITLE]\n` +
              `[KEYWORDS]...[/KEYWORDS]\n` +
              `[CATEGORY]...[/CATEGORY]\n` +
              `[DESCRIPTION]...[/DESCRIPTION]\n` +
              `[POLICY]OK or FLAG: reason[/POLICY]`;

            const responseText = await callGeminiWeb(METADATA_PROMPT, geminiPage, { completeWhen: /\[\s*\/\s*POLICY\s*\]/i });

            // Parse response tags
            const getTagValue = (text, tag) => {
              // v27.10 tolerant parser: Gemini renders markdown, so "[ENHANCED_PROMPT]" can come back as
              // "**[ENHANCED PROMPT]**", "[ENHANCEDPROMPT]", with a ":" after it, or without its closing tag.
              // The old strict regex then returned '' and the caller silently used a fallback value.
              const t = tag.replace(/_/g, '[_ \\-]?');
              const open = new RegExp(`\\[\\s*${t}\\s*\\]\\s*:?`, 'i');
              const m = text.match(open);
              if (!m) return '';
              let rest = text.slice(m.index + m[0].length);
              const close = rest.match(new RegExp(`\\[\\s*\\/\\s*${t}\\s*\\]`, 'i'));
              if (close) rest = rest.slice(0, close.index);
              else { const nx = rest.match(/\[\s*\/?\s*(ENHANCED[_ -]?PROMPT|TITLE|KEYWORDS|CATEGORY|DESCRIPTION|POLICY)\s*\]/i); if (nx) rest = rest.slice(0, nx.index); }
              rest = rest.replace(/\*\*/g, '').replace(/^`+|`+$/g, '').replace(/^\s*:\s*/, '').trim();
              return /^(\.{3}|\u2026)$/.test(rest) ? '' : rest;   // the literal "..." template placeholder counts as missing
            };

            const title       = cleanTitle(getTagValue(responseText, 'TITLE'))       || `Image ${key.slice(0, 8)}`;
            const tags        = cleanKeywords(getTagValue(responseText, 'KEYWORDS'));
            const category    = cleanCategory(getTagValue(responseText, 'CATEGORY'));
            const description = cleanDescription(getTagValue(responseText, 'DESCRIPTION'));

            console.log(`  ✨ Title    : "${title}"`);
            console.log(`  🏷️  Tags     : ${tags}`);
            console.log(`  📁 Category : ${category}`);
            console.log(`  📝 Desc     : ${description}`);

            const policy = getTagValue(responseText, 'POLICY');
            console.log(`  🛡️  Policy   : ${policy || '(no verdict)'}`);
            return { title, tags, category, description, policy };
          }

          // ─── MAIN ─────────────────────────────────────────────────────────────────
          console.log('============================================================');
          console.log('  🖼️   IMAGE METADATA GENERATOR → FIREBASE');
          console.log('============================================================');
          console.log('📋 Max images to process : All (unlimited)');
          console.log(`📂 Queue path            : ${IMAGE_QUEUE_PATH}`);
          console.log(`🎯 Target account        : ${TARGET_ACCOUNT}`);
          TARGET_DB_URLS.forEach(d => console.log(`   🔥 ${d.name}: ${d.url}`));
          console.log('🌐 Gemini Mode           : Web scraping (gemini.google.com)');
          console.log('============================================================\n');

          // ─── INIT GEMINI BROWSER (shared across all images) ───────────────────────
          let geminiBrowser = null;
          let geminiPage    = null;

          try {
            console.log('🌐 Launching Gemini browser (stealth mode)...');
            const { chromium } = await import('playwright-extra');
            const { default: StealthPlugin } = await import('puppeteer-extra-plugin-stealth');
            chromium.use(StealthPlugin());

            geminiBrowser = await chromium.launch({
              headless: false,
              args: [
                '--no-sandbox', '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-blink-features=AutomationControlled',
                '--disable-web-security',
                '--disable-features=IsolateOrigins,site-per-process'
              ]
            });

            const VIDEO_DIR = '/tmp/playwright-videos';
            fs.mkdirSync(VIDEO_DIR, { recursive: true });

            // Use the file path (not the object) — this is more reliable for
            // Playwright to correctly restore both cookies AND localStorage.
            const context = await geminiBrowser.newContext({
              storageState: STORAGE_STATE_FILE,
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              viewport: { width: 1280, height: 800 },
              acceptDownloads: true,
              recordVideo: {
                dir: VIDEO_DIR,
                size: { width: 1280, height: 800 }
              }
            });

            geminiPage = await context.newPage();

            // ── SESSION VERIFICATION ─────────────────────────────────────────
            console.log('🔐 Verifying session is alive...');
            await geminiPage.goto('https://gemini.google.com/app', {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });
            await sleep(4000);

            const currentUrl = geminiPage.url();
            console.log(`   Current URL after navigation: ${currentUrl}`);

            // Check if we got redirected to accounts/login
            const isLoggedOut =
              currentUrl.includes('accounts.google.com') ||
              currentUrl.includes('/signin') ||
              currentUrl.includes('/login') ||
              currentUrl.includes('ServiceLogin');

            if (isLoggedOut) {
              // Take a screenshot for debugging
              const screenshotPath = '/tmp/session_failure.png';
              await geminiPage.screenshot({ path: screenshotPath, fullPage: true }).catch(() => {});
              console.error(`❌ Session FAILED — redirected to login page: ${currentUrl}`);
              console.error('   The GEMINI_SESSION cookies are expired or invalid.');
              console.error('   Please re-export a fresh session using the Rigatone extension.');
              console.error(`   Debug screenshot saved: ${screenshotPath}`);
              process.exit(1);
            }

            // Also check the page title doesn't indicate sign-in
            const pageTitle = await geminiPage.title().catch(() => '');
            console.log(`   Page title: "${pageTitle}"`);
            if (pageTitle.toLowerCase().includes('sign in') || pageTitle.toLowerCase().includes('google accounts')) {
              console.error('❌ Session FAILED — page title indicates sign-in page.');
              console.error('   The GEMINI_SESSION cookies are expired or invalid.');
              process.exit(1);
            }

            console.log('✅ Session verified — Gemini browser initialized.\n');

          } catch (err) {
            console.error(`❌ Failed to launch Gemini browser: ${err.message}`);
            process.exit(1);
          }

          // ─── PROCESS EACH DB TARGET ───────────────────────────────────────────────
          let totalSuccess = 0;
          let totalHeld = 0;
          let totalFailed  = 0;

          // ─── LOCAL-JOBS MODE (Image Studio, mode: image_studio) ──────────────────
          // When META_LOCAL_DIR is set the script does NOT scan Firebase. Instead it watches
          // META_LOCAL_DIR/jobs/*.json  ({ id, imagePath, kind })  written by studio_server.mjs,
          // runs the SAME Gemini-Web flow + Zedge policy check on the local JPG and writes
          // META_LOCAL_DIR/results/<id>.json. The browser stays open until META_LOCAL_DIR/stop
          // exists, so every set/image gets its title/tags/category BEFORE it is pushed to
          // Firebase — exactly like the ringtone job (metadata first, then the queued record).
          const META_LOCAL_DIR = (process.env.META_LOCAL_DIR || '').trim();
          if (META_LOCAL_DIR) {
            const jobsDir = path.join(META_LOCAL_DIR, 'jobs');
            const resDir  = path.join(META_LOCAL_DIR, 'results');
            const stopFile = path.join(META_LOCAL_DIR, 'stop');
            fs.mkdirSync(jobsDir, { recursive: true });
            fs.mkdirSync(resDir, { recursive: true });
            console.log(`\n🗂️  Local-jobs mode — watching ${jobsDir} (Image Studio). Firebase scan is skipped.`);
            console.log('   READY_FOR_LOCAL_JOBS');
            let idleTicks = 0;
            while (!fs.existsSync(stopFile)) {
              const files = fs.readdirSync(jobsDir).filter(f => f.endsWith('.json')).sort();
              if (!files.length) {
                if (++idleTicks % 60 === 0) console.log('   💤 idle — waiting for new images…');
                await sleep(2000);
                continue;
              }
              idleTicks = 0;
              for (const f of files) {
                if (fs.existsSync(stopFile)) break;
                const jobPath = path.join(jobsDir, f);
                let job;
                try { job = JSON.parse(fs.readFileSync(jobPath, 'utf8')); }
                catch (e) { console.error(`  ❌ [local] bad job file ${f}: ${e.message}`); try { fs.unlinkSync(jobPath); } catch {} continue; }
                const id = String(job.id || path.basename(f, '.json'));
                const kind = SET_KINDS[job.kind] ? job.kind : 'WALLPAPER';
                console.log(`\n  [local] Key: ${id} — ${kindLabel(kind)} (${path.basename(job.imagePath || '')})`);
                const out = { id, kind, imagePath: job.imagePath, startedAt: Date.now() };
                try {
                  if (!job.imagePath || !fs.existsSync(job.imagePath)) throw new Error(`image file not found: ${job.imagePath}`);
                  let metadata = await generateImageMetadata(job.imagePath, id, geminiPage, kind);
                  let check = zedgeEnforce(metadata, 'image');
                  if (check.issues.length) {
                    console.warn(`  🚫 [local] [${id}] Zedge policy: ${check.issues.join('; ')} — regenerating metadata once`);
                    await sleep(2000);
                    metadata = await generateImageMetadata(job.imagePath, id, geminiPage, kind);
                    check = zedgeEnforce(metadata, 'image');
                  }
                  const verdict = String(metadata.policy || '').trim();
                  const flag = /^FLAG/i.test(verdict) ? verdict.replace(/^FLAG\s*:?\s*/i, '').trim() || 'flagged by policy review' : '';
                  const reason = flag || (check.issues.length ? `metadata could not be made policy-safe: ${check.issues.join('; ')}` : '');
                  Object.assign(out, {
                    ok: true,
                    title: check.meta.title, tags: check.meta.tags, category: check.meta.category, description: check.meta.description,
                    policyCheck: reason ? 'held' : 'passed', policyFlag: reason, issues: check.issues, finishedAt: Date.now()
                  });
                  if (reason) { totalHeld++; console.warn(`  🛑 [local] [${id}] HELD (Zedge policy): ${reason}`); }
                  else { totalSuccess++; console.log(`  ✅ [local] [${id}] Metadata generated: "${check.meta.title}" · ${check.meta.category}`); }
                } catch (err) {
                  totalFailed++;
                  Object.assign(out, { ok: false, error: err.message, finishedAt: Date.now() });
                  console.error(`  ❌ [local] [${id}] Failed: ${err.message}`);
                }
                const tmp = path.join(resDir, `${id}.json.tmp`);
                fs.writeFileSync(tmp, JSON.stringify(out));
                fs.renameSync(tmp, path.join(resDir, `${id}.json`));
                try { fs.unlinkSync(jobPath); } catch {}
                await sleep(2000);
              }
            }
            console.log('\n🛑 [local] stop requested — closing Gemini browser.');
          }

          for (const db of (META_LOCAL_DIR ? [] : TARGET_DB_URLS)) {
            console.log(`\n🔥 Processing DB: ${db.name} (${db.url})`);

            let candidates;
            try {
              candidates = await scanImagesWithoutMetadata(db.url, IMAGE_QUEUE_PATH);
            } catch (err) {
              console.error(`  ❌ Failed to scan ${db.name}: ${err.message}`);
              continue;
            }

            if (candidates.length === 0) {
              console.log(`  ✅ ${db.name}: No images need metadata — all good!`);
              continue;
            }

            // Process ALL candidates — smart auto-scan, no artificial cap.
            // scanImagesWithoutMetadata() already filters out any image that has
            // all three metadata fields (title + tags + category) filled in.
            const toProcess = candidates;
            console.log(`  🚀 Auto-processing all ${toProcess.length} image(s) missing metadata...`);

            for (let i = 0; i < toProcess.length; i++) {
              const { key, record, kind } = toProcess[i];
              console.log(`\n  [${i + 1}/${toProcess.length}] Key: ${key} — ${kindLabel(kind)}`);

              let tmpImagePath = null;
              try {
                tmpImagePath = await imageToTempFile(record, key, kind);
                let metadata = await generateImageMetadata(tmpImagePath, key, geminiPage, kind);
                let check = zedgeEnforce(metadata, 'image');
                if (check.issues.length) {
                  console.warn(`  🚫 [${db.name}] [${key}] Zedge policy: ${check.issues.join('; ')} — regenerating metadata once`);
                  await sleep(2000);
                  metadata = await generateImageMetadata(tmpImagePath, key, geminiPage, kind);
                  check = zedgeEnforce(metadata, 'image');
                }
                const verdict = String(metadata.policy || '').trim();
                const flag = /^FLAG/i.test(verdict) ? verdict.replace(/^FLAG\s*:?\s*/i, '').trim() || 'flagged by policy review' : '';
                const patch = {
                  title: check.meta.title,
                  tags: check.meta.tags,
                  category: check.meta.category,
                  description: check.meta.description,
                  metadataGeneratedAt: Date.now(),
                  policyCheckedAt: Date.now()
                };
                const reason = flag || (check.issues.length ? `metadata could not be made policy-safe: ${check.issues.join('; ')}` : '');
                if (reason && (record.status || 'queued') === 'queued') {
                  // Hold the item: bots only upload status=queued. It appears in the panel/app
                  // Failed section with the reason; Requeue only if it is your own compliant work.
                  Object.assign(patch, {
                    status: 'failed',
                    policyCheck: 'held',
                    policyFlag: reason,
                    error: `Zedge policy hold — ${reason}. Review this item; Requeue only if it is your own original, policy-compliant work (uploading it may suspend the Zedge account).`,
                    failedAt: Date.now()
                  });
                  await firebasePatchMetadata(db.url, IMAGE_QUEUE_PATH, key, patch);
                  console.warn(`  🛑 [${db.name}] [${key}] HELD (not uploaded): ${reason}`);
                  totalHeld++;
                } else {
                  patch.policyCheck = reason ? 'review' : 'passed';
                  if (reason) patch.policyFlag = reason;
                  await firebasePatchMetadata(db.url, IMAGE_QUEUE_PATH, key, patch);
                  console.log(`  ✅ [${db.name}] [${key}] Metadata patched successfully! (policy ${patch.policyCheck})`);
                  totalSuccess++;
                }

              } catch (err) {
                console.error(`  ❌ [${db.name}] [${key}] Failed: ${err.message}`);
                totalFailed++;
              } finally {
                if (tmpImagePath && fs.existsSync(tmpImagePath)) {
                  try { fs.unlinkSync(tmpImagePath); } catch {}
                }
              }

              if (i < toProcess.length - 1) {
                console.log('  ⏳ Waiting 3s before next image...');
                await sleep(3000);
              }
            }
          }

          // ─── SHUTDOWN ─────────────────────────────────────────────────────────────
          if (geminiPage) {
            try {
              const videoPath = await geminiPage.video()?.path();
              if (videoPath) {
                console.log(`\n🎥 Session recording saved: ${videoPath}`);
              }
            } catch (_) {}
          }
          if (geminiBrowser) {
            console.log('\n🌐 Closing Gemini browser...');
            await geminiBrowser.close().catch(() => {});
            // Video file is only fully written after browser closes
            try {
              const videos = fs.readdirSync('/tmp/playwright-videos');
              console.log(`📹 Recording(s) in /tmp/playwright-videos: ${videos.join(', ')}`);
            } catch (_) {}
          }

          // ─── SUMMARY ──────────────────────────────────────────────────────────────
          console.log('\n============================================================');
          console.log('  🏁  IMAGE METADATA GENERATION COMPLETE');
          console.log('============================================================');
          console.log(`✅ Success  : ${totalSuccess}`);
          console.log(`❌ Failed   : ${totalFailed}`);
          console.log(`🛑 Held     : ${totalHeld} (Zedge policy — see Failed section, Requeue only if compliant)`);
          console.log(`⏭️  Already done: images with full metadata were skipped automatically`);
          console.log('============================================================');

          if (totalFailed > 0 && totalSuccess === 0 && !META_LOCAL_DIR) {
            process.exit(1);
          }
          IMGMETA_EOF
          node --check image_metadata.mjs && echo "✅ image_metadata.mjs written ($(wc -l < image_metadata.mjs) lines)"

      - name: 🌩️ Install cloudflared (quick tunnel, no Cloudflare account needed)
        if: github.event.inputs.mode == 'image_studio'
        run: |
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          sudo apt-get install -y -qq zip > /dev/null
          cloudflared --version


      - name: 📝 Write Image Studio server
        if: github.event.inputs.mode == 'image_studio'
        run: |
          cat > studio_server.mjs << 'STUDIO_EOF'
          // ☁️ Image Studio server — runs inside the GitHub Actions runner, exposed via a Cloudflare quick tunnel.
