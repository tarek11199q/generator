          .fr .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .fr .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;color:var(--faint);text-align:center;padding:6px}
