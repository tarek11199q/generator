                if (item.status === 'running') throw new Error('item is still running');
                if (item.distributed.length || item.lockedAccount) throw new Error(`${item.folder} is already in ${item.distributed[0] ? item.distributed[0].dbName : item.lockedAccount} — frames cannot be regenerated after distribution (a new record would duplicate it). Add a new prompt instead.`);
                const which = body.frame;
                if (typeof which === 'number') {
                  if (!item.frames[which]) throw new Error('frame not found');
                  item.frames[which].status = 'queued';
                  if (which === 0) { item.anchorId = null; item.frames.forEach((f, i) => { if (i > 0) f.status = 'queued'; }); }
                  if (which === 0 && item.frames.length > 1) log(`⟳ ${item.folder}: anchor regenerated — all variants re-queued to stay consistent`);
                } else {
                  item.frames.forEach(f => { if (f.status !== 'done') f.status = 'queued'; });
                  if (item.frames[0].status !== 'done') item.anchorId = null;
                }
                item.status = 'queued'; item.error = ''; item.distributed = []; item.distributeStatus = ''; item.distributeError = '';
                if (item.frames[0].status !== 'done' && item.meta && item.meta.source !== 'manual') { item.meta = null; item.metaStatus = ''; item.metaError = ''; }
                saveState(); pump();
                return json(res, 200, { ok: true });
              }
              if (p === '/api/delete') {
                const idx = state.items.findIndex(i => i.id === body.id);
                if (idx < 0) throw new Error('item not found');
