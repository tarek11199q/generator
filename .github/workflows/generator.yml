            item.distributeStatus = 'running'; item.distributeError = ''; item.lockedAccount = onlyAccount; saveState();
            const dbs = targetDbs(onlyAccount);      // always exactly one account
            if (dbs.length !== 1 || FIREBASE_DB_MAP[dbs[0].name] !== dbs[0].url) throw new Error('internal: account routing mismatch — aborted');
            const def = SET_FRAMES[item.type];
            const [w, h] = RATIOS[item.settings.ratio] || RATIOS['9:16'];
            const queuePath = state.settings.queuePath || 'wallpaperQueue';
            let failures = [];
            for (const db of dbs) {
              try {
                const files = {};
                let first = null, totalSize = 0;
                for (const fr of item.frames) {
                  const buf = fs.readFileSync(fr.localPath);
                  const name = `${slug(item.concept)}_${fr.file}`;
                  const fileUrl = await uploadToR2(buf, name, db.name);   // R2 key = <db.name>/wallpaper/… — same account as the Firebase DB below
                  if (!new RegExp(`/${db.name.replace(/^zedge_?/i, 'zedge')}/wallpaper/`, 'i').test(fileUrl) && !/localhost|127\.0\.0\.1/.test(fileUrl)) throw new Error(`R2 returned a URL outside the ${db.name} folder (${fileUrl}) — aborted before writing Firebase`);
                  const entry = { fileUrl, name, size: buf.length, type: 'image/jpeg', width: w, height: h, sha256: sha256(buf) };
                  files[fr.slot] = entry; totalSize += buf.length;
                  if (!first) first = entry;
                  log(`☁️ [${db.name}] R2 ← ${item.folder}/${fr.file}`);
                }
                const base = {
                  name: first.name, type: 'image/jpeg', size: item.type === 'SINGLE' ? first.size : totalSize,
                  width: w, height: h, isMp3: false, isImage: true,
                  contentType: def.contentType,
                  fileUrl: first.fileUrl,
                  status: 'queued',
                  prompt: item.prompt,
                  imageModel: item.settings.model,
                  source: 'github-image-studio',
                  createdAt: Date.now()
                };
                if (item.type !== 'SINGLE') { base.files = files; base.setName = item.concept; }
                // Ringtone-style: the record already carries title / tags / category / description / policyCheck,
                // so the Zedge bot can upload it immediately (no "metadata missing" skip). Policy-held items are
                // pushed as status:'failed' + policyCheck:'held' — visible in the app's Failed section, never auto-uploaded.
                const mf = metaFields(item);
                if (mf) Object.assign(base, mf);
                const key = await firebasePush(db.url, queuePath, base);
                for (const e of Object.values(files)) ledger[e.sha256] = { account: db.name, firebaseKey: key, folder: item.folder, file: e.name, at: Date.now() };
                saveLedger();
                const snap = mf ? { title: base.title, tags: base.tags, category: base.category, description: base.description, policyCheck: base.policyCheck, policyFlag: base.policyFlag, status: base.status, metadataGeneratedAt: base.metadataGeneratedAt, fetchedAt: Date.now() } : {};
                item.distributed.push({ dbName: db.name, key, at: Date.now(), meta: snap });
                log(`🔥 [${db.name}] Firebase key ${key} ← ${item.folder} (${def.contentType})${mf ? ` · "${base.title}" · ${base.category} · policy ${base.policyCheck}${base.status !== 'queued' ? ` · status ${base.status}` : ''}` : ' · ⚠️ NO metadata (bot will skip until the final metadata pass)'}`);
                saveState();
              } catch (e) {
                failures.push(`${db.name}: ${e.message}`);
                log(`❌ [${db.name}] distribute ${item.folder}: ${e.message}`);
              }
            }
            item.distributeStatus = failures.length ? (item.distributed.length ? 'partial' : 'failed') : 'done';
            item.distributeError = failures.join(' · ');
            lastActivity = Date.now(); saveState();
            if (failures.length) throw new Error(failures.join(' · '));
          }
          function maybeAutoDistribute(item) {
            if (!state.settings.autoDistribute || item.status !== 'done' || item.distributed.length || item.distributeStatus === 'running') return;
            const hasMeta = !!(item.meta && item.meta.title);
            if (state.settings.requireMetadata && !hasMeta) {
              if (state.metaWorker.available && state.settings.autoMetadata) return;          // will be called again when the result lands
              log(`⏸ auto-distribute ${item.folder}: waiting for metadata (${state.metaWorker.available ? 'auto metadata is off — press 🧠' : 'GEMINI_SESSION missing — use Edit on the card'})`);
              return;
            }
            if (hasMeta && item.meta.policyCheck === 'held') { if (!item.autoHeldNoted) { item.autoHeldNoted = true; log(`🛑 auto-distribute skipped for ${item.folder}: Zedge policy hold — ${item.meta.policyFlag}. Review it, then Distribute manually (it will be pushed as status failed/held) or fix the metadata with Edit.`); } return; }
            distributeItem(item, state.settings.targetAccount).catch(e => log(`❌ auto-distribute ${item.folder}: ${e.message}`));
          }

          // ─── METADATA WORKER: image_metadata.mjs (Gemini Web) in local-jobs mode ────────────
          // The workflow's own metadata script is started ONCE with META_LOCAL_DIR set. It opens Gemini
          // Web, verifies the GEMINI_SESSION cookie and then watches META_DIR/jobs. For every finished
          // set / image we drop a job file with the local anchor JPG; the script writes META_DIR/results/
          // <id>.json with title / tags / category / description / policy verdict. Only then is the
          // record pushed to Firebase (with the metadata in it) — the same order the ringtone job uses.
          const META_JOBS = path.join(META_DIR, 'jobs'), META_RESULTS = path.join(META_DIR, 'results'), META_STOP = path.join(META_DIR, 'stop');
          fs.mkdirSync(META_JOBS, { recursive: true }); fs.mkdirSync(META_RESULTS, { recursive: true });
          try { fs.unlinkSync(META_STOP); } catch {}
          for (const d of [META_JOBS, META_RESULTS]) for (const f of fs.readdirSync(d)) { try { fs.unlinkSync(path.join(d, f)); } catch {} }
          let metaChild = null, metaRestartTimer = null;
          const metaJobCount = () => { try { return fs.readdirSync(META_JOBS).filter(f => f.endsWith('.json')).length; } catch { return 0; } };

          function queueMetadata(item, why = 'manual') {
            const mw = state.metaWorker;
            if (!mw.available) { if (why !== 'generated') log(`⚠️ Metadata unavailable: ${GEMINI_AVAILABLE ? 'image_metadata.mjs not found on the runner' : 'GEMINI_SESSION secret / gemini_session input is missing'} — edit metadata manually with Edit on the card`); return false; }
            if (why === 'generated' && !state.settings.autoMetadata) return false;
            const anchor = item.frames[0];
            if (anchor.status !== 'done' || !anchor.localPath || !fs.existsSync(anchor.localPath)) { item.metaStatus = 'failed'; item.metaError = 'anchor image missing'; saveState(); return false; }
            if (item.metaStatus === 'queued' || item.metaStatus === 'running') return true;
            const job = { id: String(item.id), imagePath: anchor.localPath, kind: SET_FRAMES[item.type].contentType, folder: item.folder, queuedAt: Date.now() };
            fs.writeFileSync(path.join(META_JOBS, `${item.id}.json`), JSON.stringify(job));
            item.metaStatus = 'queued'; item.metaError = '';
            mw.queued = metaJobCount();
            log(`🧠 Metadata queued for ${item.folder} (${job.kind}) — ${why}`);
            saveState();
            ensureMetaWorker();
            return true;
          }
          function ensureMetaWorker(why = 'jobs pending') {
            const mw = state.metaWorker;
            if (!mw.available || mw.running || state.finished) return;
            if (mw.restarts >= 4) { mw.error = mw.error || 'metadata worker crashed 4× — check GEMINI_SESSION and the metadata log'; saveState(); return; }
            mw.running = true; mw.ready = false; mw.startedAt = Date.now(); mw.current = 'opening Gemini Web…'; mw.error = ''; saveState();
            log(`🧠 Starting Gemini-Web metadata worker (${why})`);
            const env = { ...process.env, META_LOCAL_DIR: META_DIR, IMAGE_QUEUE_PATH: state.settings.queuePath || 'wallpaperQueue' };
            metaChild = spawn(process.execPath, ['--experimental-vm-modules', METADATA_SCRIPT], { env, stdio: ['ignore', 'pipe', 'pipe'] });
            let buf = '', tail = [];
            const onLine = line => {
              const t = line.trim(); if (!t) return;
              tail.push(t); if (tail.length > 40) tail.shift();
              let m;
              if (/READY_FOR_LOCAL_JOBS/.test(t)) { mw.ready = true; mw.current = 'idle — Gemini session verified'; log('🧠 Gemini Web session verified — metadata worker ready'); }
              else if ((m = t.match(/\[local\] Key: (\S+) — (.+?) \(/))) { mw.current = `writing metadata · ${m[2]} #${m[1]}`; const it = state.items.find(i => String(i.id) === m[1]); if (it) { it.metaStatus = 'running'; saveState(); } }
              else if (/Session FAILED|cookies are expired/i.test(t)) { mw.error = 'Gemini session expired / invalid — re-export GEMINI_SESSION'; }
              else if (/Verifying session|Launching|storageState/i.test(t)) mw.current = 'opening Gemini Web…';
              if (/✅ \[local\]|❌ \[local\]|🛑 \[local\]|🚫 \[local\]|❌ Session|Session FAILED|Failed to launch/.test(t)) log(`🧠 ${t.replace(/^\s+/, '')}`);
