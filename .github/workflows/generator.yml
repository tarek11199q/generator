              }
              if (req.method !== 'POST') return json(res, 404, { error: 'not found' });
              const body = await readBody(req);
              lastActivity = Date.now();

              if (p === '/api/settings') {
                const s = body.settings || {};
                if (s.model && TEXT_MODELS.includes(s.model)) state.settings.model = s.model;
                if (['1K', '2K'].includes(s.res)) state.settings.res = s.res;
                if (RATIOS[s.ratio]) state.settings.ratio = s.ratio;
                if (BOOST[s.boost]) state.settings.boost = s.boost;
                if (DISPLAY[s.display] !== undefined) state.settings.display = s.display;
                if (STRENGTH[s.strength]) state.settings.strength = s.strength;
                if (typeof s.upscale === 'boolean') state.settings.upscale = s.upscale;
                if (s.concurrency) state.settings.concurrency = Math.max(1, Math.min(4, parseInt(s.concurrency, 10) || 1));
                if (s.targetAccount && (FIREBASE_DB_MAP[s.targetAccount] || s.targetAccount === SPREAD)) state.settings.targetAccount = s.targetAccount;
                if (Array.isArray(s.spreadPool)) { const pool = [...new Set(s.spreadPool.filter(a => FIREBASE_DB_MAP[a]))]; if (pool.length) state.settings.spreadPool = pool; }
                if (typeof s.queuePath === 'string' && /^[A-Za-z0-9_\/-]{1,80}$/.test(s.queuePath.trim())) state.settings.queuePath = s.queuePath.trim();
                if (typeof s.autoDistribute === 'boolean') state.settings.autoDistribute = s.autoDistribute;
