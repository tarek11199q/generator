            log(`🏁 Session finished: ${reason}`);
            try { writeExports(); } catch {}
            const generated = state.items.filter(i => i.status === 'done').length;
            const frames = state.items.reduce((n, i) => n + i.frames.filter(f => f.status === 'done').length, 0);
            const distributed = state.items.filter(i => i.distributed.length > 0).length;
            const records = state.items.reduce((n, i) => n + i.distributed.length, 0);
            stopMetaWorker();
            const metaReady = state.items.reduce((n, i) => n + i.distributed.filter(d => d.meta && d.meta.title).length, 0);
            const itemsWithMeta = state.items.filter(i => i.meta && i.meta.title).length;
            const held = state.items.filter(i => i.meta && i.meta.policyCheck === 'held').length;
            const perAccount = {};
            for (const db of Object.keys(FIREBASE_DB_MAP)) perAccount[db] = state.items.filter(i => i.distributed.some(d => d.dbName === db)).length;
            const manifest = state.items.map(i => ({ folder: i.folder, type: i.type, concept: i.concept, status: i.status, metadata: i.meta ? { title: i.meta.title, category: i.meta.category, tags: i.meta.tags, policy: i.meta.policyCheck, flag: i.meta.policyFlag || '', source: i.meta.source } : null, sentTo: i.distributed.map(d => ({ account: d.dbName, firebaseKey: d.key, at: new Date(d.at).toISOString(), title: d.meta && d.meta.title || '', category: d.meta && d.meta.category || '', policy: d.meta && d.meta.policyCheck || '', status: d.meta && d.meta.status || '' })) }));
            const result = { reason, items: state.items.length, generated, frames, distributed, records, metaReady, metaMissing: records - metaReady, itemsWithMeta, held, perAccount, manifest, runMetadata: !!state.settings.runMetadata && records > metaReady, targetAccount: state.settings.targetAccount, queuePath: state.settings.queuePath };
            fs.writeFileSync(RESULT_FILE, JSON.stringify(result, null, 2));
