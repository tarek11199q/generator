          .mw i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}.mw.run i{background:var(--violet);animation:pulse 1.2s infinite}.mw.off i{background:var(--err)}
          .mw b{color:var(--txt);font-weight:600}.mw .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
          .acctsum{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px 0;align-items:center}
          .acctsum .lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-right:2px}
          .acctsum button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
          .acctsum button i{width:8px;height:8px;border-radius:50%;display:inline-block}
          .acctsum button.z1 i{background:#6d8cff}.acctsum button.z2 i{background:#3ecf8e}.acctsum button.z3 i{background:#f5b63d}.acctsum button.z4 i{background:#a78bfa}
          .acctsum button b{color:var(--txt)}.acctsum button.on{background:var(--raised);color:var(--txt);border-color:var(--line2)}
          .acctsum button.none{opacity:.55}
          .ring2{width:30px;height:30px;flex:none}.ring2 circle{fill:none;stroke-width:3}.ring2 .bg{stroke:rgba(255,255,255,.08)}.ring2 .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .5s}
          .strip{display:grid;gap:6px;padding:0 14px;grid-template-columns:repeat(4,1fr)}
