                if (typeof s.runMetadata === 'boolean') state.settings.runMetadata = s.runMetadata;
                if (typeof s.autoMetadata === 'boolean') state.settings.autoMetadata = s.autoMetadata;
                if (s.autoFinishMinutes !== undefined) state.settings.autoFinishMinutes = Math.max(0, Math.min(300, parseInt(s.autoFinishMinutes, 10) || 0));
                const c = body.credentials || {};
                if (c.cloud_name && c.api_key && c.api_secret) {
                  if (!/^[A-Za-z0-9_-]{2,100}$/.test(String(c.cloud_name).trim())) throw new Error('Cloud name contains unsupported characters.');
                  creds.cloud_name = String(c.cloud_name).trim(); creds.api_key = String(c.api_key).trim(); creds.api_secret = String(c.api_secret).trim();
