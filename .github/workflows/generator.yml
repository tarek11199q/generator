            setTimeout(() => process.exit(0), 1500);
          }
          setInterval(() => {
            if (state.finished) return;
            if (Date.now() >= deadline) return finish('session timeout reached');
            const idleMin = parseInt(state.settings.autoFinishMinutes, 10) || 0;
            if (idleMin > 0 && state.items.length) {
              const busy = state.items.some(i => i.status === 'queued' || i.status === 'running' || i.distributeStatus === 'running');
              const allDistributed = state.items.filter(i => i.status === 'done').every(i => i.distributed.length > 0);
              if (!busy && (allDistributed || !state.settings.autoDistribute) && Date.now() - lastActivity > idleMin * 60000) {
                return finish(`idle for ${idleMin} min after all work completed`);
              }
            }
          }, 10000);

          // ─── HTTP ──────────────────────────────────────────────────────────────────
          const json = (res, code, obj) => { res.writeHead(code, { 'Content-Type': 'application/json; charset=utf-8', 'Cache-Control': 'no-store' }); res.end(JSON.stringify(obj)); };
          const readBody = req => new Promise((resolve, reject) => { let d = ''; req.on('data', c => { d += c; if (d.length > 5e6) req.destroy(); }); req.on('end', () => { try { resolve(d ? JSON.parse(d) : {}); } catch (e) { reject(new Error('invalid JSON body')); } }); req.on('error', reject); });
          function authed(req, url) {
