          .metab .mh .sp{flex:1}.metab .mh button{min-height:26px;padding:0 9px;font-size:11px;border-radius:6px}.metab .mh button svg{width:12px;height:12px}
          .mrow{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:start}.mrow:first-of-type{border-top:0}
          .mrow .who{display:flex;flex-direction:column;gap:4px}.mrow .who .acct{padding:4px 7px;font-size:11.5px}
          .mrow .who .pol{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;text-align:center}
          .pol.passed{background:rgba(62,207,142,.15);color:#9ef0c6}.pol.review{background:rgba(245,182,61,.15);color:#ffd27a}.pol.held{background:rgba(255,107,107,.15);color:#ffb3b3}.pol.wait{background:rgba(255,255,255,.06);color:var(--faint)}
          .mrow .body{min-width:0}.mrow .body .t{font-size:13.5px;font-weight:700;color:var(--txt);display:flex;gap:8px;align-items:center;flex-wrap:wrap;letter-spacing:-.01em}
          .mrow .body .t .cat{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;background:rgba(56,214,255,.14);color:#9de9ff}
          .mrow .body .d{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
          .mrow .body .d.open{display:block}
          .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.tags span{font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}
          .mrow .wait{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:8px}.mrow .wait i{width:8px;height:8px;border-radius:50%;background:var(--warn);animation:pulse 1.2s infinite;display:inline-block}
          .mrow .flag{font-size:11.5px;color:#ffb3b3;margin-top:4px}
