          @media(max-width:640px){.top .in{padding:10px 14px;gap:10px}.wrap{padding:14px 14px 80px}.kpis{width:100%;order:3;display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi{min-width:0;padding:8px 10px}.kpi b{font-size:14px}.kpi span{font-size:10px;white-space:normal;line-height:1.2}.actions{margin-left:auto}.brand small{display:none}.console .bar,.console pre{padding-left:14px;padding-right:14px}.strip[data-n="6"]{grid-template-columns:repeat(3,1fr)}}
          .mw.ok i{background:var(--ok)}.mw.err i{background:var(--err)}
          .ms{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.04em;text-transform:none;display:inline-flex;align-items:center;gap:5px}
          .ms.done,.ms.manual{background:rgba(62,207,142,.15);color:#9ef0c6}.ms.held{background:rgba(255,107,107,.15);color:#ffb3b3}.ms.failed{background:rgba(255,107,107,.15);color:#ffb3b3}
          .ms.queued,.ms.running{background:rgba(167,139,250,.16);color:#dccfff}.ms.none{background:rgba(255,255,255,.06);color:var(--faint)}
          .ms i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}.ms.running i{animation:pulse 1.2s infinite}
          .mbody{padding:10px 12px}.mbody .t{font-size:14px;font-weight:700;color:var(--txt);display:flex;gap:8px;align-items:center;flex-wrap:wrap;letter-spacing:-.01em}
          .mbody .t .cat{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;background:rgba(56,214,255,.14);color:#9de9ff}
          .mbody .d{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}.mbody .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.mbody .tags span{font-size:11px;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.06);color:var(--muted)}
          .mbody .flag{font-size:12px;color:#ffb3b3;margin-top:6px;padding:6px 8px;border-radius:6px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.25)}
          .mbody .wait{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:8px;line-height:1.4}.mbody .wait i{width:8px;height:8px;border-radius:50%;background:var(--violet);animation:pulse 1.2s infinite;display:inline-block;flex:none}
          .mbody .src{font-size:11px;color:var(--faint);margin-top:6px}
          .medit{display:grid;grid-template-columns:1fr 150px;gap:8px;padding:10px 12px}.medit label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
          .medit input,.medit select,.medit textarea{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;min-height:34px}.medit textarea{min-height:48px;resize:vertical}
