          .fr .re{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:7px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:grid;place-items:center;opacity:0;transition:.15s;backdrop-filter:blur(4px)}
          .fr:hover .re,.fr.failed .re{opacity:1}.fr .re svg{width:13px;height:13px}
